name: .NET CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '**/AGENTS.md'
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test QuartzDashboard.Tests -c Release --no-build

    - name: Pack
      run: dotnet pack -c Release --no-build

    - name: List NuGet artifacts
      run: ls -la QuartzDashboard/bin/Release/

  demo-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore QuartzDashboard.Demo/QuartzDashboard.Demo.csproj

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build Demo
      run: dotnet build QuartzDashboard.Demo/QuartzDashboard.Demo.csproj -c Release --no-restore

  integration-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build
      run: dotnet build QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj -c Release --no-restore

    - name: Integration Tests
      run: dotnet test QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj -c Release --no-build --verbosity normal
      timeout-minutes: 5

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, demo-build, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Pack
      run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Check package size
      run: |
        SIZE=$(stat -f%z QuartzDashboard/bin/Release/*.nupkg 2>/dev/null || stat -c%s QuartzDashboard/bin/Release/*.nupkg)
        echo "Package size: $SIZE bytes"
        if [ "$SIZE" -gt 921600 ]; then
          echo "::error::Package size exceeds 900KB limit!"
          exit 1
        fi

    - name: Push to NuGet
      run: |
        dotnet nuget push QuartzDashboard/bin/Release/*.nupkg \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Deprecate old package (Dot.QuartzPanel)
      run: |
        dotnet nuget deprecate Dot.QuartzPanel \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --alternate-package Dot.QuartzDashboard \
          --message "This package is obsolete. Use Dot.QuartzDashboard instead — a maintained, feature-rich Quartz.NET scheduler dashboard with real-time monitoring, job management, SignalR support, and more." || echo "Deprecation skipped (may already be deprecated or API key mismatch)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: QuartzDashboard/bin/Release/*.nupkg
