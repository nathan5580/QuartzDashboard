name: .NET CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '**/AGENTS.md'
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore

    - name: Check NuGet vulnerabilities
      run: |
        dotnet list package --vulnerable --include-transitive | tee vulnerable-packages.txt
        if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: QuartzDashboard/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('QuartzDashboard/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Audit frontend dependencies
      run: cd QuartzDashboard && npm run audit

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test QuartzDashboard.Tests -c Release --no-build

    - name: Pack
      run: dotnet pack -c Release --no-build

    - name: List NuGet artifacts
      run: ls -la QuartzDashboard/bin/Release/

  demo-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore QuartzDashboard.Demo/QuartzDashboard.Demo.csproj

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: QuartzDashboard/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('QuartzDashboard/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build Demo
      run: dotnet build QuartzDashboard.Demo/QuartzDashboard.Demo.csproj -c Release --no-restore

  integration-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: QuartzDashboard/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('QuartzDashboard/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build
      run: dotnet build QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj -c Release --no-restore

    - name: Integration Tests
      run: dotnet test QuartzDashboard.IntegrationTests/QuartzDashboard.IntegrationTests.csproj -c Release --no-build --verbosity normal
      timeout-minutes: 5

  auto-tag:
    if: github.event_name == 'push'
    needs: [build-and-test, demo-build, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
      tag_created: ${{ steps.tagcheck.outputs.tag_created }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Read package version
      id: pkg
      run: |
        VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' QuartzDashboard/QuartzDashboard.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Check if tag already exists
      id: tagcheck
      if: startsWith(github.ref, 'refs/heads/')
      run: |
        if git ls-remote --tags origin "refs/tags/${{ steps.pkg.outputs.tag }}" | grep -q .; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "tag_created=false" >> $GITHUB_OUTPUT
          echo "Tag ${{ steps.pkg.outputs.tag }} already exists, skipping."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "tag_created=true" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: startsWith(github.ref, 'refs/heads/') && steps.tagcheck.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
        git push origin "${{ steps.pkg.outputs.tag }}"

  publish:
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (startsWith(github.ref, 'refs/heads/') && needs.auto-tag.outputs.tag_created == 'true')
      )
    needs: [build-and-test, demo-build, integration-test, auto-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Resolve release version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ needs.auto-tag.outputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Restore
      run: dotnet restore

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: QuartzDashboard/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('QuartzDashboard/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install frontend dependencies
      run: cd QuartzDashboard && npm ci

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Pack
      run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Check package size
      run: |
        SIZE=$(stat -f%z QuartzDashboard/bin/Release/*.nupkg 2>/dev/null || stat -c%s QuartzDashboard/bin/Release/*.nupkg)
        echo "Package size: $SIZE bytes"
        if [ "$SIZE" -gt 921600 ]; then
          echo "::error::Package size exceeds 900KB limit!"
          exit 1
        fi

    - name: Push to NuGet
      run: |
        dotnet nuget push QuartzDashboard/bin/Release/*.nupkg \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Deprecate old package (Dot.QuartzPanel)
      run: |
        dotnet nuget deprecate Dot.QuartzPanel \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --alternate-package Dot.QuartzDashboard \
          --message "This package is obsolete. Use Dot.QuartzDashboard instead — a maintained, feature-rich Quartz.NET scheduler dashboard with real-time monitoring, job management, SignalR support, and more." || echo "Deprecation skipped (may already be deprecated or API key mismatch)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.auto-tag.outputs.tag }}
        generate_release_notes: true
        files: QuartzDashboard/bin/Release/*.nupkg
