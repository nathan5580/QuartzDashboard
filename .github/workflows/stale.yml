name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v11
      with:
        stale-issue-message: >
          This issue has been automatically marked as stale because it has been
          inactive for 60 days. If no further activity occurs, it will be closed
          in 14 days. Please comment if this is still relevant.
        stale-pr-message: >
          This pull request has been automatically marked as stale because it
          has been inactive for 60 days. If no further activity occurs, it will
          be closed in 14 days.
        close-issue-message: "Closed due to inactivity. Feel free to reopen if needed."
        close-pr-message: "Closed due to inactivity. Feel free to reopen if needed."
        days-before-stale: 60
        days-before-close: 14
        stale-issue-label: stale
        stale-pr-label: stale
        exempt-issue-labels: pinned,security,enhancement
        exempt-pr-labels: pinned,security,dependencies
        operations-per-run: 100