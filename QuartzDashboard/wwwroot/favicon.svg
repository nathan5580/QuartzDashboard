<!-- Favicon: simplified version of the NuGet icon.svg's Q-ring + tail mark.
     Bars + live-dot are dropped here — they're unreadable at <48px. The
     mark stays recognizable at 16×16 and matches the package icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#1a1740"/>
  <!-- Q ring: center (15,14) r=9. Gap at lower-right ~30°-70° CW from 3 o'clock.
       circumference = 2 * pi * 9 ≈ 56.55. gap-arc = 40/360 * 56.55 ≈ 6.28.
       visible = 50.27. dashoffset = -(70/360)*56.55 ≈ -11.0 -->
  <circle cx="15" cy="14" r="9"
          stroke="url(#qg)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="50.27 6.28" stroke-dashoffset="-11.0"/>
  <!-- Q tail outward to lower-right -->
  <line x1="22.5" y1="18.5" x2="27" y2="23"
        stroke="url(#qg)" stroke-width="3" stroke-linecap="round"/>
  <!-- Live dot (preserved at this size — it's the live-real-time hint) -->
  <circle cx="25" cy="9" r="2" fill="#10b981"/>
</svg>
