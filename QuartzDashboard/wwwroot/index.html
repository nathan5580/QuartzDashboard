                            <div class="w-24 h-1.5 bg-gray-700/40 rounded-full overflow-hidden">
                              <div class="h-full rounded-full duration-bar"
                                   :class="h.success ? 'bg-emerald-500' : 'bg-red-500'"
                                   :style="'width: ' + Math.min((h.durationMs || 0) / (maxHistoryDuration || 5000) * 100, 100) + '%'"></div>
                            </div>
                          </td>
                          <td>
                            <span :class="h.success ? 'badge badge-ok' : 'badge badge-error'" x-text="h.success ? 'OK' : 'Error'"></span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div x-show="!filteredHistory.length && history.length > 0" class="card-gradient text-center py-10">
                  <svg class="w-10 h-10 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <p class="text-sm text-gray-500">No records match filter</p>
                  <button @click="historyFilter = ''" class="btn btn-ghost mt-2 text-xs">Clear filter</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== GRAPH PAGE ===================== -->
      <template x-if="currentPage === 'graph'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Execution Graph</h1>
                <p class="text-xs text-gray-500 mt-0.5">Execution rate and duration over time</p>
              </div>
              <div class="flex items-center gap-2">
                <button @click="graphView = 'live'" :class="['btn', graphView === 'live' ? 'btn-primary' : 'btn-ghost']">Last 5 min</button>
                <button @click="graphView = 'hour'" :class="['btn', graphView === 'hour' ? 'btn-primary' : 'btn-ghost']">All</button>
                <button @click="loadStats()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.stats">
              <div class="card-gradient">
                <div class="sk h-72 w-full rounded-lg"></div>
                <div class="flex justify-center gap-8 mt-6 pt-4 border-t border-white/[0.04]">
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                </div>
              </div>
            </template>

            <!-- Graph -->
            <template x-if="!loading.stats">
              <div class="card-gradient">
                <div class="relative" x-ref="graphContainer">
                  <svg :width="graphWidth" :height="graphHeight" class="w-full" :viewBox="'0 0 ' + graphWidth + ' ' + graphHeight" preserveAspectRatio="xMidYMid meet">
                    <!-- Grid lines -->
                    <template x-for="i in 5" :key="'grid-' + i">
                      <line :x1="graphMargin.left" :y1="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5"
                            :x2="graphWidth - graphMargin.right" :y2="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5"
                            stroke="#1f2937" stroke-width="0.5" stroke-dasharray="4,4"/>
                    </template>
                    <!-- Y axis labels (count) left -->
                    <template x-for="i in 5" :key="'ycount-' + i">
                      <text :x="graphMargin.left - 8" :y="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5 + 3"
                            text-anchor="end" class="fill-gray-600 text-[9px] font-mono">
                        <tspan x-text="Math.round((graphMaxCount || 10) * (1 - i / 5))"></tspan>
                      </text>
                    </template>
                    <!-- Y axis labels (duration) right -->
                    <template x-for="i in 4" :key="'ydur-' + i">
                      <text :x="graphWidth - graphMargin.right + 8" :y="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 4 + 3"
                            text-anchor="start" class="fill-gray-600 text-[9px] font-mono">
                        <tspan x-text="Math.round((graphMaxDuration || 1000) * (1 - i / 4)) + 'ms'"></tspan>
                      </text>
                    </template>
                    <!-- X axis labels -->
                    <template x-for="(bucket, idx) in graphData" :key="'xlabel-' + idx">
                      <text x-if="idx % Math.max(1, Math.floor(graphData.length / 6)) === 0"
                            :x="graphX(idx)" :y="graphHeight - graphMargin.bottom + 14"
                            text-anchor="middle" class="fill-gray-600 text-[8px] font-mono"
                            x-text="formatTimeShort(bucket.minute)"></text>
                    </template>
                    <!-- Gradients -->
                    <defs>
                      <linearGradient id="countGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#818cf8" stop-opacity="0.01"/>
                      </linearGradient>
                      <linearGradient id="durationGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
                        <stop offset="100%" stop-color="#34d399" stop-opacity="0.01"/>
                      </linearGradient>
                    </defs>
                    <!-- Area fill for count -->
                    <polygon :points="countAreaPoints()" fill="url(#countGradient)"/>
                    <!-- Count line -->
                    <polyline :points="graphLinePoints('count')" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Duration line -->
                    <polyline :points="graphLinePoints('avgDurationMs')" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Data points -->
                    <template x-for="(bucket, idx) in graphData" :key="'pt-' + idx">
                      <circle :cx="graphX(idx)" :cy="graphY(bucket.count, graphMaxCount || 10)" r="3" fill="#818cf8" class="cursor-pointer"
                              @mouseenter="graphTooltip = { show: true, x: graphX(idx), y: graphY(bucket.count, graphMaxCount || 10) - 10, bucket: bucket }"
                              @mouseleave="graphTooltip.show = false"/>
                    </template>
                    <!-- Legend -->
                    <line x1="16" :y1="graphHeight - graphMargin.bottom + 34" x2="36" :y2="graphHeight - graphMargin.bottom + 34" stroke="#818cf8" stroke-width="2"/>
                    <text x="40" :y="graphHeight - graphMargin.bottom + 37" class="fill-gray-400 text-[9px] font-medium">Executions</text>
                    <line x1="16" :y1="graphHeight - graphMargin.bottom + 48" x2="36" :y2="graphHeight - graphMargin.bottom + 48" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3"/>
                    <text x="40" :y="graphHeight - graphMargin.bottom + 51" class="fill-gray-400 text-[9px] font-medium">Avg Duration</text>
                    <!-- Hover vertical rule -->
                    <line x-show="graphTooltip.show" :x1="graphTooltip.x" y1="0" :y2="graphHeight" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3" style="display: none;"/>
                  </svg>
                  <!-- Tooltip -->
                  <div x-show="graphTooltip.show" :style="'left: ' + graphTooltip.x + 'px;'" class="graph-tooltip" style="display: none;">
                    <div class="text-gray-200 font-medium text-xs mb-1" x-text="'Minute: ' + formatTimeShort(graphTooltip.bucket.minute)"></div>
                    <div class="flex items-center gap-2 text-xs">
                      <span class="w-2 h-2 rounded-full bg-quartz-400"></span>
                      <span x-text="'Executions: ' + graphTooltip.bucket.count"></span>
                    </div>
                    <div class="flex items-center gap-2 text-xs mt-0.5">
                      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                      <span x-text="'Avg Duration: ' + Math.round(graphTooltip.bucket.avgDurationMs || 0) + 'ms'"></span>
                    </div>
                    <div x-show="graphTooltip.bucket.errorRate !== undefined" class="flex items-center gap-2 text-xs mt-0.5 text-red-400">
                      <span class="w-2 h-2 rounded-full bg-red-400"></span>
                      <span x-text="'Error Rate: ' + (graphTooltip.bucket.errorRate * 100).toFixed(1) + '%'"></span>
                    </div>
                  </div>
                </div>
                <!-- Stats footer -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-4 border-t border-white/[0.04]">
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Peak Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="Math.max(...graphData.map(b => b.count || 0), 0) + '/min'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Avg Duration</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="graphData.length ? Math.round(graphData.reduce((a,b) => a + (b.avgDurationMs||0), 0) / graphData.length) + 'ms' : '\u2014'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Total Executions</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="stats.totalExecutions || 0"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Current Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="(stats.executionRate || 0).toFixed(2) + '/s'"></p>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== TIMELINE PAGE ===================== -->
      <template x-if="currentPage === 'timeline'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Timeline</h1>
                <p class="text-xs text-gray-500 mt-0.5">Last 50 fire events in real-time</p>
              </div>
              <button @click="loadTimeline()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
              </button>
            </div>

            <div class="card-gradient">
              <div class="relative overflow-x-auto" x-ref="timelineContainer" style="height: 400px;">
                <template x-if="loading.timeline">
                  <div class="flex items-center justify-center h-full">
                    <div class="spinner w-6 h-6"></div>
                  </div>
                </template>
                <template x-if="!loading.timeline && !timelineEvents.length">
                  <div class="flex items-center justify-center h-full text-sm text-gray-500">
                    No timeline events yet
                  </div>
                </template>
                <template x-if="!loading.timeline && timelineEvents.length">
                  <div class="relative" :style="'height: ' + timelineHeight + 'px; min-width: 100%; width: ' + timelineWidth + 'px'">
                    <!-- Y-axis labels (job names) -->
                    <div class="absolute left-0 top-0 bottom-8 w-36 flex flex-col justify-around pointer-events-none z-10">
                      <template x-for="(jobName, idx) in timelineYLabels" :key="jobName">
                        <div class="text-[10px] text-gray-500 truncate px-2 leading-none" 
                             :style="'position: absolute; top: ' + (timelineRowCenter(idx)) + 'px; transform: translateY(-50%)'"
                             x-text="jobName"></div>
                      </template>
                    </div>
                    <!-- SVG area -->
                    <svg :width="timelineWidth" :height="timelineHeight" class="absolute left-36 top-0 overflow-visible">
                      <!-- Grid lines (vertical, time markers) -->
                      <template x-for="i in 6" :key="'tgrid-' + i">
                        <line :x1="timelineXForTime(now - (60000/6) * i)" y1="0" 
                              :x2="timelineXForTime(now - (60000/6) * i)" :y2="timelineHeight - 30"
                              stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2,3"/>
                      </template>
                      <!-- Time labels -->
                      <template x-for="i in 6" :key="'tlabel-' + i">
                        <text :x="timelineXForTime(now - (60000/6) * i)" :y="timelineHeight - 12"
                              text-anchor="middle" class="fill-gray-600 text-[8px] font-mono">
                          <tspan x-text="formatTimeShort(new Date(now - (60000/6) * i))"></tspan>
                        </text>
                      </template>
                      <!-- Horizontal separator lines -->
                      <template x-for="(jobName, idx) in timelineYLabels" :key="'hline-' + idx">
                        <line x1="0" :y1="timelineRowCenter(idx)" 
                              :x2="timelineWidth" :y2="timelineRowCenter(idx)"
                              stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
                      </template>
                      <!-- Current time indicator line -->
                      <line :x1="timelineXForTime(now)" y1="0" :x2="timelineXForTime(now)" :y2="timelineHeight - 30"
                            stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" opacity="0.8">
                        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
                      </line>
                      <!-- Event dots -->
                      <template x-for="(evt, idx) in timelineEvents" :key="evt.fireTime + '-' + evt.jobKey + '-' + idx">
                        <g>
                          <circle :cx="timelineXForTime(new Date(evt.fireTime).getTime())"
                                  :cy="timelineYForJob(evt.jobKey)"
                                  r="5"
                                  :class="'timeline-dot ' + (evt.success ? 'timeline-dot-success' : 'timeline-dot-error')"
                                  @mouseenter="timelineTooltip = { show: true, event: evt, x: timelineXForTime(new Date(evt.fireTime).getTime()) - 18, y: timelineYForJob(evt.jobKey) - 14 }"
                                  @mouseleave="timelineTooltip.show = false">
                          </circle>
                        </g>
                      </template>
                    </svg>
                    <!-- Tooltip -->
                    <div x-show="timelineTooltip.show" 
                         :style="'left: ' + timelineTooltip.x + 'px; top: ' + timelineTooltip.y + 'px;'" 
                         class="timeline-tooltip" style="display: none;">
                      <div class="text-gray-200 font-medium text-xs" x-text="timelineTooltip.event.jobKey"></div>
                      <div class="text-[10px] text-gray-400" x-text="'Trigger: ' + timelineTooltip.event.triggerKey"></div>
                      <div class="text-[10px] text-gray-400" x-text="'Duration: ' + formatDuration(timelineTooltip.event.duration)"></div>
                      <div class="text-[10px] mt-0.5" :class="timelineTooltip.event.success ? 'text-emerald-400' : 'text-red-400'" x-text="timelineTooltip.event.success ? 'Success' : 'Error'"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===================== SETTINGS PAGE ===================== -->
      <template x-if="currentPage === 'settings'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div>
              <h1 class="text-lg font-semibold tracking-tight text-gray-100">Settings</h1>
              <p class="text-xs text-gray-500 mt-0.5">Configure dashboard behavior</p>
            </div>

            <div class="card-gradient space-y-6">
              <!-- Refresh Interval -->
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-sm font-semibold text-gray-200">Refresh Interval</h2>
                  <span class="text-sm font-mono text-quartz-400 tabular-nums font-medium" x-text="settings.refreshInterval + 's'"></span>
                </div>
                <input type="range" x-model="settings.refreshInterval" min="1" max="60" step="1" class="w-full max-w-md">
                <p class="text-xs text-gray-500 mt-1.5">How often the dashboard auto-refreshes data (1-60 seconds).</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Auto-refresh per page -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">Auto-Refresh by Page</h2>
                <div class="space-y-1">
                  <template x-for="item in navItems" :key="item.id">
                    <label class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-white/[0.02] cursor-pointer transition-colors">
                      <div class="flex items-center gap-3">
                        <span x-html="item.icon" class="w-4 h-4 text-gray-500 flex-shrink-0"></span>
                        <span class="text-sm text-gray-300" x-text="item.label"></span>
                      </div>
                      <div @click="toggleAutoRefresh(item.id)"
                           :class="['toggle', settings.autoRefreshPages[item.id] ? 'toggle-on' : 'toggle-off']">
                        <div :class="['toggle-knob', settings.autoRefreshPages[item.id] ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                      </div>
                    </label>
                  </template>
                </div>
                <p class="text-xs text-gray-500 mt-2">Enable or disable auto-refresh for each page individually.</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Light mode -->
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-sm font-semibold text-gray-200">Appearance</h2>
                </div>
                <label class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-white/[0.02] cursor-pointer transition-colors">
                  <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span class="text-sm text-gray-300">Light Mode</span>
                  </div>
                  <div @click="toggleLightMode()"
                       :class="['toggle', lightMode ? 'toggle-on' : 'toggle-off']">
                    <div :class="['toggle-knob', lightMode ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                  </div>
                </label>
                <p class="text-xs text-gray-500 mt-2">Toggle between dark and light appearance.</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Connection info -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">Connection</h2>
                <div class="text-xs text-gray-500 space-y-1.5">
                  <p>Status: <span class="font-medium" :class="signalRConnected ? 'text-emerald-400' : signalRPolling ? 'text-amber-400' : 'text-gray-400'" x-text="connectionStatus"></span></p>
                  <p>Hub: <code class="mono text-quartz-400 bg-quartz-500/10 px-1.5 py-0.5 rounded text-[11px]">/quartz/hub</code></p>
                </div>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- About -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">About</h2>
                <div class="text-xs text-gray-500 space-y-1.5">
                  <p>Quartz Dashboard <span class="text-gray-400">v0.2</span></p>
                  <p>Built with Alpine.js 3.x + Tailwind CSS v4 + SignalR</p>
                  <p>Single-file SPA \u2014 no build step required</p>
                  <p class="mt-3">API endpoints: <code class="mono text-quartz-400 bg-quartz-500/10 px-1.5 py-0.5 rounded text-[11px]">/quartz/api/*</code></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- ===================== FOOTER STATUS BAR ===================== -->
  <div class="footer-bar">
    <div class="flex items-center gap-4 w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-1.5">
        <span class="relative inline-flex">
          <span :class="['status-dot w-2 h-2', scheduler.isStarted && !scheduler.isStandbyMode ? 'status-dot-running' : scheduler.isStandbyMode ? 'status-dot-standby' : 'status-dot-stopped']"></span>
        </span>
        <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'" class="font-medium text-gray-400"></span>
      </div>
      <span class="text-gray-600">|</span>
      <span><span class="text-gray-500">Jobs:</span> <span class="text-gray-400 font-medium" x-text="jobs.length"></span></span>
      <span class="text-gray-600 hidden sm:inline">|</span>
      <span class="hidden sm:inline"><span class="text-gray-500">Triggers:</span> <span class="text-gray-400 font-medium" x-text="triggers.length"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline"><span class="text-gray-500">Instance:</span> <span class="text-gray-400 mono" x-text="scheduler.instanceId ? scheduler.instanceId.slice(0, 20) : '\u2014'"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline">
        <span :class="signalRConnected ? 'text-emerald-400' : signalRPolling ? 'text-amber-400' : 'text-gray-500'" x-text="connectionStatus"></span>
      </span>
      <span class="ml-auto text-gray-600">
        Last refreshed: <span class="text-gray-400" x-text="lastRefreshed ? formatDate(lastRefreshed) : '\u2014'"></span>
      </span>
    </div>
  </div>

  <script>
    function dashboard() {
      return {
        // ========================= STATE =========================
        currentPage: 'overview',
        sidebarOpen: true,
        lastRefreshed: null,
        loading: { global: false, jobs: false, triggers: false, executing: false, history: false, stats: false, timeline: false },
        scheduler: { isStarted: false, isStandbyMode: false, numberOfJobsExecuted: 0 },
        jobs: [],
        triggers: [],
        executingJobs: [],
        history: [],
        stats: {},
        executionBuckets: [],
        toast: { show: false, message: '', type: 'info' },
        autoRefreshTimer: null,

        // Jobs page
        jobsFilter: '',
        expandedJobs: {},

        // Triggers page
        expandedTriggerGroups: {},

        // Executing page
        knownExecutingIds: new Set(),

        // History page
        historyFilter: '',
        maxHistoryDuration: 0,

        // Graph page
        graphView: 'live',
        graphWidth: 800,
        graphHeight: 320,
        graphMargin: { top: 20, right: 60, bottom: 30, left: 40 },
        graphTooltip: { show: false, x: 0, y: 0, bucket: { minute: '', count: 0, avgDurationMs: 0 } },
        graphMaxCount: 10,
        graphMaxDuration: 1000,
        graphData: [],

        // Sparklines
        sparklineW: 80,
        sparklineH: 30,

        // Settings
        settings: {
          refreshInterval: 5,
          autoRefreshPages: {
            overview: true,
            jobs: true,
            triggers: true,
            executing: true,
            history: true,
            graph: true,
            timeline: true,
            settings: false
          }
        },

        // ========================= SIGNALR / CONNECTION =========================
        // Debounce utility
        _debounceTimers: {},
        debounce(fn, key, ms) {
          if (this._debounceTimers[key]) clearTimeout(this._debounceTimers[key]);
          this._debounceTimers[key] = setTimeout(() => { delete this._debounceTimers[key]; fn(); }, ms);
        },

        signalRConnected: false,
        signalRPolling: false,
        connection: null,
        connectionAttempts: 0,
        pollingTimer: null,
        signalRTimeout: null,

        // ========================= TOAST QUEUE =========================
        toastQueue: [],
        toastIdCounter: 0,

        // ========================= COMMAND PALETTE =========================
        showCommandPalette: false,
        commandPaletteQuery: '',
        commandPaletteIndex: 0,

        // ========================= LIGHT MODE =========================
        lightMode: false,

        // ========================= CREATE JOB MODAL =========================
        showCreateJobModal: false,
        newJob: {
          name: '',
          group: 'DEFAULT',
          description: '',
          jobType: '',
          isDurable: false,
          disallowConcurrentExecution: false,
          persistJobDataAfterExecution: false
        },

        // ========================= CREATE TRIGGER MODAL =========================
        showCreateTriggerModal: false,
        newTrigger: {
          name: '',
          group: 'DEFAULT',
          jobName: '',
          jobGroup: 'DEFAULT',
          description: '',
          triggerType: 'cron',
          cronExpression: '',
          intervalSeconds: null,
          repeatCount: -1,
          priority: 5,
          startTimeUtc: '',
          endTimeUtc: ''
        },

        // ========================= DELETE CONFIRM =========================
        showDeleteConfirm: false,
        deleteConfirmMessage: '',
        deletePending: null,

        // ========================= TIMELINE =========================
        timelineEvents: [],
        timelineWidth: 800,
        timelineHeight: 400,
        timelineTooltip: { show: false, event: null, x: 0, y: 0 },
        timelineNowInterval: null,
        timelineAnimFrame: null,

        navItems: [
          { id: 'overview', label: 'Overview', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>' },
          { id: 'jobs', label: 'Jobs', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>' },
          { id: 'triggers', label: 'Triggers', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' },
          { id: 'executing', label: 'Executing', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
          { id: 'history', label: 'History', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
          { id: 'graph', label: 'Graph', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>' },
          { id: 'timeline', label: 'Timeline', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>' },
          { id: 'settings', label: 'Settings', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>' },
        ],

        // ========================= COMPUTED =========================
        get filteredJobs() {
          if (!this.jobsFilter) return this.jobs;
          const q = this.jobsFilter.toLowerCase();
          return this.jobs.filter(j =>
            j.name.toLowerCase().includes(q) ||
            j.group.toLowerCase().includes(q) ||
            (j.jobType || '').toLowerCase().includes(q)
          );
        },

        get groupedTriggers() {
          const groups = {};
          for (const t of this.triggers) {
            const key = t.jobGroup + '.' + t.jobName;
            if (!groups[key]) groups[key] = { jobName: key, triggers: [] };
            groups[key].triggers.push(t);
          }
          return Object.values(groups);
        },

        get filteredHistory() {
          if (!this.historyFilter) return this.history;
          const q = this.historyFilter.toLowerCase();
          return this.history.filter(h => (h.jobKey || '').toLowerCase().includes(q));
        },

        get statsLoading() {
          return this.loading.stats;
        },

        get connectionStatus() {
          if (this.signalRConnected) return 'Live';
          if (this.signalRPolling) {
            const secs = Math.floor((Date.now() - (this.lastPollingTime || Date.now())) / 1000);
            return 'Polling (' + secs + 's)';
          }
          return 'Connecting...';
        },

        // ========================= COMMAND PALETTE COMPUTED =========================
        get commandPaletteCommands() {
          const cmds = [];
          for (const item of this.navItems) {
            cmds.push({ id: 'nav-' + item.id, label: 'Go to ' + item.label, icon: item.icon, action: 'navigate', page: item.id, shortcut: this.navItems.indexOf(item) + 1 });
          }
          for (const job of this.jobs) {
            cmds.push({ id: 'trigger-' + job.group + '.' + job.name, label: 'Trigger job ' + job.group + '.' + job.name, icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 5v14l11-7z"/></svg>', action: 'triggerJob', group: job.group, name: job.name });
          }
          return cmds;
        },

        get filteredCommands() {
          if (!this.commandPaletteQuery) return this.commandPaletteCommands;
          const q = this.commandPaletteQuery.toLowerCase();
          return this.commandPaletteCommands.filter(c => c.label.toLowerCase().includes(q));
        },

        // ========================= TIMELINE COMPUTED =========================
        get timelineYLabels() {
          const labels = [];
          for (const evt of this.timelineEvents) {
            if (!labels.includes(evt.jobKey)) labels.push(evt.jobKey);
          }
          return labels;
        },

        get now() {
          return Date.now();
        },

        timelineRowCenter(idx) {
          const rowH = Math.max(40, (this.timelineHeight - 30) / Math.max(this.timelineYLabels.length, 1));
          return (idx + 0.5) * rowH;
        },

        timelineXForTime(timeMs) {
          const now = Date.now();
          const range = 60000; // 60 seconds visible
          const leftTime = now - range;
          const w = this.timelineWidth - 10;
          const frac = (timeMs - leftTime) / range;
          return Math.max(0, Math.min(w, frac * w + 5));
        },

        timelineYForJob(jobKey) {
          const idx = this.timelineYLabels.indexOf(jobKey);
          if (idx === -1) return 20;
          return this.timelineRowCenter(idx);
        },

        // ========================= INIT =========================
        async init() {
          // Load theme preference
          const savedTheme = localStorage.getItem('quartz-dashboard-theme');
          if (savedTheme === 'light') {
            this.lightMode = true;
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.body.classList.add('light');
          }

          // Setup keyboard shortcuts
          document.addEventListener('keydown', (e) => this.handleKeydown(e));

          // Start SignalR connection
          await this.connectSignalR();

          // Fallback: if SignalR doesn't connect in 5 seconds, start polling
          this.signalRTimeout = setTimeout(() => {
            if (!this.signalRConnected) {
              this.signalRPolling = true;
              this.lastPollingTime = Date.now();
              this.startPollingFallback();
            }
          }, 5000);

          // Initial data load
          await this.refreshAll();
          await this.loadHistory();
          await this.loadStats();

          this.startAutoRefresh();
          this.$watch('currentPage', (val) => { this.onPageChange(val); });
          this.$watch('settings.refreshInterval', () => { this.startAutoRefresh(); });
          if (this.$refs && this.$refs.graphContainer) {
            this.updateGraphSize();
          }
          window.addEventListener('resize', () => this.updateGraphSize());

          // Start timeline now ticker
          this.timelineNowInterval = setInterval(() => {
            if (this.currentPage === 'timeline') {
              // Force re-render by touching a watched property
              this.timelineWidth = this.timelineWidth + 0.01;
            }
          }, 1000);
        },

        // ========================= SIGNALR =========================
        async connectSignalR() {
          try {
            this.connection = new signalR.HubConnectionBuilder()
              .withUrl('/quartz/hub')
              .withAutomaticReconnect([0, 2000, 5000, 10000, 30000])
              .build();

            this.connection.on('jobExecutedBatch', (events) => {
              events.forEach(e => this.handleJobExecuted(e));
            });

            this.connection.on('jobTriggeredBatch', (events) => {
              events.forEach(e => this.handleJobTriggered(e));
            });

            this.connection.on('schedulerStatus', (data) => {
              this.handleSchedulerStatus(data);
            });

            this.connection.on('jobsUpdated', (data) => {
              this.handleJobsUpdated(data);
            });

            this.connection.onreconnecting(() => {
              this.signalRConnected = false;
            });

            this.connection.onreconnected(() => {
              this.signalRConnected = true;
              this.signalRPolling = false;
              this.stopPollingFallback();
              this.refreshAll();
            });

            this.connection.onclose(() => {
              this.signalRConnected = false;
              if (!this.signalRPolling) {
                this.signalRPolling = true;
                this.lastPollingTime = Date.now();
                this.startPollingFallback();
              }
            });

            await this.connection.start();
            await this.connection.invoke('Subscribe');
            this.signalRConnected = true;
            if (this.signalRTimeout) {
              clearTimeout(this.signalRTimeout);
              this.signalRTimeout = null;
            }
          } catch (err) {
            console.error('SignalR connection failed:', err);
            this.signalRConnected = false;
          }
        },

        handleJobExecuted(data) {
          // Append to history
          if (data.jobKey) {
            this.history.unshift(data);
            if (this.history.length > 500) this.history.length = 500;
            // Update maxHistoryDuration
            const d = data.durationMs || 0;
            if (d > this.maxHistoryDuration) this.maxHistoryDuration = d;
          }

          // Update executionBuckets if we have stats
          if (this.executionBuckets.length) {
            const now = new Date();
            const bucketMinute = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes()).toISOString();
            let bucket = this.executionBuckets[this.executionBuckets.length - 1];
            if (bucket && bucket.minute === bucketMinute) {
              bucket.count = (bucket.count || 0) + 1;
              const prevAvg = bucket.avgDurationMs || 0;
              const prevCount = bucket.count - 1;
              bucket.avgDurationMs = prevCount > 0 ? (prevAvg * prevCount + (data.durationMs || 0)) / bucket.count : (data.durationMs || 0);
              if (data.success === false) {
                bucket.errorRate = ((bucket.errorRate || 0) * prevCount + 1) / bucket.count;
              }
            } else {
              this.executionBuckets.push({
                minute: bucketMinute,
                count: 1,
                avgDurationMs: data.durationMs || 0,
                errorRate: data.success === false ? 1 : 0
              });
              if (this.executionBuckets.length > 60) this.executionBuckets.shift();
            }
          }

          // Update stat counts
          this.scheduler.numberOfJobsExecuted = (this.scheduler.numberOfJobsExecuted || 0) + 1;

          // Remove from executingJobs if present
          if (data.fireInstanceId) {
            this.executingJobs = this.executingJobs.filter(ej => ej.fireInstanceId !== data.fireInstanceId);
          }

          // Update graph data
          this.graphData = this.getGraphData();

          // Add to timeline
          this.addTimelineEvent(data);
        },

        handleJobTriggered(data) {
          // Add to executingJobs
          if (data.jobName) {
            // Check if already there
            const exists = this.executingJobs.some(ej => ej.fireInstanceId === data.fireInstanceId);
            if (!exists) {
              this.executingJobs.push(data);
            }
            // Show brief toast if on executing page
            if (this.currentPage === 'executing') {
              this.showToast('Job triggered: ' + (data.jobName || data.jobKey), 'info');
            }
          }
        },

        handleSchedulerStatus(data) {
          if (data) {
            if (data.isStarted !== undefined) this.scheduler.isStarted = data.isStarted;
            if (data.isStandbyMode !== undefined) this.scheduler.isStandbyMode = data.isStandbyMode;
            if (data.numberOfJobsExecuted !== undefined) this.scheduler.numberOfJobsExecuted = data.numberOfJobsExecuted;
            if (data.name !== undefined) this.scheduler.name = data.name;
            if (data.instanceId !== undefined) this.scheduler.instanceId = data.instanceId;
            if (data.version !== undefined) this.scheduler.version = data.version;
          }
        },

        handleJobsUpdated(data) {
          // Silently refresh jobs and triggers
          this.loadJobs();
          this.loadTriggers();
        },

        // ========================= POLLING FALLBACK =========================
        startPollingFallback() {
          this.stopPollingFallback();
          this.pollingTimer = setInterval(() => {
            this.refreshAll();
            this.lastPollingTime = Date.now();
          }, this.settings.refreshInterval * 1000);
        },

        stopPollingFallback() {
          if (this.pollingTimer) {
            clearInterval(this.pollingTimer);
            this.pollingTimer = null;
          }
        },

        // ========================= KEYBOARD SHORTCUTS =========================
        handleKeydown(e) {
          // Command palette: Cmd+K or Ctrl+K
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            this.openCommandPalette();
            return;
          }

          // Escape: close modals
          if (e.key === 'Escape') {
            if (this.showCommandPalette) { this.showCommandPalette = false; return; }
            if (this.showCreateJobModal) { this.showCreateJobModal = false; return; }
            if (this.showCreateTriggerModal) { this.showCreateTriggerModal = false; return; }
            if (this.showDeleteConfirm) { this.showDeleteConfirm = false; return; }
            return;
          }

          // If command palette is open, handle arrow keys internally
          if (this.showCommandPalette) return;

          // Number keys 1-8: switch pages
          const num = parseInt(e.key);
          if (num >= 1 && num <= 8 && !e.metaKey && !e.ctrlKey && !e.altKey) {
            const idx = num - 1;
            if (idx < this.navItems.length) {
              this.currentPage = this.navItems[idx].id;
              e.preventDefault();
            }
            return;
          }

          // r: refresh
          if (e.key === 'r' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
            // Only if no input is focused
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') {
              e.preventDefault();
              this.refreshPage(this.currentPage);
            }
            return;
          }

          // /: focus search on jobs or history page
          if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
              if (this.currentPage === 'jobs') {
                e.preventDefault();
                // Focus the jobs search input - find it in DOM
                const input = document.querySelector('input[x-model="jobsFilter"]');
                if (input) input.focus();
              } else if (this.currentPage === 'history') {
                e.preventDefault();
                const input = document.querySelector('input[x-model="historyFilter"]');
                if (input) input.focus();
              }
            }
          }
        },

        // ========================= COMMAND PALETTE =========================
        openCommandPalette() {
          this.showCommandPalette = true;
          this.commandPaletteQuery = '';
          this.commandPaletteIndex = 0;
          this.$nextTick(() => {
            const input = this.$refs && this.$refs.commandPaletteInput;
            if (input) input.focus();
          });
        },

        commandPalettePrev() {
          if (this.filteredCommands.length === 0) return;
          this.commandPaletteIndex = (this.commandPaletteIndex - 1 + this.filteredCommands.length) % this.filteredCommands.length;
          this.scrollCommandIntoView();
        },

        commandPaletteNext() {
          if (this.filteredCommands.length === 0) return;
          this.commandPaletteIndex = (this.commandPaletteIndex + 1) % this.filteredCommands.length;
          this.scrollCommandIntoView();
        },

        scrollCommandIntoView() {
          this.$nextTick(() => {
            const list = this.$refs && this.$refs.commandPaletteList;
            if (!list) return;
            const items = list.querySelectorAll('.command-item');
            if (items[this.commandPaletteIndex]) {
              items[this.commandPaletteIndex].scrollIntoView({ block: 'nearest' });
            }
          });
        },

        commandPaletteSelect() {
          const cmds = this.filteredCommands;
          if (cmds.length > 0 && this.commandPaletteIndex < cmds.length) {
            this.executeCommand(cmds[this.commandPaletteIndex]);
          }
        },

        executeCommand(cmd) {
          this.showCommandPalette = false;
          if (cmd.action === 'navigate') {
            this.currentPage = cmd.page;
          } else if (cmd.action === 'triggerJob') {
            this.triggerJob(cmd.group, cmd.name);
          }
        },

        // ========================= LIGHT MODE =========================
        toggleLightMode() {
          this.lightMode = !this.lightMode;
          if (this.lightMode) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.body.classList.add('light');
            localStorage.setItem('quartz-dashboard-theme', 'light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.body.classList.remove('light');
            localStorage.setItem('quartz-dashboard-theme', 'dark');
          }
        },

        // ========================= CREATE JOB =========================
        async submitCreateJob() {
          if (!this.newJob.name) return;
          this.loading.global = true;
          try {
            const body = {};
            if (this.newJob.name) body.name = this.newJob.name;
            if (this.newJob.group && this.newJob.group !== 'DEFAULT') body.group = this.newJob.group;
            if (this.newJob.description) body.description = this.newJob.description;
            if (this.newJob.jobType) body.jobType = this.newJob.jobType;
            if (this.newJob.isDurable) body.isDurable = true;
            if (this.newJob.persistJobDataAfterExecution) body.persistJobDataAfterExecution = true;
            if (this.newJob.disallowConcurrentExecution) body.disallowConcurrentExecution = true;

            const res = await fetch('/quartz/api/jobs', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

            this.showToast('Job ' + this.newJob.name + ' created', 'success');
            this.showCreateJobModal = false;
            this.newJob = { name: '', group: 'DEFAULT', description: '', jobType: '', isDurable: false, disallowConcurrentExecution: false, persistJobDataAfterExecution: false };
            await this.loadJobs();
          } catch (e) {
            this.showToast('Failed to create job: ' + e.message, 'error');
          }
          this.loading.global = false;
        },

        // ========================= CREATE TRIGGER =========================
        async submitCreateTrigger() {
          if (!this.newTrigger.name || !this.newTrigger.jobName) return;
          if (this.newTrigger.triggerType === 'cron' && !this.newTrigger.cronExpression) return;
          if (this.newTrigger.triggerType === 'simple' && !this.newTrigger.intervalSeconds) return;

          this.loading.global = true;
          try {
            const body = { name: this.newTrigger.name };
            if (this.newTrigger.group && this.newTrigger.group !== 'DEFAULT') body.group = this.newTrigger.group;
            body.jobName = this.newTrigger.jobName;
            if (this.newTrigger.jobGroup && this.newTrigger.jobGroup !== 'DEFAULT') body.jobGroup = this.newTrigger.jobGroup;
            if (this.newTrigger.description) body.description = this.newTrigger.description;

            if (this.newTrigger.triggerType === 'cron') {
              body.cronExpression = this.newTrigger.cronExpression;
            } else {
              body.intervalSeconds = this.newTrigger.intervalSeconds;
              if (this.newTrigger.repeatCount !== null && this.newTrigger.repeatCount !== undefined) {
                body.repeatCount = this.newTrigger.repeatCount;
              }
            }

            if (this.newTrigger.priority !== null && this.newTrigger.priority !== undefined) {
              body.priority = this.newTrigger.priority;
            }
            if (this.newTrigger.startTimeUtc) {
              const d = new Date(this.newTrigger.startTimeUtc);
              body.startTimeUtc = d.toISOString();
            }
            if (this.newTrigger.endTimeUtc) {
              const d = new Date(this.newTrigger.endTimeUtc);
              body.endTimeUtc = d.toISOString();
            }

            const res = await fetch('/quartz/api/triggers', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

            this.showToast('Trigger ' + this.newTrigger.name + ' created', 'success');
            this.showCreateTriggerModal = false;
            this.newTrigger = { name: '', group: 'DEFAULT', jobName: '', jobGroup: 'DEFAULT', description: '', triggerType: 'cron', cronExpression: '', intervalSeconds: null, repeatCount: -1, priority: 5, startTimeUtc: '', endTimeUtc: '' };
            await this.loadTriggers();
          } catch (e) {
            this.showToast('Failed to create trigger: ' + e.message, 'error');
          }
          this.loading.global = false;
        },

        // ========================= DELETE JOB =========================
        deleteJob(group, name) {
          this.deleteConfirmMessage = 'Are you sure you want to delete job ' + group + '.' + name + '?';
          this.deletePending = { type: 'job', group: group, name: name };
          this.showDeleteConfirm = true;
        },

        // ========================= DELETE TRIGGER =========================
        deleteTrigger(group, name) {
          this.deleteConfirmMessage = 'Are you sure you want to delete trigger ' + group + '.' + name + '?';
          this.deletePending = { type: 'trigger', group: group, name: name };
          this.showDeleteConfirm = true;
        },

        // Delete trigger from job inline details
        deleteJobTrigger(jobGroup, jobName, triggerGroup, triggerName) {
          this.deleteConfirmMessage = 'Are you sure you want to delete trigger ' + triggerGroup + '.' + triggerName + '?';
          this.deletePending = { type: 'trigger', group: triggerGroup, name: triggerName };
          this.showDeleteConfirm = true;
        },

        async executeDelete() {
          if (!this.deletePending) return;
          this.loading.global = true;
          try {
            const { type, group, name } = this.deletePending;
            const endpoint = type === 'job'
              ? '/quartz/api/jobs/' + encodeURIComponent(group) + '/' + encodeURIComponent(name)
              : '/quartz/api/triggers/' + encodeURIComponent(group) + '/' + encodeURIComponent(name);

            const res = await fetch(endpoint, { method: 'DELETE' });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || res.statusText);
            }

            this.showToast((type === 'job' ? 'Job' : 'Trigger') + ' ' + group + '.' + name + ' deleted', 'success');
            this.showDeleteConfirm = false;
            this.deletePending = null;

            if (type === 'job') await this.loadJobs();
            else await this.loadTriggers();
          } catch (e) {
            this.showToast('Failed to delete: ' + e.message, 'error');
          }
          this.loading.global = false;
        },

        // ========================= TIMELINE =========================
        async loadTimeline() {
          this.loading.timeline = true;
          try {
            const data = await this.fetchApi('/quartz/api/timeline');
            this.timelineEvents = data.slice(0, 50);
          } catch (e) {
            console.error('loadTimeline:', e);
          }
          this.loading.timeline = false;
        },

        addTimelineEvent(data) {
          const evt = {
            jobKey: data.jobKey || (data.jobName ? data.jobGroup + '.' + data.jobName : ''),
            triggerKey: data.triggerKey || (data.triggerName ? data.triggerGroup + '.' + data.triggerName : ''),
            fireTime: data.fireTime,
            duration: data.duration,
            durationMs: data.durationMs,
            success: data.success !== false
          };
          this.timelineEvents.unshift(evt);
          if (this.timelineEvents.length > 50) this.timelineEvents.length = 50;
        },

        updateGraphSize() {
          const container = this.$refs && this.$refs.graphContainer;
          if (container) {
            this.graphWidth = Math.max(400, container.clientWidth || 800);
          }
          const tlContainer = this.$refs && this.$refs.timelineContainer;
          if (tlContainer) {
            this.timelineWidth = Math.max(600, tlContainer.clientWidth - 144 || 800);
            this.timelineHeight = Math.max(200, tlContainer.clientHeight || 400);
          }
        },

        onPageChange(page) {
          if (page === 'history') this.loadHistory();
          if (page === 'graph') this.loadStats();
          if (page === 'triggers') this.loadTriggers();
          if (page === 'executing') this.loadExecutingJobs();
          if (page === 'timeline') {
            this.loadTimeline();
            this.$nextTick(() => this.updateGraphSize());
          }
        },

        // ========================= AUTO-REFRESH =========================
        startAutoRefresh() {
          if (this.autoRefreshTimer) clearInterval(this.autoRefreshTimer);
          const ms = this.settings.refreshInterval * 1000;
          this.autoRefreshTimer = setInterval(() => {
            // If SignalR is connected and the page supports real-time, skip polling refresh for those pages
            if (this.signalRConnected) {
              // Timeline, executing are real-time via SignalR
              if (this.currentPage === 'timeline' || this.currentPage === 'executing') return;
            }
            const page = this.currentPage;
            if (this.settings.autoRefreshPages[page]) {
              this.refreshPage(page);
            }
          }, ms);
        },

        toggleAutoRefresh(pageId) {
          this.settings.autoRefreshPages[pageId] = !this.settings.autoRefreshPages[pageId];
        },

        async refreshPage(page) {
          switch (page) {
            case 'overview': await this.refreshAll(); break;
            case 'jobs': await this.loadJobs(); break;
            case 'triggers': await this.loadTriggers(); break;
            case 'executing': await this.loadExecutingJobs(); break;
            case 'history': await this.loadHistory(); break;
            case 'graph': await this.loadStats(); break;
            case 'timeline': await this.loadTimeline(); break;
          }
        },

        // ========================= TOAST =========================
        showToast(msg, type = 'info') {
          const id = ++this.toastIdCounter;
          this.toastQueue.push({ id: id, message: msg, type: type });
          if (this.toastQueue.length > 10) this.toastQueue.shift();
          // Also keep the legacy toast for backward compatibility
          this.toast = { show: true, message: msg, type };
          setTimeout(() => {
            this.toastQueue = this.toastQueue.filter(t => t.id !== id);
            this.toast.show = false;
          }, 3000);
        },

        // ========================= API =========================
        async fetchApi(path) {
          const res = await fetch(path);
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
          return res.json();
        },

        async postApi(path) {
          const res = await fetch(path, { method: 'POST' });
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
          return res.json();
        },

        async refreshAll() {
          try {
            const [scheduler, jobs, triggers, executing] = await Promise.all([
              this.fetchApi('/quartz/api/scheduler').catch(() => this.scheduler),
              this.fetchApi('/quartz/api/jobs').catch(() => this.jobs),
              this.fetchApi('/quartz/api/triggers').catch(() => this.triggers),
              this.fetchApi('/quartz/api/executing').catch(() => this.executingJobs),
            ]);
            this.scheduler = scheduler;
            this.jobs = jobs;
            this.triggers = triggers;
            this.executingJobs = executing;
            this.lastRefreshed = new Date();
          } catch (e) {
            console.error('Refresh error:', e);
          }
        },

        async loadJobs() {
          this.loading.jobs = true;
          try { this.jobs = await this.fetchApi('/quartz/api/jobs'); } catch (e) { console.error('loadJobs:', e); }
          this.loading.jobs = false;
        },

        async loadTriggers() {
          this.loading.triggers = true;
          try { this.triggers = await this.fetchApi('/quartz/api/triggers'); } catch (e) { console.error('loadTriggers:', e); }
          this.loading.triggers = false;
        },

        async loadExecutingJobs() {
          this.loading.executing = true;
          const prevIds = this.knownExecutingIds;
          try {
            this.executingJobs = await this.fetchApi('/quartz/api/executing');
            this.knownExecutingIds = new Set(this.executingJobs.map(ej => ej.fireInstanceId));
          } catch (e) { console.error('loadExecutingJobs:', e); }
          this.loading.executing = false;
        },

        async loadHistory() {
          this.loading.history = true;
          try {
            this.history = await this.fetchApi('/quartz/api/history');
            this.maxHistoryDuration = 0;
            for (const h of this.history) {
              const d = h.durationMs || 0;
              if (d > this.maxHistoryDuration) this.maxHistoryDuration = d;
            }
            if (this.maxHistoryDuration === 0) this.maxHistoryDuration = 5000;
          } catch (e) { console.error('loadHistory:', e); }
          this.loading.history = false;
        },

        async loadStats() {
          this.loading.stats = true;
          try {
            this.stats = await this.fetchApi('/quartz/api/stats');
            this.executionBuckets = this.stats.executionBuckets || [];
            this.graphData = this.getGraphData();
          } catch (e) { console.error('loadStats:', e); }
          this.loading.stats = false;
        },

        getGraphData() {
          const buckets = this.executionBuckets || [];
          if (!buckets.length) return [];
          if (this.graphView === 'live') {
            return buckets.slice(-5);
          }
          return buckets;
        },

        // ========================= JOB ACTIONS =========================
        async startScheduler() {
          this.loading.global = true;
          try {
            await this.postApi('/quartz/api/scheduler/start');
            this.showToast('Scheduler started', 'success');
            await this.refreshAll();
          } catch (e) { this.showToast('Failed to start: ' + e.message, 'error'); }
          this.loading.global = false;
        },

        async standbyScheduler() {
          this.loading.global = true;
          try {
            await this.postApi('/quartz/api/scheduler/standby');
            this.showToast('Scheduler on standby', 'info');
            await this.refreshAll();
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
          this.loading.global = false;
        },

        async triggerJob(group, name) {
          try {
            await this.postApi('/quartz/api/jobs/' + group + '/' + name + '/trigger');
            this.showToast('Triggered ' + group + '.' + name, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async pauseJob(group, name) {
          try {
            await this.postApi('/quartz/api/jobs/' + group + '/' + name + '/pause');
            await this.loadJobs();
            this.showToast('Paused ' + group + '.' + name, 'info');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async resumeJob(group, name) {
          try {
            await this.postApi('/quartz/api/jobs/' + group + '/' + name + '/resume');
            await this.loadJobs();
            this.showToast('Resumed ' + group + '.' + name, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async pauseTrigger(group, name) {
          try {
            await this.postApi('/quartz/api/triggers/' + group + '/' + name + '/pause');
            await this.loadTriggers();
            this.showToast('Paused trigger ' + group + '.' + name, 'info');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async resumeTrigger(group, name) {
          try {
            await this.postApi('/quartz/api/triggers/' + group + '/' + name + '/resume');
            await this.loadTriggers();
            this.showToast('Resumed trigger ' + group + '.' + name, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        // ========================= UI HELPERS =========================
        toggleJobExpand(group, name) {
          const key = group + '.' + name;
          this.expandedJobs[key] = !this.expandedJobs[key];
        },

        toggleTriggerGroup(idx) {
          this.expandedTriggerGroups[idx] = !this.expandedTriggerGroups[idx];
        },

        hasJobTriggers(job) {
          return job.triggers && job.triggers.length > 0;
        },

        isNewExecutingJob(ej) {
          return ej.fireInstanceId && !this.knownExecutingIds.has(ej.fireInstanceId);
        },

        relativeTime(dateStr) {
          if (!dateStr) return '\u2014';
          const now = new Date();
          const target = new Date(dateStr);
          const diffMs = target - now;
          if (diffMs <= 0) return 'now';
          const secs = Math.floor(diffMs / 1000);
          if (secs < 60) return secs + 's';
          const mins = Math.floor(secs / 60);
          const remSecs = secs % 60;
          if (mins < 60) return mins + 'm ' + remSecs + 's';
          const hours = Math.floor(mins / 60);
          const remMins = mins % 60;
          return hours + 'h ' + remMins + 'm';
        },

        formatDuration(d) {
          if (!d) return '';
          if (typeof d === 'string') {
            return d.replace('PT', '').replace('H', 'h ').replace('M', 'm ').replace('S', 's');
          }
          if (typeof d === 'object') {
            const secs = (d.hours || 0) * 3600 + (d.minutes || 0) * 60 + (d.seconds || 0) + (d.milliseconds || 0) / 1000;
            if (secs < 1) return Math.round(secs * 1000) + 'ms';
            if (secs < 60) return secs.toFixed(1) + 's';
            return Math.floor(secs / 60) + 'm ' + Math.round(secs % 60) + 's';
          }
          return d;
        },

        formatDate(d) {
          if (!d) return '';
          const dt = new Date(d);
          if (isNaN(dt.getTime())) return '';
          return dt.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        },

        formatTimeShort(d) {
          if (!d) return '';
          const dt = new Date(d);
          if (isNaN(dt.getTime())) return '';
          return dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        },

        // ========================= SPARKLINE =========================
        sparklinePoints(field) {
          const buckets = this.executionBuckets || [];
          if (!buckets.length) return '';
          const w = this.sparklineW;
          const h = this.sparklineH;
          const values = buckets.map(b => b[field] || 0);
          const maxVal = Math.max(...values, 1);
          const stepX = w / Math.max(values.length - 1, 1);
          return values.map((v, i) => {
            const x = i * stepX;
            const y = h - (v / maxVal) * (h - 2) - 1;
            return x + ',' + y;
          }).join(' ');
        },

        // ========================= GRAPH =========================
        graphX(idx) {
          const margin = this.graphMargin;
          const data = this.graphData;
          const w = this.graphWidth - margin.left - margin.right;
          return margin.left + (idx / Math.max(data.length - 1, 1)) * w;
        },

        graphY(val, maxVal) {
          const margin = this.graphMargin;
          const h = this.graphHeight - margin.top - margin.bottom;
          const max = maxVal || 1;
          return margin.top + h - (val / max) * h;
        },

        graphLinePoints(field) {
          const data = this.graphData;
          if (!data.length) return '';
          const fieldValues = data.map(b => b[field] || 0);
          const maxVal = Math.max(...fieldValues, 1);
          if (field === 'avgDurationMs') {
            this.graphMaxDuration = maxVal;
          } else {
            this.graphMaxCount = maxVal;
          }
          const margin = this.graphMargin;
          const w = this.graphWidth - margin.left - margin.right;
          const h = this.graphHeight - margin.top - margin.bottom;
          return data.map((b, i) => {
            const x = margin.left + (i / Math.max(data.length - 1, 1)) * w;
            const y = margin.top + h - ((b[field] || 0) / maxVal) * h;
            return x + ',' + y;
          }).join(' ');
        },

        countAreaPoints() {
          const data = this.graphData;
          if (!data.length) return '';
          const margin = this.graphMargin;
          const w = this.graphWidth - margin.left - margin.right;
          const h = this.graphHeight - margin.top - margin.bottom;
          const values = data.map(b => b.count || 0);
          const maxVal = Math.max(...values, 1);
          const bottom = margin.top + h;
          let points = margin.left + ',' + bottom;
          data.forEach((b, i) => {
            const x = margin.left + (i / Math.max(data.length - 1, 1)) * w;
            const y = margin.top + h - ((b.count || 0) / maxVal) * h;
            points += ' ' + x + ',' + y;
          });
          points += ' ' + (margin.left + w) + ',' + bottom;
          return points;
        }       // closes countAreaPoints
      }         // closes return object
    }           // closes dashboard()
    window.dashboard = dashboard;
  </script>
