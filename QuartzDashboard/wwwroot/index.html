                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <p class="text-base font-medium text-gray-400">No execution history yet</p>
                  <p class="text-sm text-gray-600 mt-1">History appears as jobs run</p>
                  <p class="text-xs text-gray-600 mt-2">Enable <code class="mono text-xs bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">AddQuartzDashboardHistory()</code> to track execution history</p>
                </div>

                <div x-show="filteredHistory.length" class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Time</th>
                        <th>Job</th>
                        <th class="hidden sm:table-cell">Trigger</th>
                        <th>Duration</th>
                        <th class="hidden md:table-cell">Bar</th>
                        <th>Outcome</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(h, idx) in filteredHistory" :key="idx">
                        <tr>
                          <td class="mono text-xs text-gray-400" x-text="formatDate(h.fireTime)"></td>
                          <td class="font-medium text-gray-100 text-xs" x-text="h.jobKey"></td>
                          <td class="text-xs text-gray-500 hidden sm:table-cell truncate max-w-[140px]" x-text="h.triggerKey"></td>
                          <td class="text-xs mono text-gray-300" x-text="h.duration ? formatDuration(h.duration) : '\u2014'"></td>
                          <td class="hidden md:table-cell">
                            <div class="w-24 h-1.5 bg-gray-700/40 rounded-full overflow-hidden">
                              <div class="h-full rounded-full duration-bar"
                                   :class="h.success ? 'bg-emerald-500' : 'bg-red-500'"
                                   :style="'width: ' + Math.min((h.durationMs || 0) / (maxHistoryDuration || 5000) * 100, 100) + '%'"></div>
                            </div>
                          </td>
                          <td>
                            <span :class="h.success ? 'badge badge-ok' : 'badge badge-error'" x-text="h.success ? 'OK' : 'Error'"></span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div x-show="!filteredHistory.length && history.length > 0" class="card-gradient text-center py-10">
                  <svg class="w-10 h-10 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <p class="text-sm text-gray-500">No records match filter</p>
                  <button @click="historyFilter = ''" class="btn btn-ghost mt-2 text-xs">Clear filter</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== GRAPH PAGE (ChartEngine) ===================== -->
      <template x-if="currentPage === 'graph'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <!-- Header -->
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Execution Graph</h1>
                <p class="text-xs text-gray-500 mt-0.5">Execution rate and duration over time</p>
              </div>
              <div class="flex items-center gap-2">
                <!-- Chart mode toggle -->
                <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                  <button @click="graphChartMode = 'line'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'line' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Line</button>
                  <button @click="graphChartMode = 'bar'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'bar' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Bar</button>
                  <button @click="graphChartMode = 'heatmap'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'heatmap' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Heat</button>
                </div>
                <!-- Time range buttons -->
                <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                  <button @click="graphTimeRange = 5; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 5 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">5m</button>
                  <button @click="graphTimeRange = 15; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 15 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">15m</button>
                  <button @click="graphTimeRange = 30; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 30 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">30m</button>
                  <button @click="graphTimeRange = 60; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 60 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">1h</button>
                  <button @click="graphTimeRange = 360; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 360 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">6h</button>
                </div>
                <!-- Download PNG -->
                <button @click="ChartEngine.exportPNG($refs.graphSvg, 'quartz-graph.png')" class="btn btn-ghost" title="Download PNG">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </button>
                <!-- Refresh -->
                <button @click="loadGraphData()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.stats">
              <div class="card-gradient p-5">
                <div class="sk h-64 w-full rounded-lg relative overflow-hidden">
                  <!-- Chart-shaped skeleton with axis lines -->
                  <div class="absolute left-10 top-0 bottom-10 flex flex-col justify-between">
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                  </div>
                  <div class="absolute left-24 right-6 top-6 bottom-12">
                    <div class="sk h-full w-full rounded" style="opacity: 0.15;"></div>
                    <div class="absolute left-0 right-0 top-1/3 sk h-0.5 w-full" style="opacity: 0.3;"></div>
                    <div class="absolute left-0 right-0 top-2/3 sk h-0.5 w-full" style="opacity: 0.3;"></div>
                  </div>
                  <div class="absolute left-24 right-6 bottom-10 sk h-0.5"></div>
                </div>
                <div class="flex justify-center gap-8 mt-6 pt-4 border-t border-white/[0.04]">
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                </div>
              </div>
            </template>

            <!-- Graph -->
            <template x-if="!loading.stats">
              <div class="card-gradient">
                <!-- Empty state -->
                <div x-show="!graphData.length" class="text-center py-16">
                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
                    <line x1="2" y1="20" x2="22" y2="20" stroke-width="1"/>
                  </svg>
                  <p class="text-base font-medium text-gray-400">No execution data yet</p>
                  <p class="text-sm text-gray-600 mt-1">Graph data appears as jobs are executed</p>
                  <p class="text-xs text-gray-600 mt-2">Try triggering a job or waiting for scheduled executions</p>
                </div>

                <div x-show="graphData.length">
                <div class="relative" x-ref="graphContainer" @mousemove="onGraphMouseMove($event)" @mouseleave="graphCrosshair.show = false">
                  <svg :width="graphWidth" :height="graphHeight" class="w-full" :viewBox="'0 0 ' + graphWidth + ' ' + graphHeight" preserveAspectRatio="xMidYMid meet"
                       x-ref="graphSvg" style="overflow: visible;">
                    <!-- Defs from ChartEngine -->
                    <defs x-html="graphGradientDefs"></defs>

                    <!-- Grid lines via ChartEngine -->
                    <g x-html="graphGridLines"></g>

                    <!-- Y-axis labels via ChartEngine (left) -->
                    <g>
                      <template x-for="tick in graphYTicks" :key="'yt-' + tick.value">
                        <text :x="graphMargin.left - 8" :y="tick.y + 3"
                              text-anchor="end" class="fill-gray-500 text-[9px] font-mono" x-text="tick.label"></text>
                      </template>
                    </g>

                    <!-- X-axis labels via ChartEngine -->
                    <g>
                      <template x-for="label in graphXLabels" :key="'xl-' + label.index">
                        <text :x="label.x" :y="graphHeight - graphMargin.bottom + 14"
                              text-anchor="middle" class="fill-gray-500 text-[8px] font-mono" x-text="label.label"></text>
                      </template>
                    </g>

                    <!-- LINE MODE: Smooth curves with area fill -->
                    <template x-if="graphChartMode === 'line'">
                      <g>
                        <!-- Area fill -->
                        <template x-if="graphSeries.count">
                          <path :d="graphCountAreaPath" fill="url(#graphcountGrad)"/>
                        </template>
                        <!-- Count line -->
                        <template x-if="graphSeries.count">
                          <path :d="graphCountLinePath" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#chartGlow)"/>
                        </template>
                        <!-- Duration line -->
                        <template x-if="graphSeries.avgDuration">
                          <path :d="graphDurationLinePath" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round" stroke-linejoin="round"/>
                        </template>
                        <!-- Error rate line -->
                        <template x-if="graphSeries.errorRate">
                          <path :d="graphErrorLinePath" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,2"/>
                        </template>
                        <!-- Data point dots on hover -->
                        <template x-for="(bucket, idx) in graphData" :key="'pt-' + idx">
                          <circle :cx="graphX(idx)" :cy="graphY(bucket.count, graphMaxCount || 10)" r="2.5"
                                  fill="#818cf8" stroke="#030712" stroke-width="1" class="cursor-pointer"
                                  @mouseenter="graphCrosshair = { show: true, x: graphX(idx), data: bucket }"
                                  @mouseleave="graphCrosshair.show = false"/>
                        </template>
                      </g>
                    </template>

                    <!-- BAR MODE -->
                    <template x-if="graphChartMode === 'bar'">
                      <g>
                        <template x-for="(rect, idx) in graphBarRects" :key="'bar-' + idx">
                          <rect :x="rect.x" :y="rect.y" :width="rect.width" :height="rect.height"
                                rx="2" fill="#818cf8" fill-opacity="0.7" class="cursor-pointer"
                                @mouseenter="graphCrosshair = { show: true, x: rect.x + rect.width / 2, data: rect.data }"
                                @mouseleave="graphCrosshair.show = false">
                            <animate attributeName="height" :from="0" :to="rect.height" dur="0.3s" fill="freeze"/>
                            <animate attributeName="y" :from="graphHeight - graphMargin.bottom" :to="rect.y" dur="0.3s" fill="freeze"/>
                          </rect>
                        </template>
                      </g>
                    </template>

                    <!-- HEATMAP MODE -->
                    <template x-if="graphChartMode === 'heatmap'">
                      <g>
                        <template x-for="(cell, idx) in graphHeatCells" :key="'hc-' + idx">
                          <rect :x="cell.x" :y="cell.y" :width="cell.width" :height="cell.height"
                                :fill="cell.fill" rx="1" class="cursor-pointer"
                                @mouseenter="graphCrosshair = { show: true, x: cell.x + cell.width / 2, data: cell.data }"
                                @mouseleave="graphCrosshair.show = false">
                          </rect>
                        </template>
                      </g>
                    </template>

                    <!-- Legend -->
                    <g>
                      <line x1="16" :y1="graphHeight - graphMargin.bottom + 34" x2="36" :y2="graphHeight - graphMargin.bottom + 34" stroke="#818cf8" stroke-width="2"/>
                      <text x="40" :y="graphHeight - graphMargin.bottom + 37" class="fill-gray-400 text-[9px] font-medium">Count</text>
                      <line x1="100" :y1="graphHeight - graphMargin.bottom + 34" x2="120" :y2="graphHeight - graphMargin.bottom + 34" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3"/>
                      <text x="124" :y="graphHeight - graphMargin.bottom + 37" class="fill-gray-400 text-[9px] font-medium">Avg Dur</text>
                      <line x1="190" :y1="graphHeight - graphMargin.bottom + 34" x2="210" :y2="graphHeight - graphMargin.bottom + 34" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
                      <text x="214" :y="graphHeight - graphMargin.bottom + 37" class="fill-gray-400 text-[9px] font-medium">Errors</text>
                    </g>

                    <!-- Crosshair vertical line -->
                    <line x-show="graphCrosshair.show" :x1="graphCrosshair.x" y1="0" :x2="graphCrosshair.x" :y2="graphHeight"
                          stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3,3" style="display: none;"/>
                  </svg>

                  <!-- Tooltip overlay -->
                  <div x-show="graphCrosshair.show" 
                       :style="'left: ' + Math.min(graphCrosshair.x + 12, graphWidth - 180) + 'px; top: 12px;'"
                       class="absolute z-20 pointer-events-none" style="display: none;">
                    <div class="bg-gray-900/95 backdrop-blur-sm border border-white/[0.08] rounded-lg px-3 py-2 shadow-xl min-w-[130px]">
                      <div class="text-xs font-medium text-gray-200 mb-1" x-text="graphTooltipTime"></div>
                      <div class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-quartz-400"></span>
                        <span x-text="'Count: ' + (graphCrosshair.data ? graphCrosshair.data.count : '\\u2014')" class="text-gray-300"></span>
                      </div>
                      <div class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span x-text="'Dur: ' + (graphCrosshair.data ? Math.round(graphCrosshair.data.avgDurationMs || 0) + 'ms' : '\\u2014')" class="text-gray-300"></span>
                      </div>
                      <div x-show="graphCrosshair.data && graphCrosshair.data.errorRate !== undefined" class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
                        <span x-text="'Err: ' + (graphCrosshair.data ? (graphCrosshair.data.errorRate * 100).toFixed(1) + '%' : '\\u2014')" class="text-red-300"></span>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- Stats footer -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-4 border-t border-white/[0.04]">
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Peak Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="Math.max(...graphData.map(b => b.count || 0), 0) + '/min'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Avg Duration</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="graphData.length ? Math.round(graphData.reduce((a,b) => a + (b.avgDurationMs||0), 0) / graphData.length) + 'ms' : '\u2014'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Total Executions</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="stats.totalExecutions || 0"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Current Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="(stats.executionRate || 0).toFixed(2) + '/s'"></p>
                </div>
              </div>
            </div>  <!-- closes graphData.length wrapper -->
              </div>  <!-- closes card-gradient -->
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== TIMELINE PAGE ===================== -->
      <template x-if="currentPage === 'timeline'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Timeline</h1>
                <p class="text-xs text-gray-500 mt-0.5">Last 50 fire events in real-time</p>
              </div>
              <button @click="loadTimeline()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
              </button>
            </div>

            <div class="card-gradient">
              <div class="relative overflow-x-auto" x-ref="timelineContainer" style="height: 400px;">
                <template x-if="loading.timeline">
                  <div class="flex flex-col items-center justify-center h-full gap-3">
                    <div class="spinner w-6 h-6"></div>
                    <span class="text-sm text-gray-500">Loading timeline...</span>
                  </div>
                </template>
                <template x-if="!loading.timeline && !timelineEvents.length">
                  <div class="flex flex-col items-center justify-center h-full text-sm text-gray-500 gap-4">
                    <svg class="w-12 h-12 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                      <line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/>
                    </svg>
                    <div class="text-center">
                      <p class="text-sm text-gray-400 mb-1">No timeline events yet</p>
                      <p class="text-xs text-gray-500">Execution events will appear here in real-time</p>
                    </div>
                  </div>
                </template>
                <template x-if="!loading.timeline && timelineEvents.length">
                  <div class="relative" :style="'height: ' + timelineHeight + 'px; min-width: 100%; width: ' + timelineWidth + 'px'">
                    <!-- Y-axis labels (job names) -->
                    <div class="absolute left-0 top-0 bottom-8 w-36 flex flex-col justify-around pointer-events-none z-10">
                      <template x-for="(jobName, idx) in timelineYLabels" :key="jobName">
                        <div class="text-[10px] text-gray-500 truncate px-2 leading-none" 
                             :style="'position: absolute; top: ' + (timelineRowCenter(idx)) + 'px; transform: translateY(-50%)'"
                             x-text="jobName"></div>
                      </template>
                    </div>
                    <!-- SVG area -->
                    <svg :width="timelineWidth" :height="timelineHeight" class="absolute left-36 top-0 overflow-visible">
                      <!-- Grid lines (vertical, time markers) -->
                      <template x-for="i in 6" :key="'tgrid-' + i">
                        <line :x1="timelineXForTime(now - (60000/6) * i)" y1="0" 
                              :x2="timelineXForTime(now - (60000/6) * i)" :y2="timelineHeight - 30"
                              stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2,3"/>
                      </template>
                      <!-- Time labels -->
                      <template x-for="i in 6" :key="'tlabel-' + i">
                        <text :x="timelineXForTime(now - (60000/6) * i)" :y="timelineHeight - 12"
                              text-anchor="middle" class="fill-gray-600 text-[8px] font-mono">
                          <tspan x-text="formatTimeShort(new Date(now - (60000/6) * i))"></tspan>
                        </text>
                      </template>
                      <!-- Horizontal separator lines -->
                      <template x-for="(jobName, idx) in timelineYLabels" :key="'hline-' + idx">
                        <line x1="0" :y1="timelineRowCenter(idx)" 
                              :x2="timelineWidth" :y2="timelineRowCenter(idx)"
                              stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
                      </template>
                      <!-- Current time indicator line -->
                      <line :x1="timelineXForTime(now)" y1="0" :x2="timelineXForTime(now)" :y2="timelineHeight - 30"
                            stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" opacity="0.8">
                        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
                      </line>
                      <!-- Event dots -->
                      <template x-for="(evt, idx) in timelineEvents" :key="evt.fireTime + '-' + evt.jobKey + '-' + idx">
                        <g>
                          <circle :cx="timelineXForTime(new Date(evt.fireTime).getTime())"
                                  :cy="timelineYForJob(evt.jobKey)"
                                  r="5"
                                  :class="'timeline-dot ' + (evt.success ? 'timeline-dot-success' : 'timeline-dot-error')"
                                  @mouseenter="timelineTooltip = { show: true, event: evt, x: timelineXForTime(new Date(evt.fireTime).getTime()) - 18, y: timelineYForJob(evt.jobKey) - 14 }"
                                  @mouseleave="timelineTooltip.show = false">
                          </circle>
                        </g>
                      </template>
                    </svg>
                    <!-- Tooltip -->
                    <div x-show="timelineTooltip.show" 
                         :style="'left: ' + timelineTooltip.x + 'px; top: ' + timelineTooltip.y + 'px;'" 
                         class="timeline-tooltip" style="display: none;">
                      <div class="text-gray-200 font-medium text-xs" x-text="timelineTooltip.event.jobKey"></div>
                      <div class="text-[10px] text-gray-400" x-text="'Trigger: ' + timelineTooltip.event.triggerKey"></div>
                      <div class="text-[10px] text-gray-400" x-text="'Duration: ' + formatDuration(timelineTooltip.event.duration)"></div>
                      <div class="text-[10px] mt-0.5" :class="timelineTooltip.event.success ? 'text-emerald-400' : 'text-red-400'" x-text="timelineTooltip.event.success ? 'Success' : 'Error'"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===================== SETTINGS PAGE ===================== -->
      <template x-if="currentPage === 'settings'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div>
              <h1 class="text-lg font-semibold tracking-tight text-gray-100">Settings</h1>
              <p class="text-xs text-gray-500 mt-0.5">Configure dashboard behavior</p>
            </div>

            <div class="card-gradient space-y-6">
              <!-- Refresh Interval -->
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-sm font-semibold text-gray-200">Refresh Interval</h2>
                  <span class="text-sm font-mono text-quartz-400 tabular-nums font-medium" x-text="settings.refreshInterval + 's'"></span>
                </div>
                <input type="range" x-model="settings.refreshInterval" min="1" max="60" step="1" class="w-full max-w-md">
                <p class="text-xs text-gray-500 mt-1.5">How often the dashboard auto-refreshes data (1-60 seconds).</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Auto-refresh per page -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">Auto-Refresh by Page</h2>
                <div class="space-y-1">
                  <template x-for="item in navItems" :key="item.id">
                    <label class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-white/[0.02] cursor-pointer transition-colors">
                      <div class="flex items-center gap-3">
                        <span x-html="item.icon" class="w-4 h-4 text-gray-500 flex-shrink-0"></span>
                        <span class="text-sm text-gray-300" x-text="item.label"></span>
                      </div>
                      <div @click="toggleAutoRefresh(item.id)"
                           :class="['toggle', settings.autoRefreshPages[item.id] ? 'toggle-on' : 'toggle-off']">
                        <div :class="['toggle-knob', settings.autoRefreshPages[item.id] ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                      </div>
                    </label>
                  </template>
                </div>
                <p class="text-xs text-gray-500 mt-2">Enable or disable auto-refresh for each page individually.</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Light mode -->
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-sm font-semibold text-gray-200">Appearance</h2>
                </div>
                <label class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-white/[0.02] cursor-pointer transition-colors">
                  <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span class="text-sm text-gray-300">Light Mode</span>
                  </div>
                  <div @click="toggleLightMode()"
                       :class="['toggle', lightMode ? 'toggle-on' : 'toggle-off']">
                    <div :class="['toggle-knob', lightMode ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                  </div>
                </label>
                <p class="text-xs text-gray-500 mt-2">Toggle between dark and light appearance.</p>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- Connection info -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">Connection</h2>
                <div class="text-xs text-gray-500 space-y-1.5">
                  <p>Status: <span class="font-medium" :class="signalRConnected ? 'text-emerald-400' : signalRPolling ? 'text-amber-400' : 'text-gray-400'" x-text="connectionStatus"></span></p>
                  <p>Hub: <code class="mono text-quartz-400 bg-quartz-500/10 px-1.5 py-0.5 rounded text-[11px]">/quartz/hub</code></p>
                </div>
              </div>

              <div class="border-t border-white/[0.04]"></div>

              <!-- About -->
              <div>
                <h2 class="text-sm font-semibold text-gray-200 mb-3">About</h2>
                <div class="text-xs text-gray-500 space-y-1.5">
                  <p>Quartz Dashboard <span class="text-gray-400">v0.2</span></p>
                  <p>Built with Alpine.js 3.x + Tailwind CSS v4 + SignalR</p>
                  <p>Single-file SPA \u2014 no build step required</p>
                  <p class="mt-3">API endpoints: <code class="mono text-quartz-400 bg-quartz-500/10 px-1.5 py-0.5 rounded text-[11px]">/quartz/api/*</code></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- ===================== FOOTER STATUS BAR ===================== -->
  <div class="footer-bar">
    <div class="flex items-center gap-4 w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-1.5">
        <span class="relative inline-flex">
          <span :class="['status-dot w-2 h-2', scheduler.isStarted && !scheduler.isStandbyMode ? 'status-dot-running' : scheduler.isStandbyMode ? 'status-dot-standby' : 'status-dot-stopped']"></span>
        </span>
        <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'" class="font-medium text-gray-400"></span>
      </div>
      <span class="text-gray-600">|</span>
      <span><span class="text-gray-500">Jobs:</span> <span class="text-gray-400 font-medium" x-text="jobs.length"></span></span>
      <span class="text-gray-600 hidden sm:inline">|</span>
      <span class="hidden sm:inline"><span class="text-gray-500">Triggers:</span> <span class="text-gray-400 font-medium" x-text="triggers.length"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline"><span class="text-gray-500">Instance:</span> <span class="text-gray-400 mono" x-text="scheduler.instanceId ? scheduler.instanceId.slice(0, 20) : '\u2014'"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline">
        <span :class="signalRConnected ? 'text-emerald-400' : signalRPolling ? 'text-amber-400' : 'text-gray-500'" x-text="connectionStatus"></span>
      </span>
      <span class="ml-auto text-gray-600">
        Last refreshed: <span class="text-gray-400" x-text="lastRefreshed ? formatDate(lastRefreshed) : '\u2014'"></span>
      </span>
    </div>
  </div>

  <script>
  <script src="app.js" defer></script>
  </script>
</body>
</html>
