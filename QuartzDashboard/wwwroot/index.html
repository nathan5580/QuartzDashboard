<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quartz Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="charts.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            quartz: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
            }
          },
          animation: {
            shimmer: 'shimmer 2s ease-in-out infinite',
            'pulse-dot': 'pulse-dot 2s ease-in-out infinite',
            'fade-in': 'fade-in 0.25s ease-out',
            'slide-up': 'slide-up 0.3s ease-out',
            'scale-in': 'scale-in 0.15s ease-out',
            'dot-pop': 'dot-pop 0.2s ease-out',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            'pulse-dot': { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.4' } },
            'fade-in': { from: { opacity: '0', transform: 'translateY(6px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            'slide-up': { from: { opacity: '0', transform: 'translateY(12px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            'scale-in': { from: { opacity: '0', transform: 'scale(0.97)' }, to: { opacity: '1', transform: 'scale(1)' } },
            'dot-pop': { from: { opacity: '0', transform: 'scale(0)' }, to: { opacity: '1', transform: 'scale(1)' } },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="bg-gray-950 text-gray-200 antialiased" x-data="dashboard()" x-init="init()">

  <!-- ChartEngine filters and gradients -->
  <svg height="0" width="0" style="position:absolute" x-html="ChartEngine.gradientDefs('chart')"></svg>

  <!-- Toast queue -->
  <div class="fixed bottom-12 right-4 z-50 flex flex-col-reverse gap-2 pointer-events-none" style="z-index: 55;">
    <template x-for="(t, idx) in toastQueue.slice(0, 3)" :key="t.id">
      <div class="toast pointer-events-auto"
           :class="'toast-' + t.type"
           x-transition:enter.duration.150
           x-transition:leave.duration.150
           x-text="t.message">
      </div>
    </template>
  </div>

  <!-- Loading overlay -->
  <div x-show="loading.global" class="fixed inset-0 bg-gray-950/40 backdrop-blur-sm flex items-center justify-center z-40" style="display: none;">
    <div class="flex items-center gap-3 bg-gray-900/80 border border-white/5 rounded-xl px-5 py-3 shadow-2xl">
      <div class="spinner w-5 h-5"></div>
      <span class="text-sm text-gray-300">Processing...</span>
    </div>
  </div>

  <!-- ============ CREATE JOB MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showCreateJobModal" class="modal-overlay" @click.self="showCreateJobModal = false" style="display: none;">
      <div class="modal-card">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-base font-semibold text-gray-100">Create Job</h2>
          <button @click="showCreateJobModal = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="form-label">Name *</label>
            <input type="text" x-model="newJob.name" class="glass-input w-full" placeholder="MyJob">
          </div>
          <div>
            <label class="form-label">Group</label>
            <input type="text" x-model="newJob.group" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea x-model="newJob.description" rows="2" class="glass-textarea w-full" placeholder="Optional description"></textarea>
          </div>
          <div>
            <label class="form-label">Job Type (.NET type name)</label>
            <input type="text" x-model="newJob.jobType" class="glass-input w-full" placeholder="MyApp.Jobs.MyJob, MyApp">
          </div>
          <div class="flex items-center gap-6 pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.isDurable" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Durable</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.disallowConcurrentExecution" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Disallow Concurrent</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.persistJobDataAfterExecution" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Persist Job Data</span>
            </label>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button @click="showCreateJobModal = false" class="btn btn-ghost">Cancel</button>
            <button @click="submitCreateJob()" :disabled="!newJob.name" class="btn btn-primary">Create Job</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ CREATE TRIGGER MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showCreateTriggerModal" class="modal-overlay" @click.self="showCreateTriggerModal = false" style="display: none;">
      <div class="modal-card">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-base font-semibold text-gray-100">Create Trigger</h2>
          <button @click="showCreateTriggerModal = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="form-label">Name *</label>
            <input type="text" x-model="newTrigger.name" class="glass-input w-full" placeholder="MyTrigger">
          </div>
          <div>
            <label class="form-label">Group</label>
            <input type="text" x-model="newTrigger.group" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Job Name *</label>
            <input type="text" x-model="newTrigger.jobName" class="glass-input w-full" placeholder="MyJob">
          </div>
          <div>
            <label class="form-label">Job Group</label>
            <input type="text" x-model="newTrigger.jobGroup" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea x-model="newTrigger.description" rows="2" class="glass-textarea w-full" placeholder="Optional description"></textarea>
          </div>

          <!-- Trigger type tabs -->
          <div class="flex gap-2 border-b border-white/[0.06] pb-2">
            <button @click="newTrigger.triggerType = 'cron'"
                    :class="['btn text-xs', newTrigger.triggerType === 'cron' ? 'btn-primary' : 'btn-ghost']">Cron</button>
            <button @click="newTrigger.triggerType = 'simple'"
                    :class="['btn text-xs', newTrigger.triggerType === 'simple' ? 'btn-primary' : 'btn-ghost']">Simple</button>
          </div>

          <!-- Cron fields -->
          <template x-if="newTrigger.triggerType === 'cron'">
            <div>
              <label class="form-label">Cron Expression *</label>
              <input type="text" x-model="newTrigger.cronExpression" class="glass-input w-full" placeholder="0/5 * * * * ?">
            </div>
          </template>

          <!-- Simple fields -->
          <template x-if="newTrigger.triggerType === 'simple'">
            <div class="space-y-3">
              <div>
                <label class="form-label">Interval (seconds) *</label>
                <input type="number" x-model.number="newTrigger.intervalSeconds" class="glass-input w-full" placeholder="10" min="1">
              </div>
              <div>
                <label class="form-label">Repeat Count</label>
                <div class="flex items-center gap-2">
                  <input type="number" x-model.number="newTrigger.repeatCount" class="glass-input w-24" placeholder="0" min="-1">
                  <span class="text-xs text-gray-500">(-1 = infinite)</span>
                </div>
              </div>
            </div>
          </template>

          <div>
            <label class="form-label">Priority</label>
            <input type="number" x-model.number="newTrigger.priority" class="glass-input w-24" placeholder="5" min="0">
          </div>
          <div>
            <label class="form-label">Start Time</label>
            <input type="datetime-local" x-model="newTrigger.startTimeUtc" class="glass-input w-full">
          </div>
          <div>
            <label class="form-label">End Time (optional)</label>
            <input type="datetime-local" x-model="newTrigger.endTimeUtc" class="glass-input w-full">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button @click="showCreateTriggerModal = false" class="btn btn-ghost">Cancel</button>
            <button @click="submitCreateTrigger()" :disabled="!newTrigger.name || !newTrigger.jobName || (newTrigger.triggerType==='cron' && !newTrigger.cronExpression) || (newTrigger.triggerType==='simple' && !newTrigger.intervalSeconds)" class="btn btn-primary">Create Trigger</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ DELETE CONFIRMATION MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showDeleteConfirm" class="modal-overlay" @click.self="showDeleteConfirm = false" style="display: none;">
      <div class="modal-card max-w-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-gray-100">Confirm Delete</h2>
          <button @click="showDeleteConfirm = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <p class="text-sm text-gray-300 mb-6" x-text="deleteConfirmMessage"></p>
        <div class="flex justify-end gap-2">
          <button @click="showDeleteConfirm = false" class="btn btn-ghost">Cancel</button>
          <button @click="executeDelete()" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ COMMAND PALETTE ============ -->
  <template x-teleport="body">
    <div x-show="showCommandPalette" class="command-palette-overlay" @click.self="showCommandPalette = false" style="display: none;">
      <div class="command-palette-card" @keydown.escape="showCommandPalette = false" @keydown.arrow-up.prevent="commandPalettePrev" @keydown.arrow-down.prevent="commandPaletteNext" @keydown.enter.prevent="commandPaletteSelect">
        <div class="flex items-center px-4 py-3 border-b border-white/[0.06]">
          <svg class="w-4 h-4 text-gray-500 mr-3 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" x-model="commandPaletteQuery" x-ref="commandPaletteInput"
                 placeholder="Search pages and actions..."
                 class="flex-1 bg-transparent border-none outline-none text-sm text-gray-200 placeholder-gray-500"
                 @keydown.escape.stop="showCommandPalette = false">
        </div>
        <div class="max-h-64 overflow-y-auto p-1" x-ref="commandPaletteList">
          <template x-for="(cmd, idx) in filteredCommands" :key="cmd.id">
            <div @click="executeCommand(cmd)"
                 :class="['command-item rounded-lg text-sm', commandPaletteIndex === idx ? 'active' : '']"
                 @mouseenter="commandPaletteIndex = idx">
              <div class="flex items-center gap-3">
                <span x-html="cmd.icon" class="w-4 h-4 text-gray-500 flex-shrink-0"></span>
                <span x-text="cmd.label" class="text-gray-200"></span>
              </div>
              <span class="text-[10px] text-gray-500 mono" x-text="cmd.shortcut || ''"></span>
            </div>
          </template>
          <div x-show="!filteredCommands.length" class="text-center py-6 text-sm text-gray-500">
            No matching commands
          </div>
        </div>
      </div>
    </div>
  </template>

  <div class="flex h-screen overflow-hidden" :style="'padding-bottom: 2rem'">
    <!-- ===================== SIDEBAR ===================== -->
    <aside :class="['sidebar-collapse flex flex-col flex-shrink-0 bg-gray-950 sidebar-border z-20', sidebarOpen ? 'w-60' : 'w-16']">
      <!-- Logo -->
      <div :class="['h-14 flex items-center border-b border-white/[0.04]', sidebarOpen ? 'gap-2.5 px-5' : 'justify-center px-2']">
        <div class="w-7 h-7 rounded-lg bg-quartz-500/10 flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-quartz-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <span x-show="sidebarOpen" class="font-semibold text-sm text-gray-100 whitespace-nowrap overflow-hidden">
          Quartz<span class="text-quartz-400">Dash</span>
          <span class="ml-1 text-[10px] text-gray-600 font-mono">v0.2</span>
        </span>
      </div>

      <!-- Nav items -->
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto scrollbar-thin mt-1">
        <template x-for="item in navItems" :key="item.id">
          <div @click="currentPage = item.id"
               :class="['sidebar-item', currentPage === item.id ? 'active' : '', sidebarOpen ? '' : 'justify-center px-0']"
               :title="!sidebarOpen ? item.label : ''">
            <span x-html="item.icon" class="w-5 h-5 flex-shrink-0"></span>
            <span x-show="sidebarOpen" x-text="item.label" class="overflow-hidden text-[13px]"></span>
          </div>
        </template>
      </nav>

      <!-- Bottom section: status + collapse -->
      <div class="p-3 border-t border-white/[0.04] space-y-2">
        <div x-show="sidebarOpen" class="flex items-center justify-between px-3 py-2 rounded-lg bg-white/[0.03]">
          <div class="flex items-center gap-2.5">
            <span class="relative inline-flex">
              <span :class="['status-dot', scheduler.isStarted && !scheduler.isStandbyMode ? 'status-dot-running' : scheduler.isStandbyMode ? 'status-dot-standby' : 'status-dot-stopped']"></span>
            </span>
            <span class="text-xs text-gray-400">
              <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'"></span>
            </span>
          </div>
          <span class="text-[10px] text-gray-600 font-mono" x-text="'v' + (scheduler.version || '?')"></span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen"
                class="w-full flex items-center justify-center py-1.5 rounded-lg hover:bg-white/[0.04] text-gray-500 hover:text-gray-300 transition-colors"
                :title="sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'">
          <svg class="w-4 h-4 transition-transform duration-250" :class="sidebarOpen ? '' : 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="flex-1 overflow-y-auto scrollbar-thin p-6 lg:p-8">
      <!-- ===================== OVERVIEW PAGE ===================== -->
      <template x-if="currentPage === 'overview'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-6">
            <!-- Header -->
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Scheduler Overview</h1>
                <p class="text-xs text-gray-500 mt-0.5">Real-time status and metrics</p>
              </div>
              <div class="flex gap-2">
                <button @click="startScheduler()" :disabled="!scheduler.isStandbyMode"
                        :class="['btn', scheduler.isStandbyMode ? 'btn-success' : 'btn-ghost']">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  <span>Start</span>
                </button>
                <button @click="standbyScheduler()" :disabled="scheduler.isStandbyMode || !scheduler.isStarted"
                        :class="['btn', !scheduler.isStandbyMode && scheduler.isStarted ? 'btn-warning' : 'btn-ghost']">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                  Standby
                </button>
                <button @click="refreshAll()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Stat cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Jobs</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="jobs.length"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Triggers</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="triggers.length"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Executing Now</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="executingJobs.length" :class="executingJobs.length > 0 ? 'text-emerald-400' : 'text-gray-100'"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Total Executions</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="scheduler.numberOfJobsExecuted || 0"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Scheduler info -->
            <div class="card-gradient">
              <h2 class="text-sm font-semibold text-gray-200 mb-4">Scheduler Details</h2>
              <div class="grid grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-4">
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Name</span>
                  <p class="text-sm text-gray-200 mt-0.5 font-medium" x-text="scheduler.name || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Instance ID</span>
                  <p class="text-sm text-gray-200 mt-0.5 mono" x-text="scheduler.instanceId || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Job Store</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.jobStoreType || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Thread Pool</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.threadPoolType || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Uptime</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="formatDuration(scheduler.upTime) || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Status</span>
                  <p class="text-sm mt-0.5">
                    <span :class="scheduler.isStandbyMode ? 'badge badge-paused' : (scheduler.isStarted ? 'badge badge-running' : 'badge badge-error')"
                          x-text="scheduler.isStandbyMode ? 'Standby' : (scheduler.isStarted ? 'Running' : 'Stopped')"></span>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===================== JOBS PAGE ===================== -->
      <template x-if="currentPage === 'jobs'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <!-- Header -->
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Jobs</h1>
                <p class="text-xs text-gray-500 mt-0.5"><span x-text="filteredJobs.length"></span> of <span x-text="jobs.length"></span> jobs</p>
              </div>
              <div class="flex items-center gap-2">

                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

                  <button x-show="jobsFilter" @click="jobsFilter = ''" class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-500 hover:text-gray-300 transition-colors" style="display: none;">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
                <button @click="showCreateJobModal = true" class="btn btn-primary">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Create Job
                </button>
                <button @click="loadJobs()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.jobs">
              <div class="space-y-2">
                <template x-for="i in 4" :key="i">
                  <div class="card-gradient flex items-center gap-4">
                    <div class="sk h-10 w-10 rounded-lg flex-shrink-0"></div>
                    <div class="flex-1 space-y-2">
                      <div class="sk h-4 w-2/5"></div>
                      <div class="sk h-3 w-1/4"></div>
                    </div>
                    <div class="sk h-5 w-14 rounded-full"></div>
                    <div class="flex gap-1">
                      <div class="sk h-7 w-7 rounded"></div>
                      <div class="sk h-7 w-7 rounded"></div>
                      <div class="sk h-7 w-7 rounded"></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Jobs list -->
            <template x-if="!loading.jobs">
              <div class="space-y-2">
                <template x-for="job in filteredJobs" :key="job.group + '.' + job.name">
                  <div>
                    <!-- Job row -->
                    <div @click="toggleJobExpand(job.group, job.name)"
                         :class="['card-gradient flex items-center justify-between cursor-pointer pl-4 job-border',
                                  hasJobTriggers(job) ? 'job-border-triggers' : (job.isExecuting ? 'job-border-executing' : 'job-border-idle')]">
                      <div class="flex items-center gap-3 min-w-0 flex-1">
                        <!-- Expand chevron -->
                        <svg class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform duration-200"
                             :class="expandedJobs[job.group + '.' + job.name] ? 'rotate-90' : ''"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <polyline points="9 18 15 12 9 6"/>
                        </svg>
                        <!-- Info -->
                        <div class="min-w-0">
                          <div class="font-medium text-gray-100 text-sm truncate" x-text="job.name"></div>
                          <div class="text-xs text-gray-500 truncate" x-text="job.group"></div>
                        </div>
                      </div>
                      <div class="flex items-center gap-4 flex-shrink-0 ml-4">
                        <span class="mono text-[11px] text-gray-500 hidden lg:inline max-w-[160px] truncate" x-text="job.jobType"></span>
                        <span x-show="job.isExecuting" class="badge badge-running">Executing</span>
                        <span x-show="!job.isExecuting" class="badge badge-idle">Idle</span>
                        <div class="flex gap-1">
                          <button @click.stop="triggerJob(job.group, job.name)" class="btn btn-primary p-1.5" title="Trigger Now">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                          </button>
                          <button @click.stop="pauseJob(job.group, job.name)" class="btn btn-warning p-1.5" title="Pause">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                          </button>
                          <button @click.stop="resumeJob(job.group, job.name)" class="btn btn-success p-1.5" title="Resume">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                    <!-- Expanded trigger details -->
                    <div x-show="expandedJobs[job.group + '.' + job.name]" class="ml-8 mt-1 overflow-hidden accordion-enter">
                      <div class="bg-white/[0.02] border border-white/[0.05] rounded-lg p-3 space-y-1">
                        <template x-if="!job.triggers || !job.triggers.length">
                          <p class="text-xs text-gray-500 py-1.5 px-2">No triggers configured for this job</p>
                        </template>
                        <template x-for="t in job.triggers || []" :key="t.name">
                          <div class="flex items-center justify-between py-1.5 px-2.5 rounded-md hover:bg-white/[0.02]">
                            <div class="flex items-center gap-2.5 min-w-0">
                              <span class="text-xs font-medium text-gray-200 truncate" x-text="t.name"></span>
                              <span :class="'badge ' + (t.state === 'Normal' ? 'badge-normal' : t.state === 'Paused' ? 'badge-paused' : 'badge-idle')" x-text="t.state"></span>
                              <span class="text-[10px] text-gray-500 hidden sm:inline" x-text="t.scheduleDescription || t.type"></span>
                            </div>
                            <div class="flex items-center gap-2.5 flex-shrink-0">
                              <span class="text-[10px] text-gray-500 mono" x-text="t.nextFireTime ? 'in ' + relativeTime(t.nextFireTime) : '\u2014'"></span>
                              <button @click.stop="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2 py-1">Pause</button>
                              <button @click.stop="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2 py-1">Resume</button>
                              <button @click.stop="deleteJobTrigger(job.group, job.name, t.group, t.name)" class="btn btn-danger text-[10px] px-2 py-1">Delete</button>

                          </div>

                      </div>
                    </div>
                  </div>
                </template>
                <!-- Empty state: no match -->
                <div x-show="!filteredJobs.length && jobs.length > 0" class="card-gradient text-center py-10">
                  <svg class="w-10 h-10 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <p class="text-sm text-gray-500">No jobs match <span class="text-gray-400 font-medium" x-text="'\u2018' + jobsFilter + '\u2019'"></span></p>

                </div>

                <div x-show="!jobs.length" class="card-gradient text-center py-12">
                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                  </svg>

                  <button @click="showCreateJobModal = true" class="btn btn-primary mt-4 text-xs" x-show="!config.readOnly">Create Job</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== TRIGGERS PAGE ===================== -->
      <template x-if="currentPage === 'triggers'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Triggers</h1>
                <p class="text-xs text-gray-500 mt-0.5">Grouped by job</p>
              </div>
              <div class="flex items-center gap-2">
                <button @click="showCreateTriggerModal = true" class="btn btn-primary">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Create Trigger
                </button>
                <button @click="loadTriggers()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.triggers">
              <div class="space-y-3">
                <template x-for="i in 6" :key="i">
                  <div class="card-gradient p-4 space-y-3">
                    <div class="flex items-center gap-2">
                      <div class="sk h-4 w-4 rounded"></div>
                      <div class="sk h-4 w-1/4"></div>
                      <div class="sk h-5 w-20 rounded-full"></div>

                    <div class="sk h-8 w-full rounded ml-6"></div>
                  </div>

            <template x-if="!loading.triggers">
              <div class="space-y-2">
                <template x-for="(group, gIdx) in groupedTriggers" :key="gIdx">

                    <div @click="toggleTriggerGroup(gIdx)" class="flex items-center gap-2 px-5 py-3 cursor-pointer hover:bg-white/[0.02] transition-colors">
                      <svg class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform duration-200"
                           :class="expandedTriggerGroups[gIdx] ? 'rotate-90' : ''"
                           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                      </svg>
                      <span class="text-sm font-medium text-gray-200" x-text="group.jobName"></span>
                      <span class="badge badge-idle text-[10px]" x-text="group.triggers.length + ' trigger' + (group.triggers.length !== 1 ? 's' : '')"></span>
                    </div>
                    <div x-show="expandedTriggerGroups[gIdx]" class="accordion-enter">
                      <div class="table-wrap rounded-none border-0 border-t border-white/[0.04]">
                        <table>
                          <thead>
                            <tr>
                              <th>Trigger</th>
                              <th class="hidden sm:table-cell">Type</th>
                              <th>State</th>
                              <th class="hidden md:table-cell">Schedule</th>
                              <th>Next Fire</th>
                              <th class="text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="t in group.triggers" :key="t.group + '.' + t.name">
                              <tr>
                                <td class="font-medium text-gray-100 text-xs" x-text="t.name"></td>
                                <td class="hidden sm:table-cell"><span class="mono text-xs text-gray-400" x-text="t.type"></span></td>
                                <td>
                                  <span :class="'badge ' + (t.state === 'Normal' ? 'badge-normal' : t.state === 'Paused' ? 'badge-paused' : 'badge-idle')" x-text="t.state"></span>
                                </td>
                                <td class="hidden md:table-cell text-xs text-gray-400" x-text="t.scheduleDescription || '\u2014'"></td>
                                <td class="text-xs mono text-gray-400">
                                  <span x-text="t.nextFireTime ? 'in ' + relativeTime(t.nextFireTime) : '\u2014'"></span>
                                </td>
                                <td class="text-right">
                                  <div class="flex gap-1 justify-end">
                                    <button @click.stop="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2 py-1">Pause</button>
                                    <button @click.stop="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2 py-1">Resume</button>
                                    <button @click.stop="deleteTrigger(t.group, t.name)" class="btn btn-danger text-[10px] px-2 py-1">Delete</button>
                                  </div>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>
                <div x-show="!groupedTriggers.length" class="card-gradient text-center py-12">
                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>

                  <p class="text-sm text-gray-400 mb-1">No triggers configured yet</p>
                  <p class="text-xs text-gray-500">Create a trigger to schedule job execution</p>
                  <button @click="showCreateTriggerModal = true" class="btn btn-primary mt-4 text-xs" x-show="!config.readOnly">Create Trigger</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== EXECUTING PAGE ===================== -->
      <template x-if="currentPage === 'executing'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">

            <div class="flex items-center justify-between">
              <div>

              </div>
              <button @click="loadExecutingJobs()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="i in 4" :key="i">
                  <div class="card-gradient p-5 space-y-4">
                    <div class="flex items-center gap-2">
                      <div class="sk h-3 w-3 rounded-full"></div>
                      <div class="sk h-4 w-1/3"></div>
                      <div class="sk h-5 w-16 rounded-full"></div>

                      <div class="flex justify-between"><div class="sk h-3 w-16"></div><div class="sk h-3 w-12"></div></div>
                      <div class="sk h-2 w-full rounded-full"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                    </div>
                  </div>
                </template>
              </div>

                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <p class="text-base font-medium text-gray-400">All quiet</p>
                  <p class="text-sm text-gray-600 mt-1">No jobs are currently executing</p>
                  <p class="text-xs text-gray-600 mt-2">When a job fires, it will appear here in real-time</p>
                </div>

                <!-- Job cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" x-show="executingJobs.length">

                      <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                          <span class="relative inline-flex">
                            <span class="status-dot status-dot-running"></span>
                          </span>
                          <span class="font-medium text-gray-100 text-sm" x-text="ej.jobName"></span>
                          <span class="text-xs text-gray-500" x-text="ej.jobGroup"></span>
                        </div>
                        <span class="badge badge-running">Running</span>
                      </div>
                      <!-- Duration bar -->
                      <div class="mb-4">
                        <div class="flex justify-between text-[11px] text-gray-500 mb-1.5">
                          <span>Duration</span>
                          <span class="font-medium text-gray-300" x-text="formatDuration(ej.duration)"></span>
                        </div>
                        <div class="w-full h-1.5 bg-gray-700/40 rounded-full overflow-hidden">
                          <div class="h-full rounded-full bg-quartz-500 duration-bar"
                               :style="'width: ' + Math.min((ej.durationMs || 0) / 100, 100) + '%'"></div>
                        </div>
                      </div>
                      <!-- Details grid -->
                      <div class="grid grid-cols-3 gap-x-4 gap-y-3">
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Type</span>
                          <p class="text-gray-300 mono text-xs mt-0.5 truncate" x-text="ej.jobType || '\u2014'"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Trigger</span>
                          <p class="text-gray-300 text-xs mt-0.5 truncate" x-text="ej.triggerGroup + '.' + ej.triggerName || '\u2014'"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Refire #</span>
                          <p class="text-gray-300 text-xs mt-0.5" x-text="ej.refireCount"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Fired At</span>
                          <p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="formatDate(ej.fireTime)"></p>

                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Scheduled</span>

                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Instance</span>
                          <p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="(ej.fireInstanceId || '').slice(0, 12) + '...'"></p>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== HISTORY PAGE ===================== -->

                  <div class="sk h-3 w-16"></div>

                <template x-for="i in 5" :key="i">
                  <div class="flex items-center gap-4 py-2 border-b border-white/[0.02] last:border-0">
                    <div class="sk h-3 w-24"></div>
                    <div class="sk h-3 w-20"></div>
                    <div class="sk h-3 w-16"></div>
                    <div class="sk h-2 w-24 rounded-full"></div>
                    <div class="sk h-5 w-10 rounded-full ml-auto"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- History -->
            <template x-if="!loading.history">
              <div>
                <!-- Empty state -->
