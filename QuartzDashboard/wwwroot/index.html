              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="i in 4" :key="i">
                  <div class="card-gradient p-5 space-y-4">
                    <div class="flex items-center gap-2">
                      <div class="sk h-3 w-3 rounded-full"></div>
                      <div class="sk h-4 w-1/3"></div>
                      <div class="sk h-5 w-16 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                      <div class="flex justify-between"><div class="sk h-3 w-16"></div><div class="sk h-3 w-12"></div></div>
                      <div class="sk h-2 w-full rounded-full"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                      <div class="sk h-10 rounded"></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Executing jobs -->
            <template x-if="!loading.executing">
              <div>
                <!-- Empty state -->
                <div x-show="!executingJobs.length" class="card-gradient text-center py-16">
                  <svg class="w-14 h-14 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  <p class="text-base font-medium text-gray-400">All quiet</p>
                  <p class="text-sm text-gray-600 mt-1">No jobs are currently executing</p>
                  <p class="text-xs text-gray-600 mt-2">When a job fires, it will appear here in real-time</p>
                </div>

                <!-- Job cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" x-show="executingJobs.length">
                  <template x-for="(ej, idx) in executingJobs" :key="ej.fireInstanceId || idx">
                    <div class="card-gradient" :class="isNewExecutingJob(ej) ? 'highlight-new' : ''">
                      <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2.5">
                          <span class="relative inline-flex">
                            <span class="status-dot status-dot-running"></span>
                          </span>
                          <span class="font-medium text-gray-100 text-sm" x-text="ej.jobName"></span>
                          <span class="text-xs text-gray-500" x-text="ej.jobGroup"></span>
                        </div>
                        <span class="badge badge-running">Running</span>
                      </div>
                      <!-- Duration bar -->
                      <div class="mb-4">
                        <div class="flex justify-between text-[11px] text-gray-500 mb-1.5">
                          <span>Duration</span>
                          <span class="font-medium text-gray-300" x-text="formatLiveDuration(ej.fireTime)"></span>
                        </div>
                        <div class="w-full h-1.5 bg-gray-700/40 rounded-full overflow-hidden">
                          <div class="h-full rounded-full bg-quartz-500 duration-bar"
                               :style="'width: ' + Math.min(Math.round((currentTick - new Date(ej.fireTime).getTime()) / 60000 * 100), 100) + '%'"></div>
                        </div>
                      </div>
                      <!-- Details grid -->
                      <div class="grid grid-cols-3 gap-x-4 gap-y-3">
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Type</span>
                          <p class="text-gray-300 mono text-xs mt-0.5 truncate" x-text="ej.jobType || '\u2014'"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Trigger</span>
                          <p class="text-gray-300 text-xs mt-0.5 truncate" x-text="ej.triggerGroup + '.' + ej.triggerName || '\u2014'"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Refire #</span>
                          <p class="text-gray-300 text-xs mt-0.5" x-text="ej.refireCount"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Fired At</span>
                          <p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="formatDate(ej.fireTime)"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Scheduled</span>
                          <p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="formatDate(ej.scheduledFireTime)"></p>
                        </div>
                        <div>
                          <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Instance</span>
                          <p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="(ej.fireInstanceId || '').slice(0, 12) + '...'"></p>
                        </div>
                      </div>
                      <div x-show="!config.readOnly" class="mt-3 pt-3 border-t border-white/[0.04]">
                        <button @click="interruptJob(ej.jobGroup, ej.jobName)"
                                class="btn btn-ghost text-xs text-amber-400 hover:text-amber-300 w-full justify-center">
                          <svg class="w-3.5 h-3.5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                          </svg>
                          Interrupt
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== HISTORY PAGE ===================== -->
      <template x-if="currentPage === 'history'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Fire History</h1>
                <p class="text-xs text-gray-500 mt-0.5"><span x-text="historyFiltered.length"></span> of <span x-text="historyTotal"></span> total</p>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button @click="exportHistoryCSV()" class="btn btn-ghost text-xs" title="Export CSV">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Export CSV
                </button>
                <button @click="loadHistory()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Filter bar -->
            <div class="card-gradient p-3 flex flex-wrap items-center gap-3">
              <!-- Search -->
              <div class="relative flex-1 min-w-[160px]">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" x-model="historyFilterObj.search" placeholder="Search by job key..." class="glass-input pl-8 w-full text-xs">
              </div>
              <!-- Status toggles -->
              <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                <button @click="historyFilterObj.status = 'all'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', historyFilterObj.status === 'all' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">All</button>
                <button @click="historyFilterObj.status = 'success'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', historyFilterObj.status === 'success' ? 'bg-emerald-600 text-white' : 'text-gray-400 hover:text-gray-200']">Success</button>
                <button @click="historyFilterObj.status = 'error'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', historyFilterObj.status === 'error' ? 'bg-red-600 text-white' : 'text-gray-400 hover:text-gray-200']">Error</button>
              </div>
              <!-- Date range -->
              <input type="datetime-local" x-model="historyFilterObj.dateFrom" class="glass-input text-xs w-44" title="From date">
              <input type="datetime-local" x-model="historyFilterObj.dateTo" class="glass-input text-xs w-44" title="To date">
              <!-- Clear -->
              <button x-show="historyFilterObj.search || historyFilterObj.status !== 'all' || historyFilterObj.dateFrom || historyFilterObj.dateTo"
                      @click="historyFilterObj = { search: '', status: 'all', dateFrom: '', dateTo: '' }"
                      class="btn btn-ghost text-xs">Clear</button>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.history">
              <div class="card-gradient p-5">
                <div class="flex items-center gap-4 pb-3 mb-3 border-b border-white/[0.04]">
                  <div class="sk h-3 w-24"></div>
                  <div class="sk h-3 w-20"></div>
                  <div class="sk h-3 w-16"></div>
                  <div class="sk h-3 w-24"></div>
                  <div class="sk h-5 w-10 rounded-full ml-auto"></div>
                </div>
                <template x-for="i in 5" :key="i">
                  <div class="flex items-center gap-4 py-2 border-b border-white/[0.02] last:border-0">
                    <div class="sk h-3 w-24"></div>
                    <div class="sk h-3 w-20"></div>
                    <div class="sk h-3 w-16"></div>
                    <div class="sk h-2 w-24 rounded-full"></div>
                    <div class="sk h-5 w-10 rounded-full ml-auto"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- History -->
            <template x-if="!loading.history">
              <div>
                <!-- Empty state: no history at all -->
                <template x-if="!history.length">
                  <div class="flex flex-col items-center justify-center py-16 text-center card-gradient">
                    <div class="text-4xl mb-3 opacity-30">📋</div>
                    <div class="text-sm font-medium text-gray-400">No execution history yet</div>
                    <div class="text-xs text-gray-600 mt-1">History appears as jobs run</div>
                    <p class="text-xs text-gray-600 mt-2">Enable <code class="mono text-xs bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">AddQuartzDashboardHistory()</code> to track execution history</p>
                  </div>
                </template>

                <div x-show="historyFiltered.length" class="table-wrap">
                  <table class="mobile-card-table">
                    <thead>
                      <tr>
                        <th>Time</th>
                        <th>Job</th>
                        <th class="hidden sm:table-cell">Trigger</th>
                        <th>Duration</th>
                        <th class="hidden md:table-cell">Bar</th>
                        <th>Outcome</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(h, idx) in historyFiltered" :key="idx">
                        <tr>
                          <td class="mono text-xs text-gray-400" data-label="Time" x-text="formatDate(h.fireTime)"></td>
                          <td class="font-medium text-gray-100 text-xs" data-label="Job" x-text="h.jobKey"></td>
                          <td class="text-xs text-gray-500 hidden sm:table-cell truncate max-w-[140px]" data-label="Trigger" x-text="h.triggerKey"></td>
                          <td class="text-xs mono text-gray-300" data-label="Duration" x-text="h.duration ? formatDuration(h.duration) : '\u2014'"></td>
                          <td class="hidden md:table-cell" data-label="">
                            <div class="w-24 h-1.5 bg-gray-700/40 rounded-full overflow-hidden">
                              <div class="h-full rounded-full duration-bar"
                                   :class="h.success ? 'bg-emerald-500' : 'bg-red-500'"
                                   :style="'width: ' + Math.min((h.durationMs || 0) / (maxHistoryDuration || 5000) * 100, 100) + '%'"></div>
                            </div>
                          </td>
                          <td data-label="Outcome">
                            <span :class="h.success ? 'badge badge-ok' : 'badge badge-error'" x-text="h.success ? 'OK' : 'Error'"></span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div x-show="history.length < historyTotal" class="pt-3 text-center border-t border-white/[0.04] mt-2">
                  <button @click="loadMoreHistory()" class="btn btn-ghost text-xs">
                    Load more <span class="text-gray-500 ml-1" x-text="'(' + (historyTotal - history.length) + ' remaining)'"></span>
                  </button>
                </div>
                <div x-show="!historyFiltered.length && history.length > 0" class="card-gradient text-center py-10">
                  <svg class="w-10 h-10 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <p class="text-sm text-gray-500">No records match filter</p>
                  <button @click="historyFilterObj = { search: '', status: 'all', dateFrom: '', dateTo: '' }" class="btn btn-ghost mt-2 text-xs">Clear filter</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== GRAPH PAGE (ChartEngine) ===================== -->
      <template x-if="currentPage === 'graph'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <!-- Header -->
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Execution Graph</h1>
                <p class="text-xs text-gray-500 mt-0.5">Execution rate and duration over time</p>
              </div>
              <div class="flex items-center gap-2">
                <!-- Live / History view toggle -->
                <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                  <button @click="graphView = 'live'; graphData = getGraphData()" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphView === 'live' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Live</button>
                  <button @click="graphView = 'history'; loadGraphHistoryData()" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphView === 'history' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">History</button>
                </div>
                <!-- Chart mode toggle -->
                <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                  <button @click="graphChartMode = 'line'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'line' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Line</button>
                  <button @click="graphChartMode = 'bar'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'bar' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Bar</button>
                  <button @click="graphChartMode = 'heatmap'" :class="['px-2.5 py-1 text-[10px] font-medium rounded-md transition-colors', graphChartMode === 'heatmap' ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200']">Heat</button>
                </div>
                <!-- Time range buttons -->
                <div class="flex rounded-lg bg-gray-900 p-0.5 gap-0.5">
                  <button @click="graphTimeRange = 5; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 5 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">5m</button>
                  <button @click="graphTimeRange = 15; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 15 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">15m</button>
                  <button @click="graphTimeRange = 30; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 30 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">30m</button>
                  <button @click="graphTimeRange = 60; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 60 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">1h</button>
                  <button @click="graphTimeRange = 360; loadGraphData()" :class="['px-2 py-1 text-[10px] font-medium rounded-md transition-colors', graphTimeRange === 360 ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200']">6h</button>
                </div>
                <!-- Download PNG -->
                <button @click="ChartEngine.exportPNG($refs.graphSvg, 'quartz-graph.png')" class="btn btn-ghost" title="Download PNG">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </button>
                <!-- Refresh -->
                <button @click="loadGraphData()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.stats">
              <div class="card-gradient p-5">
                <div class="sk h-64 w-full rounded-lg relative overflow-hidden">
                  <!-- Chart-shaped skeleton with axis lines -->
                  <div class="absolute left-10 top-0 bottom-10 flex flex-col justify-between">
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                    <div class="sk h-3 w-10"></div>
                  </div>
                  <div class="absolute left-24 right-6 top-6 bottom-12">
                    <div class="sk h-full w-full rounded" style="opacity: 0.15;"></div>
                    <div class="absolute left-0 right-0 top-1/3 sk h-0.5 w-full" style="opacity: 0.3;"></div>
                    <div class="absolute left-0 right-0 top-2/3 sk h-0.5 w-full" style="opacity: 0.3;"></div>
                  </div>
                  <div class="absolute left-24 right-6 bottom-10 sk h-0.5"></div>
                </div>
                <div class="flex justify-center gap-8 mt-6 pt-4 border-t border-white/[0.04]">
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                  <div class="sk h-4 w-20"></div>
                </div>
              </div>
            </template>

            <!-- Graph -->
            <template x-if="!loading.stats">
              <div class="card-gradient">
                <!-- Empty state -->
                <div x-show="!graphData.length" class="text-center py-16">
                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
                    <line x1="2" y1="20" x2="22" y2="20" stroke-width="1"/>
                  </svg>
                  <p class="text-base font-medium text-gray-400">No execution data yet</p>
                  <p class="text-sm text-gray-600 mt-1">Graph data appears as jobs are executed</p>
                  <p class="text-xs text-gray-600 mt-2">Try triggering a job or waiting for scheduled executions</p>
                </div>

                <div x-show="graphData.length">
                <div class="relative" x-ref="graphContainer" @mousemove="onGraphMouseMove($event)" @mouseleave="graphCrosshair.show = false"
                     x-init="$nextTick(() => { graphWidth = Math.max(400, $el.offsetWidth || 800); updateGraphChart(); })">
                  <!-- Chart rendered via innerHTML to bypass Alpine SVG namespace issues -->
                  <div x-ref="graphChartWrap"
                       x-effect="graphData.length && updateGraphChart()">
                  </div>

                  <!-- Crosshair overlay -->
                  <svg x-show="graphCrosshair.show" class="absolute inset-0 pointer-events-none overflow-visible"
                       :width="graphWidth" :height="graphHeight + 50" :viewBox="'0 0 ' + graphWidth + ' ' + (graphHeight + 50)"
                       style="display:none;top:0;left:0">
                    <line :x1="graphCrosshair.x" y1="0" :x2="graphCrosshair.x" :y2="graphHeight"
                          stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
                  </svg>

                  <!-- Tooltip overlay -->
                  <div x-show="graphCrosshair.show"
                       :style="'left: ' + Math.min(graphCrosshair.x + 12, graphWidth - 180) + 'px; top: 12px;'"
                       class="absolute z-20 pointer-events-none" style="display: none;">
                    <div class="bg-gray-900/95 backdrop-blur-sm border border-white/[0.08] rounded-lg px-3 py-2 shadow-xl min-w-[130px]">
                      <div class="text-xs font-medium text-gray-200 mb-1" x-text="graphTooltipTime"></div>
                      <div class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-quartz-400"></span>
                        <span x-text="'Count: ' + (graphCrosshair.data ? graphCrosshair.data.count : '\u2014')" class="text-gray-300"></span>
                      </div>
                      <div class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span x-text="'Dur: ' + (graphCrosshair.data ? Math.round(graphCrosshair.data.avgDurationMs || 0) + 'ms' : '\u2014')" class="text-gray-300"></span>
                      </div>
                      <div x-show="graphCrosshair.data && graphCrosshair.data.errorRate !== undefined" class="flex items-center gap-2 text-[11px]">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
                        <span x-text="'Err: ' + (graphCrosshair.data ? (graphCrosshair.data.errorRate * 100).toFixed(1) + '%' : '\u2014')" class="text-red-300"></span>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- Stats footer -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-4 border-t border-white/[0.04]">
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Peak Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="Math.max(...graphData.map(b => b.count || 0), 0) + '/min'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Avg Duration</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="graphData.length ? Math.round(graphData.reduce((a,b) => a + (b.avgDurationMs||0), 0) / graphData.length) + 'ms' : '\u2014'"></p>
                  </div>
                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Total Executions</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="stats.totalExecutions || 0"></p>

                  <div>
                    <span class="text-[10px] font-medium uppercase tracking-wider text-gray-500">Current Rate</span>
                    <p class="text-base font-semibold text-gray-200 tabular-nums mt-0.5" x-text="(stats.executionRate || 0).toFixed(2) + '/s'"></p>
                </div>
              </div>
            </div>  <!-- closes graphData.length wrapper -->
              </div>  <!-- closes card-gradient -->
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== TIMELINE PAGE ===================== -->
      <template x-if="currentPage === 'timeline'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">

            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Execution Timeline</h1>
                <p class="text-xs text-gray-500 mt-0.5">Gantt view of job executions — hover for details</p>
              </div>
              <div class="flex items-center gap-2">
                <!-- Range picker -->
                <div class="flex items-center bg-gray-900 border border-white/[0.06] rounded-lg p-0.5 gap-0.5">
                  <template x-for="r in [10, 30, 60, 180]" :key="r">
                    <button @click="timelineRange = r"
                            :class="timelineRange === r ? 'bg-quartz-600 text-white' : 'text-gray-400 hover:text-gray-200 hover:bg-white/[0.04]'"
                            class="px-2.5 py-1 rounded text-xs font-medium transition-all"

                    </button>
                  </template>
                </div>
                <button @click="loadTimeline()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Stats strip -->
            <div class="grid grid-cols-4 gap-2">
              <div class="card-gradient px-3 py-2.5 text-center">
                <div class="text-xl font-bold text-gray-100 tabular-nums" x-text="timelineStats.total"></div>
                <div class="text-[10px] text-gray-500 mt-0.5">Executions</div>
              </div>
              <div class="card-gradient px-3 py-2.5 text-center">
                <div class="text-xl font-bold text-emerald-400 tabular-nums" x-text="timelineStats.success"></div>
                <div class="text-[10px] text-gray-500 mt-0.5">Succeeded</div>
              </div>
              <div class="card-gradient px-3 py-2.5 text-center">
                <div class="text-xl font-bold tabular-nums" :class="timelineStats.failed > 0 ? 'text-red-400' : 'text-gray-500'" x-text="timelineStats.failed"></div>
                <div class="text-[10px] text-gray-500 mt-0.5">Failed</div>
              </div>
              <div class="card-gradient px-3 py-2.5 text-center">
                <div class="text-xl font-bold text-quartz-400 tabular-nums" x-text="timelineStats.avgDur > 0 ? timelineStats.avgDur.toFixed(1) + 'ms' : '—'"></div>
                <div class="text-[10px] text-gray-500 mt-0.5">Avg Duration</div>
              </div>
            </div>

            <!-- Gantt Chart -->
            <div class="card-gradient overflow-hidden">
              <template x-if="loading.timeline">
                <div class="flex items-center justify-center py-16 gap-3">
                  <div class="spinner w-5 h-5"></div>
                  <span class="text-sm text-gray-500">Loading timeline...</span>
                </div>
              </template>

              <template x-if="!loading.timeline && !timelineVisibleEvents.length">
                <div class="flex flex-col items-center justify-center py-16 gap-4">
                  <svg class="w-10 h-10 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/>
                  </svg>
                  <div class="text-center">
                    <p class="text-sm text-gray-400 font-medium">No executions in this range</p>
                    <p class="text-xs text-gray-600 mt-1">Try a wider range or trigger a job</p>
                  </div>
                </div>
              </template>

              <template x-if="!loading.timeline && timelineVisibleEvents.length">
                <div class="relative" x-ref="timelineContainer"
                     x-init="$nextTick(() => { timelineWidth = $el.offsetWidth || 800; updateTimelineChart(); })"
                     @mousemove="
                       const rect = $el.getBoundingClientRect();
                       timelineTooltip.screenX = $event.clientX - rect.left;
                       timelineTooltip.screenY = $event.clientY - rect.top;
                       const bar = $event.target && $event.target.closest ? $event.target.closest('.tl-bar') : null;
                       if (bar && bar.dataset && bar.dataset.key) {
                         timelineTooltip.show = true;
                         timelineHoverRow = parseInt(bar.dataset.row);
                         timelineTooltip.event = {
                           jobKey: bar.dataset.key,
                           triggerKey: bar.dataset.trigger || '',
                           fireTime: bar.dataset.time,
                           duration: parseFloat(bar.dataset.dur) || 0,
                           success: bar.dataset.success !== 'false',
                           errorMessage: bar.dataset.error || null,
                         };
                       } else {
                         timelineTooltip.show = false;
                         timelineHoverRow = -1;
                         timelineTooltip.event = null;
                       }
                     "
                     @mouseleave="timelineTooltip.show = false; timelineHoverRow = -1; timelineTooltip.event = null;">

                  <!-- Row hover highlight overlay -->
                  <div x-show="timelineHoverRow >= 0"
                       :style="'position:absolute;top:' + (8 + timelineHoverRow * 52) + 'px;height:51px;left:0;right:0;pointer-events:none;background:rgba(255,255,255,0.03);border-radius:2px'">
                  </div>

                  <!-- Chart rendered via innerHTML to bypass Alpine SVG namespace issues -->
                  <div x-ref="timelineChartWrap"
                       x-effect="timelineEvents.length + '|' + timelineRange && updateTimelineChart()">
                  </div>

                  <!-- Floating tooltip: single :style handles both visibility and position to avoid x-show/:style conflict -->
                  <div x-ref="timelineTooltipEl"
                       :style="(timelineTooltip.show && timelineTooltip.event && timelineTooltip.event.jobKey)
                         ? 'display:block;position:absolute;z-index:30;left:' + Math.min(timelineTooltip.screenX + 14, timelineWidth - 220) + 'px;top:' + Math.max(4, timelineTooltip.screenY - 110) + 'px'
                         : 'display:none'"
                       class="bg-gray-900/95 border border-white/10 rounded-xl px-3.5 py-3 shadow-2xl pointer-events-none min-w-[200px] backdrop-blur-sm"
                       style="display:none">
                    <template x-if="timelineTooltip.show && timelineTooltip.event && timelineTooltip.event.jobKey">
                      <div class="space-y-2">
                        <!-- Job name + status indicator -->
                        <div class="flex items-start justify-between gap-2">
                          <div>
                            <div class="text-xs font-bold text-gray-100 leading-tight"
                                 x-text="timelineTooltip.event.jobKey ? timelineTooltip.event.jobKey.split('.').pop() : ''"></div>
                            <div class="text-[10px] text-gray-500 font-mono mt-0.5"
                                 x-text="timelineTooltip.event.jobKey ? timelineTooltip.event.jobKey.split('.')[0] : ''"></div>
                          </div>
                          <span class="flex-shrink-0 flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                                :class="timelineTooltip.event.success ? 'bg-emerald-500/15 text-emerald-400' : 'bg-red-500/15 text-red-400'"
                                x-text="timelineTooltip.event.success ? '✓ OK' : '✗ ERR'"></span>
                        </div>

                        <!-- Trigger -->
                        <div x-show="timelineTooltip.event.triggerKey" class="text-[10px] text-gray-600 font-mono truncate"
                             x-text="'⚡ ' + (timelineTooltip.event.triggerKey || '')"></div>

                        <!-- Stats -->
                        <div class="border-t border-white/[0.07] pt-1.5 space-y-1.5">
                          <div class="flex justify-between gap-4 text-[10px]">
                            <span class="text-gray-500">Duration</span>
                            <span class="text-gray-100 font-mono font-medium"
                                  x-text="timelineTooltip.event.duration
                                    ? (timelineTooltip.event.duration < 1000 ? timelineTooltip.event.duration.toFixed(1) + ' ms' : (timelineTooltip.event.duration / 1000).toFixed(2) + ' s')
                                    : '—'"></span>
                          </div>
                          <div class="flex justify-between gap-4 text-[10px]">
                            <span class="text-gray-500">Fired at</span>
                            <span class="text-gray-100 font-mono"
                                  x-text="timelineTooltip.event.fireTime ? new Date(timelineTooltip.event.fireTime).toLocaleTimeString(undefined, {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—'"></span>
                          </div>
                          <div x-show="timelineTooltip.event.fireTime" class="flex justify-between gap-4 text-[10px]">
                            <span class="text-gray-500">Date</span>
                            <span class="text-gray-400 font-mono"
                                  x-text="timelineTooltip.event.fireTime ? new Date(timelineTooltip.event.fireTime).toLocaleDateString(undefined, {month:'short',day:'numeric'}) : ''"></span>
                          </div>
                        </div>

                        <!-- Error message -->
                        <template x-if="timelineTooltip.event.errorMessage">
                          <div class="text-[10px] text-red-300 font-mono bg-red-500/10 border border-red-500/20 px-2 py-1.5 rounded-lg mt-0.5 break-words max-w-[190px]"
                               x-text="timelineTooltip.event.errorMessage"></div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- Recent executions table -->
            <div class="card-gradient">
              <div class="flex items-center justify-between px-4 pt-4 pb-3 border-b border-white/[0.04]">
                <h2 class="text-sm font-semibold text-gray-200">Recent Executions</h2>
                <span class="text-xs text-gray-600" x-text="timelineVisibleEvents.length + ' in range'"></span>
              </div>
              <div class="divide-y divide-white/[0.04]">
                <template x-for="(evt, idx) in timelineVisibleEvents.slice(0, 20)" :key="evt.fireTime + '-' + idx">
                  <div class="flex items-center gap-3 px-4 py-2.5 hover:bg-white/[0.02] transition-colors">
                    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 mt-0.5"
                          :class="evt.success ? 'bg-emerald-400' : 'bg-red-400'"></span>
                    <div class="flex-1 min-w-0">
                      <span class="text-xs font-medium text-gray-200 truncate" x-text="evt.jobKey ? evt.jobKey.split('.').pop() : evt.jobKey"></span>
                      <span class="text-[10px] text-gray-600 ml-1.5" x-text="evt.jobKey ? evt.jobKey.split('.')[0] : ''"></span>
                    </div>
                    <span class="text-[10px] text-gray-500 font-mono tabular-nums" x-text="evt.duration ? evt.duration.toFixed(1) + 'ms' : '—'"></span>
                    <span class="text-[10px] text-gray-600 font-mono tabular-nums w-16 text-right"
                          x-text="evt.fireTime ? new Date(evt.fireTime).toLocaleTimeString() : '—'"></span>
                  </div>
                </template>
                <template x-if="timelineVisibleEvents.length === 0 && !loading.timeline">
                  <div class="px-4 py-6 text-center text-xs text-gray-600">No executions in selected range</div>
                </template>
              </div>
            </div>

          </div>
        </div>
      </template>

      <!-- ===================== SETTINGS PAGE ===================== -->
      <template x-if="currentPage === 'settings'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div>
              <h1 class="text-lg font-semibold tracking-tight text-gray-100">Settings</h1>
              <p class="text-xs text-gray-500 mt-0.5">Dashboard preferences and configuration</p>
            </div>

            <!-- Refresh interval -->
            <div class="card-gradient space-y-4">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-quartz-500/15 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-quartz-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                  <h2 class="text-sm font-semibold text-gray-100">Refresh Interval</h2>
                  <p class="text-xs text-gray-500">How often the dashboard auto-refreshes data</p>
                </div>
                <div class="ml-auto">
                  <span class="text-2xl font-bold text-quartz-400 tabular-nums" x-text="settings.refreshInterval"></span>
                  <span class="text-sm text-gray-500">s</span>
                </div>
              </div>
              <!-- Presets -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-600 mr-1">Quick:</span>
                <template x-for="preset in [3, 5, 10, 15, 30, 60]" :key="preset">
                  <button @click="settings.refreshInterval = preset"
                          :class="settings.refreshInterval == preset ? 'bg-quartz-600 text-white border-quartz-500' : 'bg-white/[0.03] text-gray-400 border-white/[0.08] hover:bg-white/[0.06] hover:text-gray-200'"
                          class="px-2.5 py-1 rounded-md text-xs font-mono border transition-all"
                          x-text="preset + 's'">
                  </button>
                </template>
              </div>
              <input type="range" x-model="settings.refreshInterval" min="1" max="120" step="1"
                     class="w-full accent-quartz-500">
              <div class="flex justify-between text-[10px] text-gray-700 -mt-2 px-0.5">
                <span>1s</span><span>30s</span><span>60s</span><span>120s</span>
              </div>
            </div>

            <!-- Auto-refresh by page -->

              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </div>
                <div>
                  <h2 class="text-sm font-semibold text-gray-100">Auto-Refresh by Page</h2>
                  <p class="text-xs text-gray-500">Enable or disable auto-refresh per section</p>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
                <template x-for="item in navItems" :key="item.id">
                  <label @click.prevent="toggleAutoRefresh(item.id)"
                         class="flex items-center justify-between py-2 px-3 rounded-lg hover:bg-white/[0.03] cursor-pointer transition-colors">
                    <div class="flex items-center gap-2.5">
                      <span x-html="item.icon" class="w-4 h-4 flex-shrink-0"
                            :class="settings.autoRefreshPages[item.id] ? 'text-gray-300' : 'text-gray-600'"></span>
                      <span class="text-sm" :class="settings.autoRefreshPages[item.id] ? 'text-gray-300' : 'text-gray-600'" x-text="item.label"></span>
                    </div>
                    <div :class="['toggle', settings.autoRefreshPages[item.id] ? 'toggle-on' : 'toggle-off']">
                      <div :class="['toggle-knob', settings.autoRefreshPages[item.id] ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                    </div>
                  </label>
                </template>
              </div>
            </div>

            <!-- Appearance -->
            <div class="card-gradient space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </div>
                <div>
                  <h2 class="text-sm font-semibold text-gray-100">Appearance</h2>
                  <p class="text-xs text-gray-500">Customize the dashboard look</p>
                </div>
              </div>
              <label @click.prevent="toggleLightMode()"
                     class="flex items-center justify-between py-2.5 px-3 rounded-lg hover:bg-white/[0.03] cursor-pointer transition-colors border border-white/[0.04]">
                <div class="flex items-center gap-3">
                  <template x-if="!lightMode">
                    <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                  </template>
                  <template x-if="lightMode">
                    <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                  </template>
                  <div>
                    <span class="text-sm text-gray-200" x-text="lightMode ? 'Light Mode' : 'Dark Mode'"></span>
                    <span class="text-xs text-gray-600 block" x-text="lightMode ? 'Click to switch to dark' : 'Click to switch to light'"></span>
                  </div>
                </div>
                <div :class="['toggle', lightMode ? 'toggle-on' : 'toggle-off']">
                  <div :class="['toggle-knob', lightMode ? 'toggle-knob-on' : 'toggle-knob-off']"></div>
                </div>
              </label>
            </div>

            <div class="card-gradient space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-purple-500/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
                </div>
                <div>
                  <h2 class="text-sm font-semibold text-gray-100">Keyboard Shortcuts</h2>
                  <p class="text-xs text-gray-500">Navigate faster with the keyboard</p>
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
                <template x-for="sc in [
                  { keys: ['⌘', 'K'], desc: 'Command palette' },
                  { keys: ['R'], desc: 'Refresh current page' },
                  { keys: ['/'], desc: 'Focus search' },
                  { keys: ['1',' – ','9'], desc: 'Switch to page N' },
                  { keys: ['Esc'], desc: 'Close modal / palette' },
                  { keys: ['g', 'o/j/t/h/e/l/x/s'], desc: 'Navigate to page' },
                  { keys: ['J / K'], desc: 'Navigate jobs table rows' },
                  { keys: ['Enter'], desc: 'Open selected job' },
                ]" :key="sc.desc">
                  <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-white/[0.02]">
                    <span class="text-xs text-gray-400" x-text="sc.desc"></span>
                    <div class="flex items-center gap-0.5">
                      <template x-for="(k, ki) in sc.keys" :key="ki">
                        <kbd class="px-1.5 py-0.5 text-[10px] font-mono rounded bg-gray-800 border border-white/10 text-gray-300" x-text="k"></kbd>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Connection -->
            <div class="card-gradient space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                     :class="signalRConnected ? 'bg-emerald-500/10' : 'bg-amber-500/10'">
                  <svg class="w-4 h-4" :class="signalRConnected ? 'text-emerald-400' : 'text-amber-400'"
                       viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M1 6l5 5 3-3 7 7 3-3 4 4"/><path d="M21 3h-6M21 3v6"/>
                  </svg>
                </div>
                <div>
                  <h2 class="text-sm font-semibold text-gray-100">Connection</h2>
                  <p class="text-xs" :class="signalRConnected ? 'text-emerald-400' : 'text-amber-400'" x-text="connectionStatus"></p>

                <div class="ml-auto flex items-center gap-1.5">
                  <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-60"
                          :class="signalRConnected ? 'bg-emerald-400' : 'bg-amber-400'"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2"
                          :class="signalRConnected ? 'bg-emerald-400' : 'bg-amber-400'"></span>
                  </span>
                </div>
              </div>
              <div class="space-y-2 text-xs">
                <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-white/[0.02]">
                  <span class="text-gray-500">Transport</span>
                  <span class="font-medium" :class="signalRConnected ? 'text-emerald-400' : 'text-amber-400'"
                        x-text="signalRConnected ? 'SignalR (WebSocket)' : 'Polling fallback'"></span>
                </div>
                <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-white/[0.02]">
                  <span class="text-gray-500">Hub endpoint</span>
                  <code class="text-quartz-400 font-mono text-[10px] bg-quartz-500/10 px-1.5 py-0.5 rounded">/quartz/hub</code>
                </div>
                <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-white/[0.02]">
                  <span class="text-gray-500">API base</span>
                  <code class="text-quartz-400 font-mono text-[10px] bg-quartz-500/10 px-1.5 py-0.5 rounded">/quartz/api</code>
                </div>
                <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-white/[0.02]">
                  <span class="text-gray-500">Last refresh</span>
                  <span class="text-gray-300 font-mono text-[10px]" x-text="lastRefreshed ? formatDate(lastRefreshed) : '—'"></span>
                </div>
              </div>
            </div>

            <!-- About -->
            <div class="card-gradient space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gray-700/40 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

  <!-- ===================== FOOTER STATUS BAR ===================== -->
  <div class="footer-bar">
    <div class="flex items-center gap-4 w-full max-w-7xl mx-auto">
      <div class="flex items-center gap-1.5">
        <span class="relative inline-flex">
          <span :class="['status-dot w-2 h-2', scheduler.isStarted && !scheduler.isStandbyMode ? 'status-dot-running' : scheduler.isStandbyMode ? 'status-dot-standby' : 'status-dot-stopped']"></span>
        </span>
        <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'" class="font-medium text-gray-400"></span>
      </div>
      <span class="text-gray-600">|</span>
      <span><span class="text-gray-500">Jobs:</span> <span class="text-gray-400 font-medium" x-text="jobs.length"></span></span>
      <span class="text-gray-600 hidden sm:inline">|</span>
      <span class="hidden sm:inline"><span class="text-gray-500">Triggers:</span> <span class="text-gray-400 font-medium" x-text="triggers.length"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline"><span class="text-gray-500">Instance:</span> <span class="text-gray-400 mono" x-text="scheduler.instanceId ? scheduler.instanceId.slice(0, 20) : '\u2014'"></span></span>
      <span class="text-gray-600 hidden md:inline">|</span>
      <span class="hidden md:inline">
        <span :class="signalRConnected ? 'text-emerald-400' : signalRPolling ? 'text-amber-400' : 'text-gray-500'" x-text="connectionStatus"></span>
      </span>
      <span class="ml-auto text-gray-600">
        Last refreshed: <span class="text-gray-400" x-text="lastRefreshed ? formatDate(lastRefreshed) : '\u2014'"></span>
      </span>
    </div>
  </div>
