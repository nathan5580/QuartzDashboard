<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quartz Dashboard</title>
  <script>window.__QUARTZ_BASE = '__QUARTZ_BASE__';</script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="charts.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            quartz: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
            }
          },
          animation: {
            shimmer: 'shimmer 2s ease-in-out infinite',
            'pulse-dot': 'pulse-dot 2s ease-in-out infinite',
            'fade-in': 'fade-in 0.25s ease-out',
            'slide-up': 'slide-up 0.3s ease-out',
            'scale-in': 'scale-in 0.15s ease-out',
            'dot-pop': 'dot-pop 0.2s ease-out',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            'pulse-dot': { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.4' } },
            'fade-in': { from: { opacity: '0', transform: 'translateY(6px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            'slide-up': { from: { opacity: '0', transform: 'translateY(12px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            'scale-in': { from: { opacity: '0', transform: 'scale(0.97)' }, to: { opacity: '1', transform: 'scale(1)' } },
            'dot-pop': { from: { opacity: '0', transform: 'scale(0)' }, to: { opacity: '1', transform: 'scale(1)' } },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="bg-gray-950 text-gray-200 antialiased" x-data="dashboard()" x-init="init()">

  <!-- ChartEngine filters and gradients (static, both prefixes) -->
  <svg height="0" width="0" style="position:absolute">
    <defs>
      <linearGradient id="graphcountGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="graphdurationGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="grapherrorGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
      </linearGradient>
      <filter id="chartGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Toast queue -->
  <div class="fixed bottom-12 right-4 z-50 flex flex-col-reverse gap-2 pointer-events-none" style="z-index: 55;">
    <template x-for="(t, idx) in toastQueue.slice(0, 3)" :key="t.id">
      <div class="toast pointer-events-auto"
           :class="'toast-' + t.type"
           x-transition:enter.duration.150
           x-transition:leave.duration.150
           x-text="t.message">
      </div>
    </template>
  </div>

  <!-- Loading overlay -->
  <div x-show="loading.global" class="fixed inset-0 bg-gray-950/40 backdrop-blur-sm flex items-center justify-center z-40" style="display: none;">
    <div class="flex items-center gap-3 bg-gray-900/80 border border-white/5 rounded-xl px-5 py-3 shadow-2xl">
      <div class="spinner w-5 h-5"></div>
      <span class="text-sm text-gray-300">Processing...</span>
    </div>
  </div>

  <!-- ============ CREATE JOB MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showCreateJobModal" class="modal-overlay" @click.self="showCreateJobModal = false" style="display: none;">
      <div class="modal-card">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-base font-semibold text-gray-100">Create Job</h2>
          <button @click="showCreateJobModal = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="form-label">Name *</label>
            <input type="text" x-model="newJob.name" class="glass-input w-full" placeholder="MyJob">
          </div>
          <div>
            <label class="form-label">Group</label>
            <input type="text" x-model="newJob.group" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea x-model="newJob.description" rows="2" class="glass-textarea w-full" placeholder="Optional description"></textarea>
          </div>
          <div>
            <label class="form-label">Job Type (.NET type name)</label>
            <input type="text" x-model="newJob.jobType" class="glass-input w-full" placeholder="MyApp.Jobs.MyJob, MyApp">
          </div>
          <div class="flex items-center gap-6 pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.isDurable" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Durable</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.disallowConcurrentExecution" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Disallow Concurrent</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" x-model="newJob.persistJobDataAfterExecution" class="w-3.5 h-3.5 accent-quartz-500">
              <span class="text-xs text-gray-300">Persist Job Data</span>
            </label>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button @click="showCreateJobModal = false" class="btn btn-ghost">Cancel</button>
            <button @click="submitCreateJob()" :disabled="!newJob.name" class="btn btn-primary">Create Job</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ CREATE TRIGGER MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showCreateTriggerModal" class="modal-overlay" @click.self="showCreateTriggerModal = false" style="display: none;">
      <div class="modal-card">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-base font-semibold text-gray-100">Create Trigger</h2>
          <button @click="showCreateTriggerModal = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="form-label">Name *</label>
            <input type="text" x-model="newTrigger.name" class="glass-input w-full" placeholder="MyTrigger">
          </div>
          <div>
            <label class="form-label">Group</label>
            <input type="text" x-model="newTrigger.group" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Job Name *</label>
            <input type="text" x-model="newTrigger.jobName" class="glass-input w-full" placeholder="MyJob">
          </div>
          <div>
            <label class="form-label">Job Group</label>
            <input type="text" x-model="newTrigger.jobGroup" class="glass-input w-full" placeholder="DEFAULT">
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea x-model="newTrigger.description" rows="2" class="glass-textarea w-full" placeholder="Optional description"></textarea>
          </div>

          <!-- Trigger type tabs -->
          <div class="flex gap-2 border-b border-white/[0.06] pb-2">
            <button @click="newTrigger.triggerType = 'cron'"
                    :class="['btn text-xs', newTrigger.triggerType === 'cron' ? 'btn-primary' : 'btn-ghost']">Cron</button>
            <button @click="newTrigger.triggerType = 'simple'"
                    :class="['btn text-xs', newTrigger.triggerType === 'simple' ? 'btn-primary' : 'btn-ghost']">Simple</button>
          </div>

          <!-- Cron fields -->
          <template x-if="newTrigger.triggerType === 'cron'">
            <div>
              <label class="form-label">Cron Expression *</label>
              <input type="text" x-model="newTrigger.cronExpression" class="glass-input w-full" placeholder="0/5 * * * * ?">
            </div>
          </template>

          <!-- Simple fields -->
          <template x-if="newTrigger.triggerType === 'simple'">
            <div class="space-y-3">
              <div>
                <label class="form-label">Interval (seconds) *</label>
                <input type="number" x-model.number="newTrigger.intervalSeconds" class="glass-input w-full" placeholder="10" min="1">
              </div>
              <div>
                <label class="form-label">Repeat Count</label>
                <div class="flex items-center gap-2">
                  <input type="number" x-model.number="newTrigger.repeatCount" class="glass-input w-24" placeholder="0" min="-1">
                  <span class="text-xs text-gray-500">(-1 = infinite)</span>
                </div>
              </div>
            </div>
          </template>

          <div>
            <label class="form-label">Priority</label>
            <input type="number" x-model.number="newTrigger.priority" class="glass-input w-24" placeholder="5" min="0">
          </div>
          <div>
            <label class="form-label">Start Time</label>
            <input type="datetime-local" x-model="newTrigger.startTimeUtc" class="glass-input w-full">
          </div>
          <div>
            <label class="form-label">End Time (optional)</label>
            <input type="datetime-local" x-model="newTrigger.endTimeUtc" class="glass-input w-full">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button @click="showCreateTriggerModal = false" class="btn btn-ghost">Cancel</button>
            <button @click="submitCreateTrigger()" :disabled="!newTrigger.name || !newTrigger.jobName || (newTrigger.triggerType==='cron' && !newTrigger.cronExpression) || (newTrigger.triggerType==='simple' && !newTrigger.intervalSeconds)" class="btn btn-primary">Create Trigger</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ DELETE CONFIRMATION MODAL ============ -->
  <template x-teleport="body">
    <div x-show="showDeleteConfirm" class="modal-overlay" @click.self="showDeleteConfirm = false" style="display: none;">
      <div class="modal-card max-w-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-gray-100">Confirm Delete</h2>
          <button @click="showDeleteConfirm = false" class="btn-icon">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <p class="text-sm text-gray-300 mb-6" x-text="deleteConfirmMessage"></p>
        <div class="flex justify-end gap-2">
          <button @click="showDeleteConfirm = false" class="btn btn-ghost">Cancel</button>
          <button @click="executeDelete()" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ COMMAND PALETTE ============ -->
  <template x-teleport="body">
    <div x-show="showCommandPalette" class="command-palette-overlay" @click.self="showCommandPalette = false" style="display: none;">
      <div class="command-palette-card" @keydown.escape="showCommandPalette = false" @keydown.arrow-up.prevent="commandPalettePrev" @keydown.arrow-down.prevent="commandPaletteNext" @keydown.enter.prevent="commandPaletteSelect">
        <div class="flex items-center px-4 py-3 border-b border-white/[0.06]">
          <svg class="w-4 h-4 text-gray-500 mr-3 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" x-model="commandPaletteQuery" x-ref="commandPaletteInput"
                 placeholder="Search pages and actions..."
                 class="flex-1 bg-transparent border-none outline-none text-sm text-gray-200 placeholder-gray-500"
                 @keydown.escape.stop="showCommandPalette = false">
        </div>
        <div class="max-h-64 overflow-y-auto p-1" x-ref="commandPaletteList">
          <template x-for="(cmd, idx) in filteredCommands" :key="cmd.id">
            <div @click="executeCommand(cmd)"
                 :class="['command-item rounded-lg text-sm', commandPaletteIndex === idx ? 'active' : '']"
                 @mouseenter="commandPaletteIndex = idx">
              <div class="flex items-center gap-3">
                <span x-html="cmd.icon" class="w-4 h-4 text-gray-500 flex-shrink-0"></span>
                <span x-text="cmd.label" class="text-gray-200"></span>
              </div>
              <span class="text-[10px] text-gray-500 mono" x-text="cmd.shortcut || ''"></span>
            </div>
          </template>
          <div x-show="!filteredCommands.length" class="text-center py-6 text-sm text-gray-500">
            No matching commands
          </div>
        </div>
      </div>
    </div>
  </template>

  <div class="flex h-screen overflow-hidden" :style="'padding-bottom: 2rem'">
    <!-- ===================== SIDEBAR ===================== -->
    <aside :class="['sidebar-collapse flex flex-col flex-shrink-0 bg-gray-950 sidebar-border z-20', sidebarOpen ? 'w-60' : 'w-16']">
      <!-- Logo -->
      <div :class="['h-14 flex items-center border-b border-white/[0.04]', sidebarOpen ? 'gap-2.5 px-5' : 'justify-center px-2']">
        <div class="w-7 h-7 rounded-lg bg-quartz-500/10 flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-quartz-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <span x-show="sidebarOpen" class="font-semibold text-sm text-gray-100 whitespace-nowrap overflow-hidden">
          Quartz<span class="text-quartz-400">Dash</span>
          <span class="ml-1 text-[10px] text-gray-600 font-mono">v2.0</span>
        </span>
      </div>

      <!-- Nav items -->
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto scrollbar-thin mt-1">
        <template x-for="item in navItems" :key="item.id">
          <div @click="currentPage = item.id"
               :class="['sidebar-item', currentPage === item.id ? 'active' : '', sidebarOpen ? '' : 'justify-center px-0']"
               :title="!sidebarOpen ? item.label : ''">
            <span x-html="item.icon" class="w-5 h-5 flex-shrink-0"></span>
            <span x-show="sidebarOpen" x-text="item.label" class="overflow-hidden text-[13px]"></span>
          </div>
        </template>
      </nav>

      <!-- Bottom section: status + collapse -->
      <div class="p-3 border-t border-white/[0.04] space-y-2">
        <div x-show="sidebarOpen" class="flex items-center justify-between px-3 py-2 rounded-lg bg-white/[0.03]">
          <div class="flex items-center gap-2.5">
            <span class="relative inline-flex">
              <span :class="['status-dot', scheduler.isStarted && !scheduler.isStandbyMode ? 'status-dot-running' : scheduler.isStandbyMode ? 'status-dot-standby' : 'status-dot-stopped']"></span>
            </span>
            <span class="text-xs text-gray-400">
              <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'"></span>
            </span>
          </div>
          <span class="text-[10px] text-gray-600 font-mono" x-text="'v' + (scheduler.version || '?')"></span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen"
                class="w-full flex items-center justify-center py-1.5 rounded-lg hover:bg-white/[0.04] text-gray-500 hover:text-gray-300 transition-colors"
                :title="sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'">
          <svg class="w-4 h-4 transition-transform duration-250" :class="sidebarOpen ? '' : 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="flex-1 overflow-y-auto scrollbar-thin p-6 lg:p-8">
      <!-- ===================== OVERVIEW PAGE ===================== -->
      <template x-if="currentPage === 'overview'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-6">
            <!-- Header -->
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Scheduler Overview</h1>
                <p class="text-xs text-gray-500 mt-0.5">Real-time status and metrics</p>
              </div>
              <div class="flex gap-2">
                <button @click="startScheduler()" :disabled="!scheduler.isStandbyMode"
                        :class="['btn', scheduler.isStandbyMode ? 'btn-success' : 'btn-ghost']">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  <span>Start</span>
                </button>
                <button @click="standbyScheduler()" :disabled="scheduler.isStandbyMode || !scheduler.isStarted"
                        :class="['btn', !scheduler.isStandbyMode && scheduler.isStarted ? 'btn-warning' : 'btn-ghost']">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                  Standby
                </button>
                <button @click="refreshAll()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Stat cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Jobs</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="jobs.length"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Triggers</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="triggers.length"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Executing Now</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight">
                  <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                  <span x-show="!statsLoading" x-text="executingJobs.length" :class="executingJobs.length > 0 ? 'text-emerald-400' : 'text-gray-100'"></span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Total Executions</div>
                <div class="flex items-end gap-2">
                  <div class="text-3xl font-bold tabular-nums tracking-tight text-gray-100">
                    <template x-if="statsLoading"><div class="sk h-8 w-16"></div></template>
                    <span x-show="!statsLoading" x-text="scheduler.numberOfJobsExecuted || 0"></span>
                  </div>
                  <template x-if="statsTrend('totalExecutions') !== null && statsTrend('totalExecutions') !== 0">
                    <span :class="statsTrend('totalExecutions') > 0 ? 'text-emerald-400' : 'text-red-400'" class="text-xs font-semibold mb-1 flex items-center gap-0.5">
                      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <template x-if="statsTrend('totalExecutions') > 0"><polyline points="18 15 12 9 6 15"/></template>
                        <template x-if="statsTrend('totalExecutions') < 0"><polyline points="6 9 12 15 18 9"/></template>
                      </svg>
                      <span x-text="Math.abs(statsTrend('totalExecutions'))"></span>
                    </span>
                  </template>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'count', 80, 24)"
                              fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Scheduler info -->
            <div class="card-gradient">
              <h2 class="text-sm font-semibold text-gray-200 mb-4">Scheduler Details</h2>
              <div class="grid grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-4">
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Name</span>
                  <p class="text-sm text-gray-200 mt-0.5 font-medium" x-text="scheduler.name || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Instance ID</span>
                  <p class="text-sm text-gray-200 mt-0.5 mono" x-text="scheduler.instanceId || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Job Store</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.jobStoreType || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Thread Pool</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.threadPoolType || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Uptime</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="formatDuration(scheduler.upTime) || '\u2014'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Status</span>
                  <p class="text-sm mt-0.5">
                    <span :class="scheduler.isStandbyMode ? 'badge badge-paused' : (scheduler.isStarted ? 'badge badge-running' : 'badge badge-error')"
                          x-text="scheduler.isStandbyMode ? 'Standby' : (scheduler.isStarted ? 'Running' : 'Stopped')"></span>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="currentPage === 'health'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-6">
            <!-- Header -->
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Health</h1>
                <p class="text-xs text-gray-500 mt-0.5">Scheduler health check and diagnostics</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="flex items-center gap-1.5 text-xs text-gray-500">
                  <span :class="['status-dot', healthData?.status === 'healthy' ? 'status-dot-running' : 'status-dot-stopped']"></span>
                  <span x-text="healthData?.status || 'unknown'" class="capitalize"></span>
                </span>
                <button @click="loadHealth(); loadStats()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Stat cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Success Rate</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight"
                     :class="successRate >= 95 ? 'text-emerald-400' : successRate >= 80 ? 'text-amber-400' : 'text-red-400'">
                  <span x-text="successRate"></span><span class="text-lg">%</span>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'successRate', 80, 24)"
                              fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Failed Executions</div>
                <div class="flex items-end gap-2">
                  <div class="text-3xl font-bold tabular-nums tracking-tight"
                       :class="failedCount > 0 ? 'text-red-400' : 'text-gray-100'">
                    <span x-text="failedCount"></span>
                  </div>
                  <template x-if="statsTrend('errorRate') !== null && statsTrend('errorRate') !== 0">
                    <span :class="statsTrend('errorRate') > 0 ? 'text-red-400' : 'text-emerald-400'" class="text-xs font-semibold mb-1 flex items-center gap-0.5">
                      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <template x-if="statsTrend('errorRate') > 0"><polyline points="18 15 12 9 6 15"/></template>
                        <template x-if="statsTrend('errorRate') < 0"><polyline points="6 9 12 15 18 9"/></template>
                      </svg>
                    </span>
                  </template>
                </div>
                <div class="sparkline-container" x-show="executionBuckets.length">
                  <svg width="80" height="24" filter="url(#chartGlow)">
                    <polyline :points="ChartEngine.sparklinePolyline(executionBuckets, 'errorRate', 80, 24)"
                              fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Pool Utilization</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight"
                     :class="poolUtilization > 80 ? 'text-amber-400' : 'text-gray-100'">
                  <span x-text="poolUtilization.toFixed(0)"></span><span class="text-lg">%</span>
                </div>
                <div class="text-[10px] text-gray-600 mt-1">
                  <span x-text="executingJobs.length"></span> active / <span x-text="scheduler.threadPoolSize || 10"></span> threads
                </div>
              </div>
              <div class="stat-card">
                <div class="text-[11px] font-medium uppercase tracking-widest text-gray-500 mb-2">Misfired Triggers</div>
                <div class="text-3xl font-bold tabular-nums tracking-tight"
                     :class="misfiredCount > 0 ? 'text-red-400' : 'text-gray-100'">
                  <span x-text="misfiredCount"></span>
                </div>
              </div>
            </div>

            <!-- Scheduler Diagnostics -->
            <div class="card-gradient">
              <h2 class="text-sm font-semibold text-gray-200 mb-4">Scheduler Diagnostics</h2>
              <div class="grid grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-4">
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Status</span>
                  <p class="text-sm mt-0.5">
                    <span :class="scheduler.isStandbyMode ? 'badge badge-paused' : (scheduler.isStarted ? 'badge badge-running' : 'badge badge-error')"
                          x-text="scheduler.isStandbyMode ? 'Standby' : (scheduler.isStarted ? 'Running' : 'Stopped')"></span>
                  </p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Total Executions</span>
                  <p class="text-sm text-gray-200 mt-0.5 font-medium" x-text="scheduler.numberOfJobsExecuted || 0"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">History Records</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="history.length"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Thread Pool Size</span>
                  <p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.threadPoolSize || '—'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Job Store</span>
                  <p class="text-sm text-gray-200 mt-0.5 mono text-xs" x-text="scheduler.jobStoreType || '—'"></p>
                </div>
                <div>
                  <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500">Thread Pool</span>
                  <p class="text-sm text-gray-200 mt-0.5 mono text-xs" x-text="scheduler.threadPoolType || '—'"></p>
                </div>
              </div>
            </div>

            <!-- Failed Jobs List -->
            <template x-if="failedHistory.length > 0">
              <div class="card-gradient">
                <h2 class="text-sm font-semibold text-gray-200 mb-3">Recent Failures</h2>
                <div class="space-y-2 max-h-64 overflow-y-auto scrollbar-thin">
                  <template x-for="h in failedHistory.slice(0, 20)" :key="h.fireInstanceId || $index">
                    <div class="flex items-center justify-between py-2 px-3 rounded-lg bg-red-500/5 border border-red-500/10">
                      <div class="flex-1 min-w-0">
                        <p class="text-sm text-gray-200 truncate" x-text="h.jobKey || 'Unknown'"></p>
                        <p class="text-xs text-gray-500" x-text="formatDate(h.fireTime)"></p>
                      </div>
                      <span class="badge badge-error text-[10px]">Failed</span>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- All clear -->
            <template x-if="failedHistory.length === 0 && history.length > 0">
              <div class="card-gradient flex items-center gap-3 py-6">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div>
                  <p class="text-sm text-gray-200 font-medium">All Clear</p>
                  <p class="text-xs text-gray-500">No execution failures recorded in recent history.</p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>


      <!-- ===================== JOBS PAGE ===================== -->
      <template x-if="currentPage === 'jobs'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <!-- Header -->
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Jobs</h1>
                <p class="text-xs text-gray-500 mt-0.5"><span x-text="filteredJobs.length"></span> of <span x-text="jobs.length"></span> jobs — click a row to inspect</p>
              </div>
              <div class="flex items-center gap-2">
                <div class="relative">
                  <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input type="text" x-model="jobsFilter" placeholder="Search jobs..." class="glass-input pl-8 w-52 text-xs">
                  <button x-show="jobsFilter" @click="jobsFilter = ''" class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-500 hover:text-gray-300 transition-colors" style="display: none;">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
                <button @click="showCreateJobModal = true" class="btn btn-primary" x-show="!config.readOnly">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  New Job
                </button>
                <button @click="loadJobs()" class="btn btn-ghost" title="Refresh">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.jobs">
              <div class="space-y-px">
                <template x-for="i in 5" :key="i">
                  <div class="card-gradient flex items-center gap-4 py-3.5 px-4">
                    <div class="sk h-2 w-2 rounded-full flex-shrink-0"></div>
                    <div class="flex-1 space-y-1.5">
                      <div class="sk h-3.5 w-1/3"></div>
                      <div class="sk h-2.5 w-1/5"></div>
                    </div>
                    <div class="sk h-5 w-16 rounded-full hidden sm:block"></div>
                    <div class="sk h-3 w-20 hidden md:block"></div>
                    <div class="flex gap-1">
                      <div class="sk h-7 w-7 rounded"></div>
                      <div class="sk h-7 w-7 rounded"></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Jobs table -->
            <template x-if="!loading.jobs">
              <div>
                <template x-if="filteredJobs.length">
                  <div class="rounded-xl border border-white/[0.06] overflow-hidden">
                    <table class="w-full text-sm mobile-card-table">
                      <thead>
                        <tr class="border-b border-white/[0.06] bg-white/[0.02]">
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500 w-4"></th>
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500">Job</th>
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500 hidden md:table-cell">Group</th>
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500 hidden sm:table-cell">Status</th>
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500 hidden lg:table-cell">Triggers</th>
                          <th class="py-2.5 px-4 text-left text-[10px] font-semibold uppercase tracking-widest text-gray-500">Next Fire</th>
                          <th class="py-2.5 px-4 text-right text-[10px] font-semibold uppercase tracking-widest text-gray-500">Actions</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-white/[0.04]">
                        <template x-for="item in jobRows" :key="item.key">
                          <tr :class="[
                                item.isHeader
                                  ? 'cursor-pointer hover:bg-white/[0.02] bg-white/[0.015]'
                                  : 'group cursor-pointer hover:bg-white/[0.025] transition-colors duration-100',
                                !item.isHeader && item.job && jobDrawerData && jobDrawerData.group === item.job.group && jobDrawerData.name === item.job.name ? 'bg-indigo-500/[0.06] border-l-2 border-l-indigo-500' : '',
                                !item.isHeader && item.job && jobFlash[item.job.group + '.' + item.job.name] === 'success' ? 'ring-1 ring-inset ring-emerald-400/40 bg-emerald-400/5' : '',
                                !item.isHeader && item.job && jobFlash[item.job.group + '.' + item.job.name] === 'error' ? 'ring-1 ring-inset ring-red-400/40 bg-red-400/5' : ''
                              ]"
                               @click="item.isHeader
                                 ? (collapsedGroups = { ...collapsedGroups, [item.groupName]: !collapsedGroups[item.groupName] }, saveSettings())
                                 : (openJobDrawer(item.job), selectedJobIndex = filteredJobs.indexOf(item.job))">

                            <!-- ── HEADER cells (group row) ── -->
                            <td x-show="item.isHeader" colspan="7" class="py-2 px-4">
                              <div class="flex items-center gap-2">
                                <svg class="w-3.5 h-3.5 text-gray-500 transition-transform duration-150 flex-shrink-0"
                                     :class="item.isCollapsed ? '' : 'rotate-90'"
                                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                  <polyline points="9 18 15 12 9 6"/>
                                </svg>
                                <span class="text-xs font-semibold text-gray-400 mono" x-text="item.groupName"></span>
                                <span class="text-[10px] bg-white/[0.06] text-gray-500 px-1.5 py-0.5 rounded-full"
                                      x-text="item.count + ' job' + (item.count !== 1 ? 's' : '')"></span>
                              </div>
                            </td>

                            <!-- ── JOB cells ── -->
                            <!-- Status dot -->
                            <td x-show="!item.isHeader" class="py-3.5 pl-4 pr-1 w-4" data-label="">
                              <span class="block w-2 h-2 rounded-full flex-shrink-0"
                                    :class="item.job && item.job.status === 'Executing' ? 'bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.8)]' : item.job && item.job.status === 'Paused' ? 'bg-amber-400' : item.job && item.job.status === 'Scheduled' ? 'bg-indigo-400' : 'bg-gray-600'">
                              </span>
                            </td>
                            <!-- Name + description -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4" data-label="Job">
                              <div class="font-medium text-gray-100 leading-tight" x-text="item.job && item.job.name"></div>
                              <div class="text-[11px] text-gray-500 mt-0.5 truncate max-w-[200px]"
                                   x-text="item.job && (item.job.description || item.job.jobType || item.job.group)"></div>
                            </td>
                            <!-- Group -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4 hidden md:table-cell" data-label="Group">
                              <span class="mono text-[11px] text-gray-500 bg-white/[0.04] px-1.5 py-0.5 rounded"
                                    x-text="item.job && item.job.group"></span>
                            </td>
                            <!-- Status badge -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4 hidden sm:table-cell" data-label="Status">
                              <span :class="item.job && jobStatusBadge(item.job.status)"
                                    x-text="item.job && (item.job.status || 'Idle')"></span>
                            </td>
                            <!-- Trigger count -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4 hidden lg:table-cell" data-label="Triggers">
                              <span class="text-[11px] text-gray-400"
                                    x-text="item.job && ((item.job.triggers || []).length + ' trigger' + ((item.job.triggers || []).length !== 1 ? 's' : ''))"></span>
                            </td>
                            <!-- Next fire with live countdown -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4" data-label="Next Fire">
                              <span class="text-xs mono"
                                    :class="item.job && item.job.nextFireTime ? 'text-gray-300' : 'text-gray-600'"
                                    :title="item.job && item.job.nextFireTime ? formatDate(item.job.nextFireTime) : ''"
                                    x-text="item.job && formatCountdown(item.job.nextFireTime)"></span>
                            </td>
                            <!-- Actions -->
                            <td x-show="!item.isHeader" class="py-3.5 px-4 text-right" data-label="Actions">
                              <div class="flex gap-1 justify-end opacity-0 group-hover:opacity-100 transition-opacity" @click.stop>
                                <button @click="item.job && triggerJob(item.job.group, item.job.name)" class="btn btn-primary p-1.5" title="Run Now">
                                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                </button>
                                <button x-show="item.job && item.job.status !== 'Paused'" @click="item.job && pauseJob(item.job.group, item.job.name)" class="btn btn-warning p-1.5" title="Pause">
                                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                </button>
                                <button x-show="item.job && item.job.status === 'Paused'" @click="item.job && resumeJob(item.job.group, item.job.name)" class="btn btn-success p-1.5" title="Resume">
                                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                                </button>
                                <button x-show="!config.readOnly" @click="item.job && deleteJob(item.job.group, item.job.name)" class="btn btn-danger p-1.5" title="Delete">
                                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                                </button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <!-- Empty: no match -->
                <div x-show="!filteredJobs.length && jobs.length > 0" class="card-gradient text-center py-10">
                  <svg class="w-10 h-10 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <p class="text-sm text-gray-500">No jobs match <span class="text-gray-400 font-medium" x-text="'\u2018' + jobsFilter + '\u2019'"></span></p>
                  <button @click="jobsFilter = ''" class="btn btn-ghost mt-2 text-xs">Clear filter</button>
                </div>
                <!-- Empty: no jobs -->
                <template x-if="!jobs.length">
                  <div class="flex flex-col items-center justify-center py-16 text-center card-gradient">
                    <div class="text-4xl mb-3 opacity-30">⚙️</div>
                    <div class="text-sm font-medium text-gray-400">No jobs registered</div>
                    <div class="text-xs text-gray-600 mt-1">Jobs are registered by your Quartz scheduler automatically</div>
                    <button @click="showCreateJobModal = true" class="btn btn-primary mt-4 text-xs" x-show="!config.readOnly">+ New Job</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ============ JOB DETAIL DRAWER ============ -->
      <template x-teleport="body">
        <div x-show="showJobDrawer" style="display:none;">
          <!-- Backdrop -->
          <div
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="closeJobDrawer()"
             @keydown.escape.window="closeJobDrawer()"
             class="fixed inset-0 bg-gray-950/60 backdrop-blur-[2px] z-40">
          </div>
          <!-- Drawer panel -->
          <div
             x-transition:enter="transition ease-out duration-250"
             x-transition:enter-start="opacity-0 translate-x-8"
             x-transition:enter-end="opacity-100 translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-x-0"
             x-transition:leave-end="opacity-0 translate-x-8"
             class="fixed right-0 top-0 h-full w-full max-w-lg bg-gray-900 border-l border-white/[0.08] shadow-2xl z-50 flex flex-col"
             @keydown.escape.window="closeJobDrawer()">

          <template x-if="jobDrawerData">
            <div class="flex flex-col h-full">

              <!-- Drawer header -->
              <div class="flex-shrink-0 px-5 pt-5 pb-4 border-b border-white/[0.07]">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2.5 flex-wrap">
                      <!-- Status dot -->
                      <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 mt-0.5"
                            :class="jobDrawerData.status === 'Executing' ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.9)]' : jobDrawerData.status === 'Paused' ? 'bg-amber-400' : 'bg-indigo-400'">
                      </span>
                      <h2 class="text-base font-semibold text-gray-100 truncate" x-text="jobDrawerData.name"></h2>
                      <span :class="jobStatusBadge(jobDrawerData.status)" x-text="jobDrawerData.status || 'Idle'"></span>
                    </div>
                    <p class="text-xs text-gray-500 mt-1.5 flex items-center gap-2">
                      <span class="mono bg-white/[0.05] px-1.5 py-0.5 rounded text-gray-400" x-text="jobDrawerData.group"></span>
                      <span x-show="jobDrawerData.jobType" class="mono text-gray-600 truncate max-w-[220px]" x-text="jobDrawerData.jobType"></span>
                    </p>
                  </div>
                  <button @click="closeJobDrawer()" class="btn-icon text-gray-500 hover:text-gray-200 flex-shrink-0 mt-0.5">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>

                <!-- Quick action bar -->
                <div class="flex items-center gap-2 mt-3.5">
                  <button @click="triggerJobFromDrawer()" class="btn btn-primary flex-1 text-xs justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Run Now
                  </button>
                  <button x-show="jobDrawerData.status !== 'Paused'" @click="pauseJobFromDrawer()" class="btn btn-warning flex-1 text-xs justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    Pause
                  </button>
                  <button x-show="jobDrawerData.status === 'Paused'" @click="resumeJobFromDrawer()" class="btn btn-success flex-1 text-xs justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Resume
                  </button>
                  <button @click="copyJobJson()" class="btn btn-ghost p-2" title="Copy JSON">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                  </button>
                  <button x-show="!config.readOnly" @click="deleteJob(jobDrawerData.group, jobDrawerData.name); closeJobDrawer()" class="btn btn-danger p-2" title="Delete Job">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                  </button>
                </div>

                <!-- Tabs -->
                <div class="flex gap-0 mt-4 border-b border-white/[0.07] -mb-4">
                  <button @click="jobDrawerTab = 'overview'"
                          :class="jobDrawerTab === 'overview' ? 'text-indigo-400 border-b-2 border-indigo-400' : 'text-gray-500 hover:text-gray-300 border-b-2 border-transparent'"
                          class="text-xs font-medium px-4 pb-3 transition-colors">Overview</button>
                  <button @click="jobDrawerTab = 'triggers'"
                          :class="jobDrawerTab === 'triggers' ? 'text-indigo-400 border-b-2 border-indigo-400' : 'text-gray-500 hover:text-gray-300 border-b-2 border-transparent'"
                          class="text-xs font-medium px-4 pb-3 transition-colors">
                    Triggers
                    <span class="ml-1 text-[10px] bg-white/[0.08] px-1.5 py-0.5 rounded-full" x-text="(jobDrawerData.triggers || []).length"></span>
                  </button>
                  <button @click="jobDrawerTab = 'history'; loadJobDrawerHistory(jobDrawerData.group, jobDrawerData.name)"
                          :class="jobDrawerTab === 'history' ? 'text-indigo-400 border-b-2 border-indigo-400' : 'text-gray-500 hover:text-gray-300 border-b-2 border-transparent'"
                          class="text-xs font-medium px-4 pb-3 transition-colors">History</button>
                </div>
              </div>

              <!-- Drawer body -->
              <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4 scrollbar-thin">

                <!-- ---- OVERVIEW TAB ---- -->
                <template x-if="jobDrawerTab === 'overview'">
                  <div class="space-y-4">
                    <!-- Description -->
                    <div x-show="jobDrawerData.description" class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3">
                      <p class="text-xs text-gray-400 italic" x-text="jobDrawerData.description"></p>
                    </div>

                    <!-- Key stats row -->
                    <div class="grid grid-cols-2 gap-3">
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Next Fire</div>
                        <div class="text-sm font-medium" :class="jobDrawerNextFire ? 'text-gray-200' : 'text-gray-600'"
                             x-text="jobDrawerNextFire ? 'in ' + relativeTime(jobDrawerNextFire) : 'Not scheduled'"></div>
                      </div>
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Last Fire</div>
                        <div class="text-sm font-medium text-gray-400"
                             x-text="(jobDrawerTriggers.find(t => t.lastFireTime) || {}).lastFireTime ? relativeTime((jobDrawerTriggers.find(t => t.lastFireTime) || {}).lastFireTime) + ' ago' : '—'"></div>
                      </div>
                    </div>

                    <!-- Flags -->
                    <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3 space-y-2.5">
                      <div class="text-[10px] text-gray-500 uppercase tracking-wider">Flags</div>
                      <div class="grid grid-cols-2 gap-y-2">
                        <div class="flex items-center gap-2">
                          <span :class="jobDrawerData.isDurable ? 'bg-indigo-500/20 text-indigo-400' : 'bg-white/[0.04] text-gray-600'"
                                class="w-4 h-4 rounded flex items-center justify-center flex-shrink-0">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                              <template x-if="jobDrawerData.isDurable"><polyline points="20 6 9 17 4 12"/></template>
                              <template x-if="!jobDrawerData.isDurable"><line x1="18" y1="6" x2="6" y2="18"/></template>
                            </svg>
                          </span>
                          <span class="text-xs" :class="jobDrawerData.isDurable ? 'text-gray-300' : 'text-gray-600'">Durable</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <span :class="jobDrawerData.concurrentExecutionDisallowed ? 'bg-amber-500/20 text-amber-400' : 'bg-white/[0.04] text-gray-600'"
                                class="w-4 h-4 rounded flex items-center justify-center flex-shrink-0">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                              <template x-if="jobDrawerData.concurrentExecutionDisallowed"><polyline points="20 6 9 17 4 12"/></template>
                              <template x-if="!jobDrawerData.concurrentExecutionDisallowed"><line x1="18" y1="6" x2="6" y2="18"/></template>
                            </svg>
                          </span>
                          <span class="text-xs" :class="jobDrawerData.concurrentExecutionDisallowed ? 'text-gray-300' : 'text-gray-600'">No Concurrency</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <span :class="jobDrawerData.persistJobDataAfterExecution ? 'bg-emerald-500/20 text-emerald-400' : 'bg-white/[0.04] text-gray-600'"
                                class="w-4 h-4 rounded flex items-center justify-center flex-shrink-0">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                              <template x-if="jobDrawerData.persistJobDataAfterExecution"><polyline points="20 6 9 17 4 12"/></template>
                              <template x-if="!jobDrawerData.persistJobDataAfterExecution"><line x1="18" y1="6" x2="6" y2="18"/></template>
                            </svg>
                          </span>
                          <span class="text-xs" :class="jobDrawerData.persistJobDataAfterExecution ? 'text-gray-300' : 'text-gray-600'">Persist Data</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <span :class="jobDrawerData.requestsRecovery ? 'bg-blue-500/20 text-blue-400' : 'bg-white/[0.04] text-gray-600'"
                                class="w-4 h-4 rounded flex items-center justify-center flex-shrink-0">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                              <template x-if="jobDrawerData.requestsRecovery"><polyline points="20 6 9 17 4 12"/></template>
                              <template x-if="!jobDrawerData.requestsRecovery"><line x1="18" y1="6" x2="6" y2="18"/></template>
                            </svg>
                          </span>
                          <span class="text-xs" :class="jobDrawerData.requestsRecovery ? 'text-gray-300' : 'text-gray-600'">Recovery</span>
                        </div>
                      </div>
                    </div>

                    <!-- Job type -->
                    <template x-if="jobDrawerData.jobType">
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1.5">Job Type</div>
                        <code class="text-[11px] text-indigo-300 font-mono break-all" x-text="jobDrawerData.jobType"></code>
                      </div>
                    </template>

                    <!-- Job data map -->
                    <template x-if="jobDrawerData.jobDataMap && Object.keys(jobDrawerData.jobDataMap).length">
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] px-4 py-3">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-2.5">Job Data</div>
                        <dl class="space-y-1.5">
                          <template x-for="[k, v] in Object.entries(jobDrawerData.jobDataMap)" :key="k">
                            <div class="flex gap-3 text-xs">
                              <dt class="mono text-gray-500 flex-shrink-0" x-text="k + ':'"></dt>
                              <dd class="mono text-gray-300 break-all" x-text="typeof v === 'object' ? JSON.stringify(v) : v"></dd>
                            </div>
                          </template>
                        </dl>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- ---- TRIGGERS TAB ---- -->
                <template x-if="jobDrawerTab === 'triggers'">
                  <div class="space-y-3">
                    <template x-if="jobDrawerTriggers.length">
                      <div class="space-y-2">
                        <template x-for="t in jobDrawerTriggers" :key="t.group + '.' + t.name">
                          <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] p-4">
                            <div class="flex items-start justify-between gap-3">
                              <div class="min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span class="font-medium text-sm text-gray-200" x-text="t.name"></span>
                                  <span :class="'badge text-[9px] ' + (t.state === 'Normal' ? 'badge-normal' : t.state === 'Paused' ? 'badge-paused' : 'badge-idle')"
                                        x-text="t.state"></span>
                                  <span class="mono text-[10px] text-gray-600 bg-white/[0.04] px-1.5 py-0.5 rounded" x-text="t.group"></span>
                                </div>
                                <div class="mt-2 space-y-1">
                                  <div class="flex items-center gap-2 text-xs">
                                    <span class="text-gray-500 w-20 flex-shrink-0">Schedule</span>
                                    <span class="mono text-gray-300" x-text="t.scheduleDescription || t.cronExpression || '—'"></span>
                                  </div>
                                  <div class="flex items-center gap-2 text-xs">
                                    <span class="text-gray-500 w-20 flex-shrink-0">Type</span>
                                    <span class="mono text-gray-400" x-text="t.type || '—'"></span>
                                  </div>
                                  <div class="flex items-center gap-2 text-xs">
                                    <span class="text-gray-500 w-20 flex-shrink-0">Last fire</span>
                                    <span class="mono" :class="t.lastFireTime ? 'text-gray-300' : 'text-gray-600'"
                                          x-text="t.lastFireTime ? relativeTime(t.lastFireTime) + ' ago' : 'Never'"></span>
                                  </div>
                                  <div class="flex items-center gap-2 text-xs">
                                    <span class="text-gray-500 w-20 flex-shrink-0">Next fire</span>
                                    <span class="mono" :class="t.nextFireTime ? 'text-indigo-400' : 'text-gray-600'"
                                          x-text="t.nextFireTime ? 'in ' + relativeTime(t.nextFireTime) : 'Not scheduled'"></span>
                                  </div>
                                  <template x-if="t.priority !== undefined && t.priority !== 5">
                                    <div class="flex items-center gap-2 text-xs">
                                      <span class="text-gray-500 w-20 flex-shrink-0">Priority</span>
                                      <span class="mono text-gray-400" x-text="t.priority"></span>
                                    </div>
                                  </template>
                                </div>
                              </div>
                              <div class="flex flex-col gap-1.5 flex-shrink-0">
                                <button x-show="t.state !== 'Paused'" @click="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2.5 py-1">Pause</button>
                                <button x-show="t.state === 'Paused'" @click="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2.5 py-1">Resume</button>
                                <button @click="deleteJobTrigger(jobDrawerData.group, jobDrawerData.name, t.group, t.name)" class="btn btn-danger text-[10px] px-2.5 py-1">Delete</button>
                              </div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!jobDrawerTriggers.length">
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] py-10 text-center">
                        <svg class="w-8 h-8 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <p class="text-sm text-gray-500">No triggers</p>
                        <p class="text-xs text-gray-600 mt-1">This job runs on demand only</p>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- ---- HISTORY TAB ---- -->
                <template x-if="jobDrawerTab === 'history'">
                  <div>
                    <template x-if="jobDrawerHistoryLoading">
                      <div class="space-y-2">
                        <template x-for="i in 5" :key="i">
                          <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] flex items-center gap-3 px-4 py-3">
                            <div class="sk w-2 h-2 rounded-full flex-shrink-0"></div>
                            <div class="flex-1 space-y-1.5">
                              <div class="sk h-3 w-2/3"></div>
                              <div class="sk h-2.5 w-1/3"></div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!jobDrawerHistoryLoading && jobDrawerHistory.length">
                      <div class="space-y-1.5">
                        <template x-for="(h, idx) in jobDrawerHistory" :key="idx">
                          <div class="rounded-lg bg-white/[0.03] border flex items-center gap-3 px-4 py-2.5 text-xs"
                               :class="h.success === false ? 'border-red-500/20' : 'border-white/[0.06]'">
                            <span class="w-2 h-2 rounded-full flex-shrink-0"
                                  :class="h.success === false ? 'bg-red-400' : 'bg-emerald-400'"></span>
                            <div class="flex-1 min-w-0">
                              <div class="flex items-center gap-2 flex-wrap">
                                <span class="mono text-gray-400" x-text="h.fireTime ? new Date(h.fireTime).toLocaleTimeString() : '—'"></span>
                                <span x-show="h.runTimeMs" class="text-gray-500" x-text="h.runTimeMs + 'ms'"></span>
                                <span x-show="h.success === false" class="text-red-400">Failed</span>
                              </div>
                              <div x-show="h.errorMessage" class="text-red-400 text-[11px] truncate mt-0.5" x-text="h.errorMessage"></div>
                            </div>
                            <span class="text-gray-600 flex-shrink-0" x-text="h.fireTime ? relativeTime(h.fireTime) + ' ago' : ''"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!jobDrawerHistoryLoading && !jobDrawerHistory.length">
                      <div class="rounded-lg bg-white/[0.03] border border-white/[0.06] py-10 text-center">
                        <svg class="w-8 h-8 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 0 .5-3M3 4v4h4"/></svg>
                        <p class="text-sm text-gray-500">No history yet</p>
                        <p class="text-xs text-gray-600 mt-1">Executions will appear here after the job runs</p>
                      </div>
                    </template>
                  </div>
                </template>

              </div>
            </div>
          </template>
        </div>
        </div>
      </template>

      <!-- ===================== TRIGGERS PAGE ===================== -->
      <template x-if="currentPage === 'triggers'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Triggers</h1>
                <p class="text-xs text-gray-500 mt-0.5">Grouped by job</p>
              </div>
              <div class="flex items-center gap-2">
                <button @click="showCreateTriggerModal = true" class="btn btn-primary">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Create Trigger
                </button>
                <button @click="loadTriggers()" class="btn btn-ghost">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                  Refresh
                </button>
              </div>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.triggers">
              <div class="space-y-3">
                <template x-for="i in 6" :key="i">
                  <div class="card-gradient p-4 space-y-3">
                    <div class="flex items-center gap-2">
                      <div class="sk h-4 w-4 rounded"></div>
                      <div class="sk h-4 w-1/4"></div>
                      <div class="sk h-5 w-20 rounded-full"></div>
                    </div>
                    <div class="sk h-8 w-full rounded ml-6"></div>
                    <div class="sk h-8 w-full rounded ml-6"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Triggers -->
            <template x-if="!loading.triggers">
              <div class="space-y-2">
                <template x-for="(group, gIdx) in groupedTriggers" :key="gIdx">
                  <div class="card-gradient p-0 overflow-hidden">
                    <div @click="toggleTriggerGroup(gIdx)" class="flex items-center gap-2 px-5 py-3 cursor-pointer hover:bg-white/[0.02] transition-colors">
                      <svg class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform duration-200"
                           :class="expandedTriggerGroups[gIdx] ? 'rotate-90' : ''"
                           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                      </svg>
                      <span class="text-sm font-medium text-gray-200" x-text="group.jobName"></span>
                      <span class="badge badge-idle text-[10px]" x-text="group.triggers.length + ' trigger' + (group.triggers.length !== 1 ? 's' : '')"></span>
                    </div>
                    <div x-show="expandedTriggerGroups[gIdx]" class="accordion-enter">
                      <div class="table-wrap rounded-none border-0 border-t border-white/[0.04]">
                        <table>
                          <thead>
                            <tr>
                              <th>Trigger</th>
                              <th class="hidden sm:table-cell">Type</th>
                              <th>State</th>
                              <th class="hidden md:table-cell">Schedule</th>
                              <th class="hidden md:table-cell">Last Fire</th>
                              <th>Next Fire</th>
                              <th class="text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="t in group.triggers" :key="t.group + '.' + t.name">
                              <tr>
                                <td class="font-medium text-gray-100 text-xs" x-text="t.name"></td>
                                <td class="hidden sm:table-cell"><span class="mono text-xs text-gray-400" x-text="t.type"></span></td>
                                <td>
                                  <span :class="'badge ' + (t.state === 'Normal' ? 'badge-normal' : t.state === 'Paused' ? 'badge-paused' : 'badge-idle')" x-text="t.state"></span>
                                </td>
                                <td class="hidden md:table-cell text-xs text-gray-400" x-text="t.scheduleDescription || '\u2014'"></td>
                                <td class="hidden md:table-cell text-xs mono text-gray-500" x-text="t.lastFireTime ? relativeTime(t.lastFireTime) + ' ago' : '\u2014'"></td>
                                <td class="text-xs mono text-gray-400">
                                  <span :title="t.nextFireTime ? formatDate(t.nextFireTime) : ''" x-text="formatCountdown(t.nextFireTime)"></span>
                                </td>
                                <td class="text-right">
                                  <div class="flex gap-1 justify-end">
                                    <button x-show="t.state !== 'Paused'" @click.stop="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2 py-1">Pause</button>
                                    <button x-show="t.state === 'Paused'" @click.stop="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2 py-1">Resume</button>
                                    <button @click.stop="deleteTrigger(t.group, t.name)" class="btn btn-danger text-[10px] px-2 py-1">Delete</button>
                                  </div>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>
                <div x-show="!groupedTriggers.length" class="card-gradient text-center py-12">
                  <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                  </svg>
                  <p class="text-sm text-gray-400 mb-1">No triggers configured yet</p>
                  <p class="text-xs text-gray-500">Create a trigger to schedule job execution</p>
                  <button @click="showCreateTriggerModal = true" class="btn btn-primary mt-4 text-xs" x-show="!config.readOnly">Create Trigger</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ===================== EXECUTING PAGE ===================== -->
      <template x-if="currentPage === 'executing'">
        <div x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-gray-100">Executing Jobs</h1>
                <p class="text-xs text-gray-500 mt-0.5">Currently running jobs in real-time</p>
              </div>
              <button @click="loadExecutingJobs()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
              </button>
            </div>

            <!-- Loading skeleton -->
            <template x-if="loading.executing">
