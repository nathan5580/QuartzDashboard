<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quartz Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            quartz: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .animate-fade { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sidebar-item { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 cursor-pointer whitespace-nowrap; }
    .sidebar-item:hover { @apply bg-white/5 text-white; }
    .sidebar-item.active { @apply bg-quartz-600/20 text-quartz-300 ring-1 ring-quartz-500/30; }
    .btn { @apply inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 cursor-pointer select-none; }
    .btn-primary { @apply bg-quartz-600 hover:bg-quartz-500 text-white; }
    .btn-danger { @apply bg-red-600/80 hover:bg-red-600 text-red-100; }
    .btn-warning { @apply bg-amber-600/80 hover:bg-amber-600 text-amber-100; }
    .btn-success { @apply bg-emerald-600/80 hover:bg-emerald-600 text-emerald-100; }
    .btn-ghost { @apply bg-white/5 hover:bg-white/10 text-gray-300; }
    .card { @apply bg-gray-800/40 backdrop-blur-xl rounded-xl border border-white/5 p-5; }
    .stat-card { @apply bg-gray-800/40 backdrop-blur-xl rounded-xl border border-white/5 p-4 relative overflow-hidden; }
    .badge { @apply inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium; }
    .badge-active { @apply bg-emerald-500/20 text-emerald-300 ring-1 ring-emerald-500/30; }
    .badge-paused { @apply bg-amber-500/20 text-amber-300 ring-1 ring-amber-500/30; }
    .badge-error { @apply bg-red-500/20 text-red-300 ring-1 ring-red-500/30; }
    .badge-normal { @apply bg-blue-500/20 text-blue-300 ring-1 ring-blue-500/30; }
    .badge-info { @apply bg-gray-500/20 text-gray-300 ring-1 ring-gray-500/30; }
    .badge-idle { @apply bg-gray-500/20 text-gray-300 ring-1 ring-gray-500/30; }
    .table-header { @apply px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider; }
    .table-cell { @apply px-4 py-3 text-sm text-gray-300; }
    .table-row { @apply border-b border-white/5 transition-colors cursor-pointer; }
    .table-row:hover { @apply bg-white/[0.03]; }
    .toast { @apply fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl z-50 animate-fade; }
    .toast-success { @apply bg-emerald-600 text-emerald-50; }
    .toast-error { @apply bg-red-600 text-red-50; }
    .toast-info { @apply bg-blue-600 text-blue-50; }
    .loading-spinner { @apply inline-block w-4 h-4 border-2 border-gray-500 border-t-quartz-400 rounded-full; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton { @apply bg-gray-700/40 rounded animate-pulse; }
    .sidebar-collapsed-text { @apply overflow-hidden; }
    .sidebar-transition { transition: width 300ms ease, padding 300ms ease; }
    .expandable-content { transition: max-height 0.3s ease, opacity 0.3s ease; }
    .duration-bar { transition: width 0.5s ease; }
    .highlight-new { animation: highlightFade 2s ease-out; }
    @keyframes highlightFade { 0% { background-color: rgba(99, 102, 241, 0.15); } 100% { background-color: transparent; } }
    .sparkline-container { position: absolute; bottom: 0; right: 0; opacity: 0.15; pointer-events: none; }
    .graph-tooltip { @apply absolute bg-gray-900/90 backdrop-blur-md border border-white/10 rounded-lg px-3 py-2 text-xs pointer-events-none z-10; transform: translate(-50%, -100%); }
    .accordion-enter { animation: accordionSlide 0.25s ease-out; }
    @keyframes accordionSlide { from { max-height: 0; opacity: 0; } to { max-height: 500px; opacity: 1; } }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: #374151; border-radius: 2px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #6366f1; cursor: pointer; border: 2px solid #1e1b4b; }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #6366f1; cursor: pointer; border: 2px solid #1e1b4b; }
    .glass-input { @apply bg-gray-800/60 border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-quartz-500/40 focus:border-quartz-500/50; }
    .group-header { @apply flex items-center gap-2 px-4 py-2.5 rounded-lg cursor-pointer hover:bg-white/[0.03] transition-colors text-sm font-medium text-gray-200; }
    .job-border-idle { border-left: 3px solid #10b981; }
    .job-border-triggers { border-left: 3px solid #6366f1; }
    .job-border-paused { border-left: 3px solid #f59e0b; }
  </style>
</head>
<body class="bg-gray-900 text-gray-200 antialiased" x-data="dashboard()" x-init="init()">
  <!-- Toast -->
  <template x-teleport="body">
    <div x-show="toast.show" x-text="toast.message"
         :class="'toast toast-' + toast.type" x-transition.duration.200ms style="display: none;">
    </div>
  </template>

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside :class="['sidebar-transition flex flex-col flex-shrink-0 bg-gray-950/80 border-r border-gray-800',
                     sidebarOpen ? 'w-60' : 'w-16']">
      <!-- Logo -->
      <div :class="['h-14 flex items-center border-b border-gray-800/50', sidebarOpen ? 'gap-2.5 px-5' : 'justify-center px-2']">
        <svg class="w-5 h-5 text-quartz-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span x-show="sidebarOpen" class="font-semibold text-sm text-gray-100 whitespace-nowrap overflow-hidden">
          Quartz<span class="text-quartz-400">Dashboard</span>
          <span class="ml-1 text-[10px] text-gray-600 font-mono">v0.1</span>
        </span>
      </div>

      <!-- Nav items -->
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto scrollbar-thin">
        <template x-for="item in navItems" :key="item.id">
          <div @click="currentPage = item.id" :class="['sidebar-item', currentPage === item.id ? 'active' : 'text-gray-400', sidebarOpen ? '' : 'justify-center px-0']"
               :title="!sidebarOpen ? item.label : ''">
            <span x-html="item.icon" class="w-5 h-5 flex-shrink-0"></span>
            <span x-show="sidebarOpen" x-text="item.label" class="overflow-hidden sidebar-collapsed-text"></span>
          </div>
        </template>
      </nav>

      <!-- Collapse toggle + Scheduler status -->
      <div class="p-3 border-t border-gray-800/50 space-y-2">
        <div x-show="sidebarOpen" class="flex items-center justify-between px-3 py-2 rounded-lg bg-gray-800/40">
          <div class="flex items-center gap-2.5">
            <span :class="['w-2 h-2 rounded-full', scheduler.isStarted && !scheduler.isStandbyMode ? 'bg-emerald-400 pulse-dot' : 'bg-gray-500']"></span>
            <span class="text-xs text-gray-400">
              <span x-text="scheduler.isStarted ? (scheduler.isStandbyMode ? 'Standby' : 'Running') : 'Stopped'"></span>
            </span>
          </div>
          <span class="text-[10px] text-gray-600 font-mono" x-text="'v' + (scheduler.version || '?')"></span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen" class="w-full flex items-center justify-center py-1.5 rounded-lg hover:bg-white/5 text-gray-500 hover:text-gray-300 transition-colors" :title="sidebarOpen ? 'Collapse' : 'Expand'">
          <svg class="w-4 h-4 transition-transform duration-300" :class="sidebarOpen ? 'rotate-0' : 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto scrollbar-thin p-6">
      <!-- ============================== OVERVIEW ============================== -->
      <template x-if="currentPage === 'overview'">
        <div class="animate-fade space-y-6" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-gray-100">Scheduler Overview</h1>
            <div class="flex gap-2">
              <button @click="startScheduler()" :disabled="!scheduler.isStandbyMode"
                      :class="['btn', scheduler.isStandbyMode ? 'btn-success' : 'btn-ghost']">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span x-show="sidebarOpen">Start</span>
              </button>
              <button @click="standbyScheduler()" :disabled="scheduler.isStandbyMode || !scheduler.isStarted"
                      :class="['btn', !scheduler.isStandbyMode && scheduler.isStarted ? 'btn-warning' : 'btn-ghost']">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                Standby
              </button>
              <button @click="refreshAll()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
              </button>
            </div>
          </div>

          <!-- Stat cards with sparklines -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="stat-card">
              <div class="text-xs text-gray-500 mb-1">Jobs</div>
              <div class="text-2xl font-semibold text-gray-100">
                <template x-if="statsLoading"><div class="skeleton h-8 w-12 rounded"></div></template>
                <span x-show="!statsLoading" x-text="jobs.length"></span>
              </div>
              <div class="sparkline-container" x-show="executionBuckets.length">
                <svg :width="sparklineW" :height="sparklineH" class="overflow-visible">
                  <polyline :points="sparklinePoints('count')" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <div class="stat-card">
              <div class="text-xs text-gray-500 mb-1">Triggers</div>
              <div class="text-2xl font-semibold text-gray-100">
                <template x-if="statsLoading"><div class="skeleton h-8 w-12 rounded"></div></template>
                <span x-show="!statsLoading" x-text="triggers.length"></span>
              </div>
              <div class="sparkline-container" x-show="executionBuckets.length">
                <svg :width="sparklineW" :height="sparklineH" class="overflow-visible">
                  <polyline :points="sparklinePoints('count')" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <div class="stat-card">
              <div class="text-xs text-gray-500 mb-1">Executing Now</div>
              <div class="text-2xl font-semibold">
                <template x-if="statsLoading"><div class="skeleton h-8 w-12 rounded"></div></template>
                <span x-show="!statsLoading" x-text="executingJobs.length" :class="executingJobs.length > 0 ? 'text-emerald-400' : 'text-gray-100'"></span>
              </div>
              <div class="sparkline-container" x-show="executionBuckets.length">
                <svg :width="sparklineW" :height="sparklineH" class="overflow-visible">
                  <polyline :points="sparklinePoints('count')" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <div class="stat-card">
              <div class="text-xs text-gray-500 mb-1">Total Executions</div>
              <div class="text-2xl font-semibold text-gray-100">
                <template x-if="statsLoading"><div class="skeleton h-8 w-12 rounded"></div></template>
                <span x-show="!statsLoading" x-text="scheduler.numberOfJobsExecuted || 0"></span>
              </div>
              <div class="sparkline-container" x-show="executionBuckets.length">
                <svg :width="sparklineW" :height="sparklineH" class="overflow-visible">
                  <polyline :points="sparklinePoints('count')" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Scheduler info -->
          <div class="card">
            <h2 class="text-sm font-medium text-gray-300 mb-4">Scheduler Info</h2>
            <div class="grid grid-cols-2 gap-x-8 gap-y-3">
              <div><span class="text-xs text-gray-500">Name</span><p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.name || '—'"></p></div>
              <div><span class="text-xs text-gray-500">Instance ID</span><p class="text-sm text-gray-200 mt-0.5 mono" x-text="scheduler.instanceId || '—'"></p></div>
              <div><span class="text-xs text-gray-500">Job Store</span><p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.jobStoreType || '—'"></p></div>
              <div><span class="text-xs text-gray-500">Thread Pool</span><p class="text-sm text-gray-200 mt-0.5" x-text="scheduler.threadPoolType || '—'"></p></div>
              <div><span class="text-xs text-gray-500">Uptime</span><p class="text-sm text-gray-200 mt-0.5" x-text="formatDuration(scheduler.upTime) || '—'"></p></div>
              <div><span class="text-xs text-gray-500">Status</span>
                <p class="text-sm mt-0.5">
                  <span :class="scheduler.isStandbyMode ? 'badge badge-paused' : (scheduler.isStarted ? 'badge badge-active' : 'badge badge-error')"
                        x-text="scheduler.isStandbyMode ? 'Standby' : (scheduler.isStarted ? 'Running' : 'Stopped')"></span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================== JOBS ============================== -->
      <template x-if="currentPage === 'jobs'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h1 class="text-xl font-semibold text-gray-100">Jobs</h1>
            <div class="flex items-center gap-2">
              <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" x-model="jobsFilter" placeholder="Search jobs..." class="glass-input pl-8 w-56 text-xs">
              </div>
              <button @click="loadJobs()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh
              </button>
            </div>
          </div>

          <!-- Loading skeleton -->
          <template x-if="loading.jobs">
            <div class="card space-y-3">
              <template x-for="i in 4" :key="i">
                <div class="flex items-center gap-4">
                  <div class="skeleton h-10 w-10 rounded-lg"></div>
                  <div class="flex-1 space-y-2">
                    <div class="skeleton h-3 w-1/3 rounded"></div>
                    <div class="skeleton h-2 w-1/4 rounded"></div>
                  </div>
                  <div class="skeleton h-6 w-16 rounded"></div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!loading.jobs">
            <div class="space-y-2">
              <template x-for="job in filteredJobs" :key="job.group + '.' + job.name">
                <div>
                  <!-- Main row -->
                  <div @click="toggleJobExpand(job.group, job.name)"
                       :class="['card flex items-center justify-between cursor-pointer',
                                hasJobTriggers(job) ? 'job-border-triggers' : (job.isExecuting ? 'job-border-idle' : 'job-border-idle')]">
                    <div class="flex items-center gap-3 min-w-0">
                      <svg class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform duration-200"
                           :class="expandedJobs[job.group + '.' + job.name] ? 'rotate-90' : ''"
                           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                      </svg>
                      <div class="min-w-0">
                        <div class="font-medium text-gray-100 text-sm truncate" x-text="job.name"></div>
                        <div class="text-xs text-gray-500 truncate" x-text="job.group"></div>
                      </div>
                    </div>
                    <div class="flex items-center gap-4 flex-shrink-0">
                      <span class="mono text-xs text-gray-400 hidden md:inline" x-text="job.jobType"></span>
                      <span x-show="job.isExecuting" class="badge badge-active">Executing</span>
                      <span x-show="!job.isExecuting" class="badge badge-info">Idle</span>
                      <div class="flex gap-1">
                        <button @click.stop="triggerJob(job.group, job.name)" class="btn btn-primary" title="Trigger Now">
                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button @click.stop="pauseJob(job.group, job.name)" class="btn btn-warning" title="Pause">
                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        </button>
                        <button @click.stop="resumeJob(job.group, job.name)" class="btn btn-success" title="Resume">
                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                  <!-- Expanded trigger details -->
                  <div x-show="expandedJobs[job.group + '.' + job.name]"
                       class="ml-8 mt-1 accordion-enter overflow-hidden">
                    <div class="bg-gray-800/20 border border-white/5 rounded-lg p-3 space-y-1">
                      <template x-if="!job.triggers || !job.triggers.length">
                        <p class="text-xs text-gray-500 py-1">No triggers configured</p>
                      </template>
                      <template x-for="t in job.triggers || []" :key="t.name">
                        <div class="flex items-center justify-between py-1.5 px-2 rounded hover:bg-white/[0.02]">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class="text-xs font-medium text-gray-200 truncate" x-text="t.name"></span>
                            <span :class="'badge ' + (t.state === 'Normal' ? 'badge-active' : t.state === 'Paused' ? 'badge-paused' : 'badge-info')" x-text="t.state"></span>
                            <span class="text-[10px] text-gray-500" x-text="t.scheduleDescription || t.type"></span>
                          </div>
                          <div class="flex items-center gap-2 flex-shrink-0">
                            <span class="text-[10px] text-gray-500 mono" x-text="t.nextFireTime ? 'Next: ' + relativeTime(t.nextFireTime) : '—'"></span>
                            <button @click.stop="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2 py-1">Pause</button>
                            <button @click.stop="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2 py-1">Resume</button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
              <div x-show="!filteredJobs.length" class="card text-center py-8">
                <p class="text-gray-500 text-sm">No jobs match your search.</p>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== TRIGGERS ============================== -->
      <template x-if="currentPage === 'triggers'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-gray-100">Triggers</h1>
            <button @click="loadTriggers()" class="btn btn-ghost">Refresh</button>
          </div>

          <template x-if="loading.triggers">
            <div class="card space-y-3">
              <template x-for="i in 3" :key="i">
                <div class="space-y-2">
                  <div class="skeleton h-4 w-1/4 rounded"></div>
                  <div class="skeleton h-8 w-full rounded ml-4"></div>
                  <div class="skeleton h-8 w-full rounded ml-4"></div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!loading.triggers">
            <div class="space-y-2">
              <template x-for="(group, gIdx) in groupedTriggers" :key="gIdx">
                <div class="card p-0 overflow-hidden">
                  <div @click="toggleTriggerGroup(gIdx)" class="group-header">
                    <svg class="w-4 h-4 text-gray-500 transition-transform duration-200"
                         :class="expandedTriggerGroups[gIdx] ? 'rotate-90' : ''"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="9 18 15 12 9 6"/>
                    </svg>
                    <span class="font-medium" x-text="group.jobName"></span>
                    <span class="badge badge-info text-[10px]" x-text="group.triggers.length + ' trigger' + (group.triggers.length !== 1 ? 's' : '')"></span>
                  </div>
                  <div x-show="expandedTriggerGroups[gIdx]" class="accordion-enter">
                    <table class="w-full">
                      <thead class="bg-gray-800/30">
                        <tr>
                          <th class="table-header">Trigger</th>
                          <th class="table-header hidden sm:table-cell">Type</th>
                          <th class="table-header">State</th>
                          <th class="table-header hidden md:table-cell">Schedule</th>
                          <th class="table-header">Next Fire</th>
                          <th class="table-header text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-white/5">
                        <template x-for="t in group.triggers" :key="t.group + '.' + t.name">
                          <tr class="table-row">
                            <td class="table-cell font-medium text-gray-100 text-xs" x-text="t.name"></td>
                            <td class="table-cell hidden sm:table-cell"><span class="mono text-xs text-gray-400" x-text="t.type"></span></td>
                            <td class="table-cell">
                              <span :class="'badge ' + (t.state === 'Normal' ? 'badge-active' : t.state === 'Paused' ? 'badge-paused' : 'badge-info')" x-text="t.state"></span>
                            </td>
                            <td class="table-cell hidden md:table-cell text-xs text-gray-400" x-text="t.scheduleDescription || '—'"></td>
                            <td class="table-cell text-xs mono text-gray-400 relative">
                              <span x-text="t.nextFireTime ? 'in ' + relativeTime(t.nextFireTime) : '—'" :title="t.nextFireTime ? formatDate(t.nextFireTime) : ''"></span>
                            </td>
                            <td class="table-cell text-right">
                              <div class="flex gap-1 justify-end">
                                <button @click="pauseTrigger(t.group, t.name)" class="btn btn-warning text-[10px] px-2 py-1">Pause</button>
                                <button @click="resumeTrigger(t.group, t.name)" class="btn btn-success text-[10px] px-2 py-1">Resume</button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
              <div x-show="!groupedTriggers.length" class="card text-center py-8">
                <p class="text-gray-500 text-sm">No triggers found.</p>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== EXECUTING ============================== -->
      <template x-if="currentPage === 'executing'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-gray-100">Executing Jobs</h1>
            <button @click="loadExecutingJobs()" class="btn btn-ghost">Refresh</button>
          </div>

          <template x-if="loading.executing">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <template x-for="i in 2" :key="i">
                <div class="card space-y-3">
                  <div class="flex items-center gap-2">
                    <div class="skeleton h-3 w-3 rounded-full"></div>
                    <div class="skeleton h-4 w-1/3 rounded"></div>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div class="skeleton h-8 rounded"></div>
                    <div class="skeleton h-8 rounded"></div>
                    <div class="skeleton h-8 rounded"></div>
                    <div class="skeleton h-8 rounded"></div>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!loading.executing">
            <div>
              <div x-show="!executingJobs.length" class="card text-center py-12">
                <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <p class="text-gray-500 text-sm">No jobs currently executing</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4" x-show="executingJobs.length">
                <template x-for="(ej, idx) in executingJobs" :key="ej.fireInstanceId || idx">
                  <div class="card" :class="isNewExecutingJob(ej) ? 'highlight-new' : ''">
                    <div class="flex items-center justify-between mb-3">
                      <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
                        <span class="font-medium text-gray-100 text-sm" x-text="ej.jobName"></span>
                        <span class="text-xs text-gray-500" x-text="ej.jobGroup"></span>
                      </div>
                      <span class="badge badge-active">Running</span>
                    </div>
                    <!-- Live duration bar -->
                    <div class="mb-3">
                      <div class="flex justify-between text-[10px] text-gray-500 mb-1">
                        <span>Duration</span>
                        <span x-text="formatDuration(ej.duration)"></span>
                      </div>
                      <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-quartz-500 duration-bar"
                             :style="'width: ' + Math.min((ej.durationMs || 0) / 100, 100) + '%'"></div>
                      </div>
                    </div>
                    <div class="grid grid-cols-3 gap-x-4 gap-y-2 text-sm">
                      <div><span class="text-[10px] text-gray-500">Type</span><p class="text-gray-300 mono text-xs mt-0.5 truncate" x-text="ej.jobType"></p></div>
                      <div><span class="text-[10px] text-gray-500">Trigger</span><p class="text-gray-300 text-xs mt-0.5 truncate" x-text="ej.triggerGroup + '.' + ej.triggerName"></p></div>
                      <div><span class="text-[10px] text-gray-500">Refire #</span><p class="text-gray-300 text-xs mt-0.5" x-text="ej.refireCount"></p></div>
                      <div><span class="text-[10px] text-gray-500">Fired At</span><p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="formatDate(ej.fireTime)"></p></div>
                      <div><span class="text-[10px] text-gray-500">Scheduled</span><p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="formatDate(ej.scheduledFireTime)"></p></div>
                      <div><span class="text-[10px] text-gray-500">Instance</span><p class="text-gray-300 text-xs mt-0.5 mono truncate" x-text="(ej.fireInstanceId || '').slice(0, 12) + '...'"></p></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== HISTORY ============================== -->
      <template x-if="currentPage === 'history'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h1 class="text-xl font-semibold text-gray-100">Fire History</h1>
            <div class="flex items-center gap-2">
              <div class="relative">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

              </div>

          <template x-if="loading.history">
            <div class="card space-y-2">
              <template x-for="i in 5" :key="i">
                <div class="flex items-center gap-4">
                  <div class="skeleton h-3 w-24 rounded"></div>
                  <div class="skeleton h-3 w-20 rounded"></div>
                  <div class="skeleton h-3 w-16 rounded"></div>
                  <div class="skeleton h-3 w-12 rounded ml-auto"></div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!loading.history">
            <div>
              <div x-show="!filteredHistory.length" class="card text-center py-12">
                <p class="text-gray-500 text-sm">No fire history yet. <span class="text-gray-600">Enable <code class="mono text-xs bg-gray-800 px-1.5 py-0.5 rounded">AddQuartzDashboardHistory()</code> to record fire events.</span></p>
              </div>

              <div class="overflow-x-auto rounded-xl border border-white/5" x-show="filteredHistory.length">
                <table class="w-full">
                  <thead class="bg-gray-800/40">
                    <tr>
                      <th class="table-header">Time</th>
                      <th class="table-header">Job</th>
                      <th class="table-header hidden sm:table-cell">Trigger</th>
                      <th class="table-header">Duration</th>
                      <th class="table-header hidden md:table-cell">Duration Bar</th>
                      <th class="table-header">Outcome</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-white/5">
                    <template x-for="(h, idx) in filteredHistory" :key="idx">
                      <tr class="table-row">
                        <td class="table-cell mono text-xs" x-text="formatDate(h.fireTime)"></td>
                        <td class="table-cell font-medium text-gray-100 text-xs" x-text="h.jobKey"></td>
                        <td class="table-cell text-xs text-gray-400 hidden sm:table-cell truncate max-w-[120px]" x-text="h.triggerKey"></td>
                        <td class="table-cell text-xs mono" x-text="h.duration ? formatDuration(h.duration) : '—'"></td>
                        <td class="table-cell hidden md:table-cell">
                          <div class="w-24 h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
                            <div class="h-full rounded-full duration-bar"
                                 :class="h.success ? 'bg-emerald-500' : 'bg-red-500'"
                                 :style="'width: ' + Math.min((h.durationMs || 0) / (maxHistoryDuration || 5000) * 100, 100) + '%'"></div>
                          </div>
                        </td>
                        <td class="table-cell">
                          <span :class="h.success ? 'badge badge-active' : 'badge badge-error'" x-text="h.success ? 'OK' : 'Error'"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== GRAPH ============================== -->
      <template x-if="currentPage === 'graph'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-gray-100">Execution Graph</h1>
            <div class="flex items-center gap-2">
              <button @click="graphView = 'live'" :class="['btn', graphView === 'live' ? 'btn-primary' : 'btn-ghost']">Live 5min</button>
              <button @click="graphView = 'hour'" :class="['btn', graphView === 'hour' ? 'btn-primary' : 'btn-ghost']">Hour</button>
              <button @click="loadStats()" class="btn btn-ghost">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
              </button>
            </div>
          </div>

          <template x-if="loading.stats">
            <div class="card">
              <div class="skeleton h-64 w-full rounded-lg"></div>
              <div class="flex justify-center gap-6 mt-4">
                <div class="skeleton h-3 w-20 rounded"></div>
                <div class="skeleton h-3 w-20 rounded"></div>
              </div>
            </div>
          </template>

          <template x-if="!loading.stats">
            <div class="card">
              <div class="relative" x-ref="graphContainer">
                <svg :width="graphWidth" :height="graphHeight" class="w-full" :viewBox="'0 0 ' + graphWidth + ' ' + graphHeight" preserveAspectRatio="xMidYMid meet">
                  <!-- Grid lines -->
                  <template x-for="i in 5" :key="'grid-' + i">
                    <line :x1="graphMargin.left" :y1="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5"
                          :x2="graphWidth - graphMargin.right" :y2="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5"
                          stroke="#374151" stroke-width="0.5" stroke-dasharray="4,4"/>
                  </template>
                  <!-- Y axis labels (count) -->
                  <template x-for="i in 5" :key="'ycount-' + i">
                    <text :x="graphMargin.left - 8" :y="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 5 + 3"
                          text-anchor="end" class="fill-gray-500 text-[9px]">
                      <tspan x-text="Math.round((graphMaxCount || 10) * (1 - i / 5))"></tspan>
                    </text>
                  </template>
                  <!-- Y axis labels (duration) right side -->
                  <template x-for="i in 4" :key="'ydur-' + i">
                    <text :x="graphWidth - graphMargin.right + 8" :y="graphMargin.top + (graphHeight - graphMargin.top - graphMargin.bottom) * i / 4 + 3"
                          text-anchor="start" class="fill-gray-500 text-[9px]">
                      <tspan x-text="Math.round((graphMaxDuration || 1000) * (1 - i / 4)) + 'ms'"></tspan>
                    </text>
                  </template>
                  <!-- X axis labels -->
                  <template x-for="(bucket, idx) in graphData" :key="'xlabel-' + idx">
                    <text v-if="idx % Math.max(1, Math.floor(graphData.length / 6)) === 0"
                          :x="graphX(idx)" :y="graphHeight - graphMargin.bottom + 14"
                          text-anchor="middle" class="fill-gray-500 text-[8px]"
                          x-text="formatTimeShort(bucket.minute)"></text>
                  </template>
                  <!-- Gradient def -->
                  <defs>
                    <linearGradient id="countGradient" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
                      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02"/>
                    </linearGradient>
                    <linearGradient id="durationGradient" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
                      <stop offset="100%" stop-color="#34d399" stop-opacity="0.01"/>
                    </linearGradient>
                  </defs>
                  <!-- Area fill for count -->
                  <polygon :points="countAreaPoints()" fill="url(#countGradient)"/>
                  <!-- Count line -->
                  <polyline :points="graphLinePoints('count')" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- Duration line -->
                  <polyline :points="graphLinePoints('avgDurationMs')" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- Data points (count) -->
                  <template x-for="(bucket, idx) in graphData" :key="'pt-' + idx">
                    <circle :cx="graphX(idx)" :cy="graphY(bucket.count, graphMaxCount || 10)" r="3" fill="#818cf8" class="cursor-pointer"
                            @mouseenter="graphTooltip = { show: true, x: graphX(idx), y: graphY(bucket.count, graphMaxCount || 10) - 10, bucket: bucket }"
                            @mouseleave="graphTooltip.show = false"/>
                  </template>
                  <!-- Legend -->
                  <line x1="16" :y1="graphHeight - graphMargin.bottom + 34" x2="36" :y2="graphHeight - graphMargin.bottom + 34" stroke="#818cf8" stroke-width="2"/>
                  <text x="40" :y="graphHeight - graphMargin.bottom + 37" class="fill-gray-400 text-[9px]">Executions</text>
                  <line x1="16" :y1="graphHeight - graphMargin.bottom + 48" x2="36" :y2="graphHeight - graphMargin.bottom + 48" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3"/>
                  <text x="40" :y="graphHeight - graphMargin.bottom + 51" class="fill-gray-400 text-[9px]">Avg Duration</text>
                </svg>
                <!-- Tooltip -->
                <div x-show="graphTooltip.show"
                     :style="'left: ' + graphTooltip.x + 'px; top: ' + graphTooltip.y + 'px;'"
                     class="graph-tooltip" style="display: none;">
                  <div class="text-gray-300 font-medium" x-text="'Minute: ' + formatTimeShort(graphTooltip.bucket.minute)"></div>
                  <div class="text-quartz-300" x-text="'Executions: ' + graphTooltip.bucket.count"></div>
                  <div class="text-emerald-300" x-text="'Avg Duration: ' + Math.round(graphTooltip.bucket.avgDurationMs || 0) + 'ms'"></div>
                  <div x-show="graphTooltip.bucket.errorRate !== undefined" class="text-red-300" x-text="'Error Rate: ' + (graphTooltip.bucket.errorRate * 100).toFixed(1) + '%'"></div>
                </div>
              </div>
              <!-- Summary stats -->
              <div class="flex flex-wrap gap-6 mt-6 pt-4 border-t border-white/5">
                <div><span class="text-xs text-gray-500">Execution Rate</span><p class="text-sm font-medium text-gray-200" x-text="(stats.executionRate || 0).toFixed(2) + '/s'"></p></div>
                <div><span class="text-xs text-gray-500">Total Executions</span><p class="text-sm font-medium text-gray-200" x-text="stats.totalExecutions || 0"></p></div>
                <div><span class="text-xs text-gray-500">Uptime</span><p class="text-sm font-medium text-gray-200" x-text="formatDuration({hours:0, minutes: stats.uptimeMinutes || 0, seconds:0, milliseconds:0})"></p></div>
                <div><span class="text-xs text-gray-500">Avg Duration (last bucket)</span><p class="text-sm font-medium text-gray-200" x-text="graphData.length ? Math.round(graphData[graphData.length-1].avgDurationMs || 0) + 'ms' : '—'"></p></div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ============================== SETTINGS ============================== -->
      <template x-if="currentPage === 'settings'">
        <div class="animate-fade space-y-4" x-transition:enter.duration.200ms>
          <h1 class="text-xl font-semibold text-gray-100">Settings</h1>

          <div class="card space-y-6">
            <!-- Refresh Interval -->
            <div>
              <h2 class="text-sm font-medium text-gray-300 mb-3">Refresh Interval</h2>
              <div class="flex items-center gap-4">
                <input type="range" x-model="settings.refreshInterval" min="1" max="60" step="1" class="flex-1 max-w-xs">
                <span class="text-sm font-mono text-quartz-300 w-12 text-right" x-text="settings.refreshInterval + 's'"></span>
              </div>
              <p class="text-xs text-gray-500 mt-1">How often the dashboard auto-refreshes data (1-60 seconds).</p>
            </div>

            <div class="border-t border-white/5"></div>

            <!-- Auto-refresh per page -->
            <div>
              <h2 class="text-sm font-medium text-gray-300 mb-3">Auto-Refresh by Page</h2>
              <div class="space-y-3">
                <template x-for="item in navItems" :key="item.id">
                  <label class="flex items-center justify-between py-1 px-2 rounded-lg hover:bg-white/[0.02] cursor-pointer">
                    <div class="flex items-center gap-3">
                      <span x-html="item.icon" class="w-4 h-4 text-gray-400"></span>
                      <span class="text-sm text-gray-300" x-text="item.label"></span>
                    </div>
                    <div @click="toggleAutoRefresh(item.id)" 
                         :class="['w-9 h-5 rounded-full transition-colors duration-200 relative cursor-pointer',
                                  settings.autoRefreshPages[item.id] ? 'bg-quartz-600' : 'bg-gray-700']">
                      <div :class="['w-3.5 h-3.5 rounded-full bg-white absolute top-0.5 transition-transform duration-200',
                                   settings.autoRefreshPages[item.id] ? 'translate-x-[18px]' : 'translate-x-[3px]']">
                      </div>
                    </div>
                  </label>
                </template>
              </div>
              <p class="text-xs text-gray-500 mt-2">Enable or disable auto-refresh for each page individually.</p>
            </div>

            <div class="border-t border-white/5"></div>

            <!-- About -->
            <div>
              <h2 class="text-sm font-medium text-gray-300 mb-3">About</h2>
              <div class="text-xs text-gray-500 space-y-1">
                <p>Quartz Dashboard v0.1</p>
                <p>Built with Alpine.js 3.x + Tailwind CSS v4</p>
                <p>Single-file SPA — no build step required</p>
                <p class="mt-2">API endpoints: <code class="mono text-quartz-400">/quartz/api/*</code></p>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- Loading overlay -->
  <div x-show="loading.global" class="fixed inset-0 bg-gray-900/30 flex items-center justify-center z-40" style="display: none;">
    <div class="loading-spinner w-8 h-8 border-4"></div>
  </div>

  <script>
    function dashboard() {
      return {
        // ========================= STATE =========================
        currentPage: 'overview',
        sidebarOpen: true,
        loading: { global: false, jobs: false, triggers: false, executing: false, history: false, stats: false },
        scheduler: { isStarted: false, isStandbyMode: false, numberOfJobsExecuted: 0 },
        jobs: [],
        triggers: [],
        executingJobs: [],
        history: [],
        stats: {},
        executionBuckets: [],
        toast: { show: false, message: '', type: 'info' },
        autoRefreshTimer: null,

        // Jobs page
        jobsFilter: '',
        expandedJobs: {},

        // Triggers page
        expandedTriggerGroups: {},

        // Executing page
        knownExecutingIds: new Set(),

        // History page
        historyFilter: '',
        maxHistoryDuration: 0,

        // Graph page
        graphView: 'live',
        graphWidth: 800,
        graphHeight: 320,
        graphMargin: { top: 20, right: 60, bottom: 30, left: 40 },
        graphTooltip: { show: false, x: 0, y: 0, bucket: { minute: '', count: 0, avgDurationMs: 0 } },
        graphMaxCount: 10,
        graphMaxDuration: 1000,
        graphData: [],

        // Sparklines
        sparklineW: 80,
        sparklineH: 30,

        // Settings
        settings: {
          refreshInterval: 5,
          autoRefreshPages: {
            overview: true,
            jobs: true,
            triggers: true,
            executing: true,
            history: true,
            graph: true,
            settings: false
          }
        },

        navItems: [
          { id: 'overview', label: 'Overview', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>' },
          { id: 'jobs', label: 'Jobs', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>' },
          { id: 'triggers', label: 'Triggers', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' },
          { id: 'executing', label: 'Executing', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
          { id: 'history', label: 'History', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
          { id: 'graph', label: 'Graph', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>' },
          { id: 'settings', label: 'Settings', icon: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>' },
        ],

        // ========================= COMPUTED =========================
        get filteredJobs() {
          if (!this.jobsFilter) return this.jobs;
          const q = this.jobsFilter.toLowerCase();
          return this.jobs.filter(j =>
            j.name.toLowerCase().includes(q) ||
            j.group.toLowerCase().includes(q) ||
            (j.jobType || '').toLowerCase().includes(q)
          );
        },

        get groupedTriggers() {
          const groups = {};
          for (const t of this.triggers) {
            const key = t.jobGroup + '.' + t.jobName;
            if (!groups[key]) groups[key] = { jobName: key, triggers: [] };
            groups[key].triggers.push(t);
          }
          return Object.values(groups);
        },

        get filteredHistory() {
          if (!this.historyFilter) return this.history;
          const q = this.historyFilter.toLowerCase();
          return this.history.filter(h => (h.jobKey || '').toLowerCase().includes(q));
        },

        // ========================= INIT =========================
        async init() {
          await this.refreshAll();
          // Initial page-specific loads
          await this.loadHistory();
          await this.loadStats();
          this.startAutoRefresh();
          // Watch currentPage changes to trigger page-specific loads
          this.$watch('currentPage', (val) => {
            this.onPageChange(val);
          });
          // Watch refreshInterval to restart timer
          this.$watch('settings.refreshInterval', () => {
            this.startAutoRefresh();
          });
          // Adjust graph on resize
          if (this.$refs && this.$refs.graphContainer) {
            this.updateGraphSize();
          }
          window.addEventListener('resize', () => this.updateGraphSize());
        },

        updateGraphSize() {
          const container = this.$refs && this.$refs.graphContainer;
          if (container) {
            this.graphWidth = Math.max(400, container.clientWidth || 800);
          }
        },

        onPageChange(page) {
          if (page === 'history') this.loadHistory();
          if (page === 'graph') this.loadStats();
          if (page === 'jobs') {/* already loaded */};
          if (page === 'triggers') this.loadTriggers();
          if (page === 'executing') this.loadExecutingJobs();
        },

        // ========================= AUTO-REFRESH =========================
        startAutoRefresh() {
          if (this.autoRefreshTimer) clearInterval(this.autoRefreshTimer);
          const ms = this.settings.refreshInterval * 1000;
          this.autoRefreshTimer = setInterval(() => {
            const page = this.currentPage;
            if (this.settings.autoRefreshPages[page]) {
              this.refreshPage(page);
            }
          }, ms);
        },

        toggleAutoRefresh(pageId) {
          this.settings.autoRefreshPages[pageId] = !this.settings.autoRefreshPages[pageId];
        },

        async refreshPage(page) {
          switch (page) {
            case 'overview': await this.refreshAll(); break;
            case 'jobs': await this.loadJobs(); break;
            case 'triggers': await this.loadTriggers(); break;
            case 'executing': await this.loadExecutingJobs(); break;
            case 'history': await this.loadHistory(); break;
            case 'graph': await this.loadStats(); break;
          }
        },

        // ========================= TOAST =========================
        showToast(msg, type = 'info') {
          this.toast = { show: true, message: msg, type };
          setTimeout(() => this.toast.show = false, 3000);
        },

        // ========================= API =========================
        async fetchApi(path) {
          const res = await fetch(path);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          return res.json();
        },

        async postApi(path) {
          const res = await fetch(path, { method: 'POST' });
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          return res.json();
        },

        async refreshAll() {
          try {
            const [scheduler, jobs, triggers, executing] = await Promise.all([
              this.fetchApi('/quartz/api/scheduler').catch(() => this.scheduler),
              this.fetchApi('/quartz/api/jobs').catch(() => this.jobs),
              this.fetchApi('/quartz/api/triggers').catch(() => this.triggers),
              this.fetchApi('/quartz/api/executing').catch(() => this.executingJobs),
            ]);
            this.scheduler = scheduler;
            this.jobs = jobs;
            this.triggers = triggers;
            this.executingJobs = executing;
          } catch (e) {
            console.error('Refresh error:', e);
          }
        },

        async loadJobs() {
          this.loading.jobs = true;
          try { this.jobs = await this.fetchApi('/quartz/api/jobs'); } catch (e) { console.error('loadJobs:', e); }
          this.loading.jobs = false;
        },

        async loadTriggers() {
          this.loading.triggers = true;
          try { this.triggers = await this.fetchApi('/quartz/api/triggers'); } catch (e) { console.error('loadTriggers:', e); }
          this.loading.triggers = false;
        },

        async loadExecutingJobs() {
          this.loading.executing = true;
          const prevIds = this.knownExecutingIds;
          try {
            this.executingJobs = await this.fetchApi('/quartz/api/executing');
            this.knownExecutingIds = new Set(this.executingJobs.map(ej => ej.fireInstanceId));
          } catch (e) { console.error('loadExecutingJobs:', e); }
          this.loading.executing = false;
        },

        async loadHistory() {
          this.loading.history = true;
          try {
            this.history = await this.fetchApi('/quartz/api/history');
            // Calculate max duration for bar width
            this.maxHistoryDuration = 0;
            for (const h of this.history) {
              const d = h.durationMs || 0;
              if (d > this.maxHistoryDuration) this.maxHistoryDuration = d;
            }
            if (this.maxHistoryDuration === 0) this.maxHistoryDuration = 5000;
          } catch (e) { console.error('loadHistory:', e); }
          this.loading.history = false;
        },

        async loadStats() {
          this.loading.stats = true;
          try {
            this.stats = await this.fetchApi('/quartz/api/stats');
            this.executionBuckets = this.stats.executionBuckets || [];
            this.graphData = this.getGraphData();
          } catch (e) { console.error('loadStats:', e); }
          this.loading.stats = false;
        },

        getGraphData() {
          const buckets = this.executionBuckets || [];
          if (!buckets.length) return [];
          if (this.graphView === 'live') {
            return buckets.slice(-5); // Last 5 minutes
          }
          return buckets; // All buckets (hour view)
        },

        // ========================= JOB ACTIONS =========================
        async startScheduler() {
          this.loading.global = true;
          try {
            await this.postApi('/quartz/api/scheduler/start');
            this.showToast('Scheduler started', 'success');
            await this.refreshAll();
          } catch (e) { this.showToast('Failed to start: ' + e.message, 'error'); }
          this.loading.global = false;
        },

        async standbyScheduler() {
          this.loading.global = true;
          try {
            await this.postApi('/quartz/api/scheduler/standby');
            this.showToast('Scheduler on standby', 'info');
            await this.refreshAll();
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
          this.loading.global = false;
        },

        async triggerJob(group, name) {
          try {
            await this.postApi(`/quartz/api/jobs/${group}/${name}/trigger`);
            this.showToast(`Triggered ${group}.${name}`, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async pauseJob(group, name) {
          try {
            await this.postApi(`/quartz/api/jobs/${group}/${name}/pause`);
            await this.loadJobs();
            this.showToast(`Paused ${group}.${name}`, 'info');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async resumeJob(group, name) {
          try {
            await this.postApi(`/quartz/api/jobs/${group}/${name}/resume`);
            await this.loadJobs();
            this.showToast(`Resumed ${group}.${name}`, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async pauseTrigger(group, name) {
          try {
            await this.postApi(`/quartz/api/triggers/${group}/${name}/pause`);
            await this.loadTriggers();
            this.showToast(`Paused trigger ${group}.${name}`, 'info');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        async resumeTrigger(group, name) {
          try {
            await this.postApi(`/quartz/api/triggers/${group}/${name}/resume`);
            await this.loadTriggers();
            this.showToast(`Resumed trigger ${group}.${name}`, 'success');
          } catch (e) { this.showToast('Failed: ' + e.message, 'error'); }
        },

        // ========================= UI HELPERS =========================
        toggleJobExpand(group, name) {
          const key = group + '.' + name;
          this.expandedJobs[key] = !this.expandedJobs[key];
        },

        toggleTriggerGroup(idx) {
          this.expandedTriggerGroups[idx] = !this.expandedTriggerGroups[idx];
        },

        hasJobTriggers(job) {
          return job.triggers && job.triggers.length > 0;
        },

        isNewExecutingJob(ej) {
          return ej.fireInstanceId && !this.knownExecutingIds.has(ej.fireInstanceId);
        },

        relativeTime(dateStr) {
          if (!dateStr) return '—';
          const now = new Date();
          const target = new Date(dateStr);
          const diffMs = target - now;
          if (diffMs <= 0) return 'now';
          const secs = Math.floor(diffMs / 1000);
          if (secs < 60) return secs + 's';
          const mins = Math.floor(secs / 60);
          const remSecs = secs % 60;
          if (mins < 60) return mins + 'm ' + remSecs + 's';
          const hours = Math.floor(mins / 60);
          const remMins = mins % 60;
          return hours + 'h ' + remMins + 'm';
        },

        formatDuration(d) {
          if (!d) return '';
          if (typeof d === 'string') {
            // PT format
            return d.replace('PT', '').replace('H', 'h ').replace('M', 'm ').replace('S', 's');
          }
          if (typeof d === 'object') {
            const secs = (d.hours || 0) * 3600 + (d.minutes || 0) * 60 + (d.seconds || 0) + (d.milliseconds || 0) / 1000;
            if (secs < 1) return Math.round(secs * 1000) + 'ms';
            if (secs < 60) return secs.toFixed(1) + 's';
            return Math.floor(secs / 60) + 'm ' + Math.round(secs % 60) + 's';
          }
          return d;
        },

        formatDate(d) {
          if (!d) return '';
          const dt = new Date(d);
          if (isNaN(dt.getTime())) return '';
          return dt.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        },

        formatTimeShort(d) {
          if (!d) return '';
          const dt = new Date(d);
          if (isNaN(dt.getTime())) return '';
          return dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        },

        // ========================= SPARKLINE =========================
        sparklinePoints(field) {
          const buckets = this.executionBuckets || [];
          if (!buckets.length) return '';
          const w = this.sparklineW;
          const h = this.sparklineH;
          const values = buckets.map(b => b[field] || 0);
          const maxVal = Math.max(...values, 1);
          const stepX = w / Math.max(values.length - 1, 1);
          return values.map((v, i) => {
            const x = i * stepX;
            const y = h - (v / maxVal) * (h - 2) - 1;
            return x + ',' + y;
          }).join(' ');
        },

        // ========================= GRAPH =========================
        graphX(idx) {
          const margin = this.graphMargin;
          const data = this.graphData;
          const w = this.graphWidth - margin.left - margin.right;
          return margin.left + (idx / Math.max(data.length - 1, 1)) * w;
        },

        graphY(val, maxVal) {
          const margin = this.graphMargin;
          const h = this.graphHeight - margin.top - margin.bottom;
          const max = maxVal || 1;
          return margin.top + h - (val / max) * h;
        },

        graphLinePoints(field) {
          const data = this.graphData;
          if (!data.length) return '';
          const fieldValues = data.map(b => b[field] || 0);
          const maxVal = Math.max(...fieldValues, 1);
          if (field === 'avgDurationMs') {
            this.graphMaxDuration = maxVal;
          } else {
            this.graphMaxCount = maxVal;
          }
          const margin = this.graphMargin;
          const w = this.graphWidth - margin.left - margin.right;
          const h = this.graphHeight - margin.top - margin.bottom;
          return data.map((b, i) => {
            const x = margin.left + (i / Math.max(data.length - 1, 1)) * w;
            const y = margin.top + h - ((b[field] || 0) / maxVal) * h;
            return x + ',' + y;
          }).join(' ');
        },

        countAreaPoints() {
          const data = this.graphData;
          if (!data.length) return '';
          const margin = this.graphMargin;
          const w = this.graphWidth - margin.left - margin.right;
          const h = this.graphHeight - margin.top - margin.bottom;
          const values = data.map(b => b.count || 0);
          const maxVal = Math.max(...values, 1);
          const bottom = margin.top + h;
          let points = margin.left + ',' + bottom;
          data.forEach((b, i) => {
            const x = margin.left + (i / Math.max(data.length - 1, 1)) * w;
            const y = margin.top + h - ((b.count || 0) / maxVal) * h;
            points += ' ' + x + ',' + y;
          });
          points += ' ' + (margin.left + w) + ',' + bottom;
          return points;
        },

        // ========================= STATS LOADING COMPAT =========================
        get statsLoading() {
          return this.loading.stats;
        }
      }
    }
  </script>
</body>
