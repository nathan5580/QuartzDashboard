<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring (quartz crystal outline) -->
  <rect x="96" y="96" width="320" height="320" rx="64" stroke="url(#acc)" stroke-width="16" fill="none" opacity="0.3"/>
  <!-- Inner ring (dashboard) -->
  <rect x="148" y="148" width="216" height="216" rx="40" stroke="url(#inner)" stroke-width="10" fill="none"/>
  <!-- Dashboard grid lines -->
  <line x1="256" y1="148" x2="256" y2="364" stroke="url(#acc)" stroke-width="6" opacity="0.4"/>
  <line x1="148" y1="256" x2="364" y2="256" stroke="url(#acc)" stroke-width="6" opacity="0.4"/>
  <!-- Center quartz crystal -->
  <polygon points="256,180 310,220 310,292 256,332 202,292 202,220" fill="url(#acc)" opacity="0.15" stroke="url(#acc)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Central dot -->
  <circle cx="256" cy="256" r="24" fill="url(#acc)"/>
  <!-- Sparkle dots -->
  <circle cx="310" cy="220" r="6" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="202" cy="292" r="6" fill="#a5b4fc" opacity="0.6"/>
  <!-- Signal wave arcs -->
  <path d="M 160 200 Q 200 160 256 160" stroke="#a5b4fc" stroke-width="5" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M 352 312 Q 312 352 256 352" stroke="#a5b4fc" stroke-width="5" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>