<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#cbd5e1" stroke-width="1"/>
  </g>
  <!-- Logo area -->
  <rect x="100" y="140" width="120" height="120" rx="32" stroke="url(#acc)" stroke-width="6" fill="none" opacity="0.5"/>
  <polygon points="160,170 194,197 194,228 160,250 126,228 126,197" fill="none" stroke="url(#acc)" stroke-width="6"/>
  <circle cx="160" cy="210" r="10" fill="url(#acc)"/>
  <!-- Title -->
  <text x="260" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#e2e8f0">QuartzDashboard</text>
  <text x="260" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#818cf8">Quartz.NET Scheduler Dashboard</text>
  <!-- Code snippet mockup -->
  <rect x="100" y="310" width="480" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="330" width="10" height="10" rx="5" fill="#ef4444"/>
  <rect x="138" y="330" width="10" height="10" rx="5" fill="#f59e0b"/>
  <rect x="156" y="330" width="10" height="10" rx="5" fill="#22c55e"/>
  <text x="120" y="375" font-family="ui-monospace, monospace" font-size="16" fill="#a5b4fc">services.AddQuartzDashboard(options =&gt;</text>
  <text x="120" y="405" font-family="ui-monospace, monospace" font-size="16" fill="#a5b4fc">{</text>
  <text x="140" y="435" font-family="ui-monospace, monospace" font-size="16" fill="#c084fc">    options.ReadOnly = false;</text>
  <text x="120" y="465" font-family="ui-monospace, monospace" font-size="16" fill="#a5b4fc">});</text>
  <text x="120" y="505" font-family="ui-monospace, monospace" font-size="16" fill="#a5b4fc">app.UseQuartzDashboard();</text>
  <text x="120" y="545" font-family="ui-monospace, monospace" font-size="16" fill="#64748b">// Done. Open /quartz in your browser</text>
  <!-- Feature pills -->
  <rect x="640" y="140" width="260" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="660" y="173" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">⚡ Real-time SignalR</text>
  <rect x="920" y="140" width="280" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="940" y="173" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">📊 Live Execution Graphs</text>
  <rect x="640" y="210" width="230" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="660" y="243" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">🔍 Global Search (⌘K)</text>
  <rect x="890" y="210" width="310" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="910" y="243" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">🕒 Cron Tester + Timeline</text>
  <rect x="640" y="280" width="240" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="660" y="313" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">🔐 Auth Integration</text>
  <rect x="900" y="280" width="300" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="920" y="313" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">🏥 Health Dashboard</text>
  <!-- Bottom tagline -->
  <text x="640" y="620" font-family="system-ui, sans-serif" font-size="28" fill="#818cf8" font-weight="600">NuGet: Dot.QuartzDashboard</text>
  <text x="1040" y="620" font-family="ui-monospace, monospace" font-size="18" fill="#475569">MIT License</text>
</svg>